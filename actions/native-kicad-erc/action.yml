name: pcbex native KiCad ERC
description: Run or freshly replay authenticated native KiCad schematic ERC evidence without requiring a PCB board.
author: pcbex contributors

branding:
  icon: check-circle
  color: green

inputs:
  mode:
    description: "Native ERC evidence mode: run a fresh KiCad check or verify a retained report by replaying KiCad."
    required: false
    default: run
  schematic:
    description: Caller-workspace-relative KiCad schematic to verify.
    required: true
  warning-policy:
    description: Optional closed native ERC warning-policy JSON file.
    required: false
    default: ""
  report:
    description: Caller-workspace-relative retained normalized native ERC report; required only when mode is verify.
    required: false
    default: ""
  kicad-cli:
    description: Trusted KiCad CLI executable; do not select it from pull-request-controlled content.
    required: false
    default: kicad-cli
  require-approved:
    description: Fail after evidence publication unless the normalized native ERC report is approved.
    required: false
    default: "false"
  output-dir:
    description: Empty caller-relative literal directory; components use only ASCII letters, digits, dot, underscore, or hyphen.
    required: false
    default: pcbex-native-kicad-erc
  upload-artifact:
    description: Upload the bounded native ERC evidence directory.
    required: false
    default: "true"
  artifact-name:
    description: GitHub Actions artifact name for retained native ERC evidence.
    required: false
    default: pcbex-native-kicad-erc
  retention-days:
    description: Artifact retention in days from 1 through 90.
    required: false
    default: "14"

outputs:
  status:
    description: Verified run/replay status, either ok or error.
    value: ${{ steps.native-erc.outputs.status }}
  artifact-dir:
    description: Bounded caller-workspace-relative evidence directory.
    value: ${{ steps.native-erc.outputs.artifact-dir }}
  native-kicad-erc-report:
    description: Fixed generated or freshly re-authenticated normalized native KiCad ERC report path.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-report }}
  native-kicad-erc-schema-version:
    description: Native KiCad ERC report schema version.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-schema-version }}
  native-kicad-erc-approved:
    description: Whether the normalized native KiCad ERC report is approved.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-approved }}
  native-kicad-erc-error-count:
    description: Native KiCad ERC error count.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-error-count }}
  native-kicad-erc-warning-count:
    description: Native warning count, empty for report schema v1.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-warning-count }}
  native-kicad-erc-policy-failure-count:
    description: Warning-policy failure count, empty for report schema v1.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-policy-failure-count }}
  native-kicad-erc-warning-policy-sha256:
    description: Canonical warning-policy digest, empty for report schema v1.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-warning-policy-sha256 }}
  native-kicad-erc-warning-policy-source-bytes:
    description: Exact warning-policy source bytes, empty for report schema v1.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-warning-policy-source-bytes }}
  native-kicad-erc-warning-policy-source-sha256:
    description: Exact warning-policy source SHA-256, empty for report schema v1.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-warning-policy-source-sha256 }}
  native-kicad-erc-run-sha256:
    description: Domain-separated normalized native KiCad ERC run identity.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-run-sha256 }}
  native-kicad-erc-report-bytes:
    description: Exact retained report byte count.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-report-bytes }}
  native-kicad-erc-report-sha256:
    description: Exact retained report SHA-256.
    value: ${{ steps.native-erc.outputs.native-kicad-erc-report-sha256 }}

runs:
  using: composite
  steps:
    - name: Validate native ERC Action inputs
      id: preflight
      shell: bash
      env:
        PCBEX_MODE: ${{ inputs.mode }}
        PCBEX_SCHEMATIC: ${{ inputs.schematic }}
        PCBEX_WARNING_POLICY: ${{ inputs.warning-policy }}
        PCBEX_REPORT: ${{ inputs.report }}
        PCBEX_KICAD_CLI: ${{ inputs.kicad-cli }}
        PCBEX_REQUIRE_APPROVED: ${{ inputs.require-approved }}
        PCBEX_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
        PCBEX_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        PCBEX_RETENTION_DAYS: ${{ inputs.retention-days }}
        PCBEX_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        repository_root="$(cd -- "$GITHUB_ACTION_PATH/../.." && pwd -P)"
        if [[ -z "$PCBEX_SCHEMATIC" ]]; then
          echo "schematic must not be empty" >&2
          exit 2
        fi
        case "$PCBEX_MODE" in
          run|verify) ;;
          *) echo "mode must be run or verify" >&2; exit 2 ;;
        esac
        if [[ "$PCBEX_MODE" == "run" && -n "$PCBEX_REPORT" ]]; then
          echo "report must be empty when mode is run" >&2
          exit 2
        fi
        if [[ "$PCBEX_MODE" == "verify" && -z "$PCBEX_REPORT" ]]; then
          echo "report must not be empty when mode is verify" >&2
          exit 2
        fi
        if [[ -z "$PCBEX_KICAD_CLI" ]]; then
          echo "kicad-cli must not be empty" >&2
          exit 2
        fi
        case "$PCBEX_REQUIRE_APPROVED" in
          true|false) ;;
          *) echo "require-approved must be true or false" >&2; exit 2 ;;
        esac
        case "$PCBEX_UPLOAD_ARTIFACT" in
          true|false) ;;
          *) echo "upload-artifact must be true or false" >&2; exit 2 ;;
        esac
        if [[ -z "$PCBEX_ARTIFACT_NAME" ]]; then
          echo "artifact-name must not be empty" >&2
          exit 2
        fi
        if [[ ! "$PCBEX_RETENTION_DAYS" =~ ^([1-9]|[1-8][0-9]|90)$ ]]; then
          echo "retention-days must be an integer from 1 through 90" >&2
          exit 2
        fi
        python3 "$repository_root/scripts/ci_runtime.py" validate-input \
          "--path=$PCBEX_SCHEMATIC"
        if [[ -n "$PCBEX_WARNING_POLICY" ]]; then
          python3 "$repository_root/scripts/ci_runtime.py" validate-input \
            "--path=$PCBEX_WARNING_POLICY"
        fi
        if [[ "$PCBEX_MODE" == "verify" ]]; then
          python3 "$repository_root/scripts/ci_runtime.py" validate-input \
            "--path=$PCBEX_REPORT"
        fi
        python3 "$repository_root/scripts/ci_runtime.py" validate-output \
          "--output-root=$PCBEX_OUTPUT_DIR"
        echo "valid=true" >> "$GITHUB_OUTPUT"

    - name: Build pcbex
      id: build
      shell: bash
      run: |
        set -euo pipefail
        repository_root="$(cd -- "$GITHUB_ACTION_PATH/../.." && pwd -P)"
        python3 "$repository_root/scripts/ci_runtime.py" exec \
          --timeout-seconds 600 \
          --max-stdout-bytes 8388608 \
          --max-stderr-bytes 8388608 \
          -- rustup toolchain install stable --profile minimal
        python3 "$repository_root/scripts/ci_runtime.py" exec \
          --timeout-seconds 1800 \
          --max-stdout-bytes 8388608 \
          --max-stderr-bytes 8388608 \
          -- cargo +stable build \
            --manifest-path "$repository_root/Cargo.toml" \
            --package pcbex \
            --release \
            --locked
        target_directory="$(
          python3 "$repository_root/scripts/ci_runtime.py" exec \
            --timeout-seconds 60 \
            --max-stdout-bytes 1048576 \
            --max-stderr-bytes 1048576 \
            -- cargo +stable metadata \
              --manifest-path "$repository_root/Cargo.toml" \
              --format-version 1 \
              --no-deps |
          python3 -c 'import json,sys; value=json.load(sys.stdin)["target_directory"]; valid=isinstance(value,str) and bool(value) and not any(ord(c)<32 or ord(c)==127 for c in value); sys.exit(2) if not valid else print(value,end="")'
        )"
        binary="$target_directory/release/pcbex"
        if [[ ! -x "$binary" && -x "${binary}.exe" ]]; then
          binary="${binary}.exe"
        fi
        if [[ ! -f "$binary" || ! -x "$binary" ]]; then
          echo "built pcbex binary is unavailable" >&2
          exit 2
        fi
        printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
        printf 'repository-root=%s\n' "$repository_root" >> "$GITHUB_OUTPUT"

    - name: Run or replay boardless native KiCad ERC
      id: native-erc
      shell: bash
      env:
        PCBEX_BINARY: ${{ steps.build.outputs.binary }}
        PCBEX_NATIVE_KICAD_ERC_MODE: ${{ inputs.mode }}
        PCBEX_NATIVE_KICAD_ERC_SCHEMATIC: ${{ inputs.schematic }}
        PCBEX_NATIVE_KICAD_ERC_WARNING_POLICY: ${{ inputs.warning-policy }}
        PCBEX_NATIVE_KICAD_ERC_REPORT: ${{ inputs.report }}
        PCBEX_NATIVE_KICAD_ERC_KICAD_CLI: ${{ inputs.kicad-cli }}
        PCBEX_NATIVE_KICAD_ERC_REQUIRE_APPROVED: ${{ inputs.require-approved }}
        PCBEX_OUTPUT_DIR: ${{ inputs.output-dir }}
        PCBEX_REPOSITORY_ROOT: ${{ steps.build.outputs.repository-root }}
      run: >-
        python3 "$PCBEX_REPOSITORY_ROOT/scripts/ci_runtime.py" exec
        --timeout-seconds 900
        --max-stdout-bytes 1048576
        --max-stderr-bytes 8388608
        --output-root="$PCBEX_OUTPUT_DIR"
        -- "$PCBEX_REPOSITORY_ROOT/scripts/native-kicad-erc-action.sh"

    - name: Validate bounded native ERC evidence
      id: artifact-boundary
      if: ${{ always() && steps.native-erc.outputs.artifact-dir != '' }}
      shell: bash
      env:
        PCBEX_OUTPUT_DIR: ${{ inputs.output-dir }}
        PCBEX_REPOSITORY_ROOT: ${{ steps.build.outputs.repository-root }}
      run: |
        python3 "$PCBEX_REPOSITORY_ROOT/scripts/ci_runtime.py" scan \
          "--output-root=$PCBEX_OUTPUT_DIR" \
          --max-entries 16 \
          --max-depth 2 \
          --max-file-bytes 33554432 \
          --max-total-bytes 33554432
        echo "safe=true" >> "$GITHUB_OUTPUT"

    - name: Upload native ERC evidence
      id: upload
      if: ${{ always() && steps.artifact-boundary.outputs.safe == 'true' && inputs.upload-artifact == 'true' && steps.native-erc.outputs.artifact-dir != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.native-erc.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Enforce native ERC gate
      if: ${{ always() }}
      shell: bash
      env:
        PCBEX_PREFLIGHT_VALID: ${{ steps.preflight.outputs.valid }}
        PCBEX_NATIVE_ERC_OUTCOME: ${{ steps.native-erc.outcome }}
        PCBEX_NATIVE_ERC_STATUS: ${{ steps.native-erc.outputs.status }}
        PCBEX_NATIVE_ERC_REPORT: ${{ steps.native-erc.outputs.native-kicad-erc-report }}
        PCBEX_NATIVE_ERC_APPROVED: ${{ steps.native-erc.outputs.native-kicad-erc-approved }}
        PCBEX_ARTIFACT_SAFE: ${{ steps.artifact-boundary.outputs.safe }}
        PCBEX_UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
        PCBEX_UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        PCBEX_REQUIRE_APPROVED: ${{ inputs.require-approved }}
      run: "$GITHUB_ACTION_PATH/../../scripts/native-kicad-erc-action-gate.sh"
