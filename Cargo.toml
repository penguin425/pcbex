[workspace]
members = ["crates/pcbex-core", "crates/pcbex-kicad", "crates/pcbex-cli"]
resolver = "2"

[workspace.package]
version = "1.400.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = "3"
getrandom = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "8.2", default-features = false, features = ["deflate"] }
tempfile = "3"
