[workspace]
members = ["crates/pcbex-core", "crates/pcbex-kicad", "crates/pcbex-cli"]
resolver = "2"

[workspace.package]
version = "1.153.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
