    value: ${{ steps.analyze.outputs.schematic-approval-met }}
  approval-log-verification:
    description: Verified approval transparency-log report path, when supplied.
    value: ${{ steps.analyze.outputs.approval-log-verification }}
  approval-log-verified:
    description: Whether the complete approval hash chain and checkpoint verified.
    value: ${{ steps.analyze.outputs.approval-log-verified }}
  approval-log-anchor-verification:
    description: Verified public-log Merkle inclusion report path, when supplied.
    value: ${{ steps.analyze.outputs.approval-log-anchor-verification }}
  approval-log-anchored:
    description: Whether the exact checkpoint is included under a trusted signed tree head.
    value: ${{ steps.analyze.outputs.approval-log-anchored }}
  approval-log-consistency-verification:
    description: Verified append-only public-log consistency report path, when supplied.
    value: ${{ steps.analyze.outputs.approval-log-consistency-verification }}
  approval-log-consistent:
    description: Whether the current approval public-log tree extends the accepted previous tree.
    value: ${{ steps.analyze.outputs.approval-log-consistent }}
  approval-log-gossip-verification:
    description: Verified independent public-log observation report path, when supplied.
    value: ${{ steps.analyze.outputs.approval-log-gossip-verification }}
  approval-log-gossip-verified:
    description: Whether the independent observation is fresh and consistent with the local anchor.
    value: ${{ steps.analyze.outputs.approval-log-gossip-verified }}
  approval-log-gossip-quorum:
    description: Verified distinct-organization approval public-log gossip quorum report.
    value: ${{ steps.analyze.outputs.approval-log-gossip-quorum }}
  approval-log-gossip-quorum-met:
    description: Whether fresh consistent gossip observations meet the organization threshold.
    value: ${{ steps.analyze.outputs.approval-log-gossip-quorum-met }}
  approval-log-gossip-organization-registry-history-audit:
    description: Deterministic genesis-to-head approval gossip registry history audit path.
    value: ${{ steps.analyze.outputs.approval-log-gossip-organization-registry-history-audit }}
  approval-log-gossip-organization-registry-history-final:
    description: Final approval gossip registry computed exclusively by replaying the supplied history.
    value: ${{ steps.analyze.outputs.approval-log-gossip-organization-registry-history-final }}
  approval-log-gossip-organization-registry-history-checkpoint-trust-state:
    description: Monotonic locally accepted registry-history checkpoint trust state.
    value: ${{ steps.analyze.outputs.approval-log-gossip-organization-registry-history-checkpoint-trust-state }}
  approval-log-gossip-organization-registry-history-checkpoint-witness-quorum:
    description: Verified fresh and distinct registry-history checkpoint witness quorum.
    value: ${{ steps.analyze.outputs.approval-log-gossip-organization-registry-history-checkpoint-witness-quorum }}
  approval-log-gossip-organization-registry-history-checkpoint-witness-quorum-met:
    description: Whether the registry-history checkpoint witness threshold passed.
    value: ${{ steps.analyze.outputs.approval-log-gossip-organization-registry-history-checkpoint-witness-quorum-met }}
  approval-log-gossip-organization-registry-history-checkpoint-remote-witnesses:
    description: Directory containing immediately verified remote registry-history witnesses.
    value: ${{ steps.analyze.outputs.approval-log-gossip-organization-registry-history-checkpoint-remote-witnesses }}
  approval-log-gossip-organization-registry-history-checkpoint-remote-witness-receipts:
    description: Directory containing hash-bound remote registry-history transport receipts.
    value: ${{ steps.analyze.outputs.approval-log-gossip-organization-registry-history-checkpoint-remote-witness-receipts }}
  approval-log-remote-gossip-observations:
    description: Directory containing verified remote gossip observation envelopes.
    value: ${{ steps.analyze.outputs.approval-log-remote-gossip-observations }}
  approval-log-remote-gossip-receipts:
    description: Directory containing hash-bound remote gossip transport receipts.
    value: ${{ steps.analyze.outputs.approval-log-remote-gossip-receipts }}
  approval-log-witness-quorum:
    description: Verified approval-log witness quorum report path, when supplied.
    value: ${{ steps.analyze.outputs.approval-log-witness-quorum }}
  approval-log-witness-quorum-met:
    description: Whether the independent approval-log witness threshold passed.
    value: ${{ steps.analyze.outputs.approval-log-witness-quorum-met }}
  remote-witness:
    description: Cryptographically verified remote approval-log witness path, when requested.
    value: ${{ steps.analyze.outputs.remote-witness }}
  remote-witness-receipt:
    description: Hash-bound remote witness HTTP transport receipt path, when requested.
    value: ${{ steps.analyze.outputs.remote-witness-receipt }}

runs:
  using: composite
  steps:
    - name: Build pcbex
      id: build
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal
        cargo +stable build \
          --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml" \
          --package pcbex \
          --release \
          --locked
        echo "binary=$GITHUB_ACTION_PATH/target/release/pcbex" >> "$GITHUB_OUTPUT"

    - name: Analyze hardware
      id: analyze
      shell: bash
      env:
        PCBEX_BINARY: ${{ steps.build.outputs.binary }}
        PCBEX_BOARD: ${{ inputs.board }}
        PCBEX_BASELINE_BOARD: ${{ inputs.baseline-board }}
