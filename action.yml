name: pcbex hardware CI
description: Analyze a KiCad PCB, publish CI evidence, update PR comments, and gate regressions.
author: pcbex contributors

branding:
  icon: cpu
  color: blue

inputs:
  board:
    description: Path to the current .kicad_pcb file in the caller workspace.
    required: true
  baseline-board:
    description: Optional path to a baseline .kicad_pcb file.
    required: false
    default: ""
  schematic:
    description: Optional current .kicad_sch file for semantic review.
    required: false
    default: ""
  baseline-schematic:
    description: Optional accepted .kicad_sch file; required together with schematic.
    required: false
    default: ""
  schematic-reviewer-routing-policy:
    description: Optional strict reviewer-routing policy applied to the schematic semantic diff.
    required: false
    default: ""
  fab:
    description: Optional built-in fabrication profile ID or stable alias.
    required: false
    default: ""
  fab-profile:
    description: Optional strict external DFM profile JSON path; mutually exclusive with fab.
    required: false
    default: ""
  policy-pack:
    description: Optional unsigned organization policy pack; mutually exclusive with physical-policy alternatives.
    required: false
    default: ""
  signed-policy-pack:
    description: Optional signed organization policy pack; requires policy-public-key.
    required: false
    default: ""
  policy-pack-url:
    description: Optional HTTPS registry URL returning a signed organization policy pack.
    required: false
    default: ""
  policy-public-key:
    description: Trusted Ed25519 public-key file used with signed-policy-pack or policy-pack-url.
    required: false
    default: ""
  policy-trust-state:
    description: Optional previously accepted trust state used to reject signed-pack rollback or equivocation.
    required: false
    default: ""
  policy-pack-bearer-token:
    description: Optional Bearer token for policy-pack-url; kept out of process arguments and receipts.
    required: false
    default: ""
  policy-pack-timeout-seconds:
    description: Total timeout for policy-pack-url retrieval.
    required: false
    default: "30"
  manufacturing-feedback-declaration:
    description: Optional strict fabrication feedback declaration bound to the analyzed board.
    required: false
    default: ""
  manufacturing-feedback-artifacts:
    description: Newline-separated fabrication or inspection artifact paths required by a feedback declaration.
    required: false
    default: ""
  policy-recommendation-feedback-files:
    description: Optional newline-separated historical bound feedback files, paired with policy-recommendation-analysis-manifests.
    required: false
    default: ""
  policy-recommendation-analysis-manifests:
    description: Optional newline-separated exact run.json files bound by the historical feedback inputs.
    required: false
    default: ""
  policy-recommendation-generated-on:
    description: Opt-in deterministic YYYY-MM-DD date for a proposal-only DFM tightening report.
    required: false
    default: ""
  policy-recommendation-minimum-occurrences:
    description: Independent feedback IDs required before one tightening is proposed.
    required: false
    default: "2"
  policy-rollout-project-id:
    description: Optional stable project ID that reruns the current board with the recommendation-derived simulation profile.
    required: false
    default: ""
  policy-rollout-recommendation:
    description: Optional existing governed recommendation used for rollout simulation instead of the recommendation generated in this run.
    required: false
    default: ""
  policy-rollout-generated-on:
    description: Deterministic YYYY-MM-DD date for the simulation profile and rollout report.
    required: false
    default: ""
  canary-rollout-report:
    description: Optional existing simulation-only rollout report to authorize; defaults to the rollout produced in this run.
    required: false
    default: ""
  canary-rollout-approval-files:
    description: Newline-separated signed human rollout approvals bound to one canary scope and validity window.
    required: false
    default: ""
  canary-rollout-evaluated-at-unix:
    description: Explicit Unix timestamp used to evaluate the approval validity window.
    required: false
    default: ""
  canary-rollout-minimum-approvals:
    description: Minimum distinct trusted human approvals required for canary authorization.
    required: false
    default: "2"
  fail-on-canary-rollout-authorization:
    description: Fail unless the supplied canary rollout approvals authorize the bounded rollout.
    required: false
    default: "false"
  canary-monitoring-project-id:
    description: Optional authorized canary project ID whose observed analysis is compared with its exact baseline.
    required: false
    default: ""
  canary-monitoring-baseline-analysis:
    description: Exact baseline analysis directory retained by the authorized rollout.
    required: false
    default: ""
  canary-monitoring-observed-analysis:
    description: Observed canary analysis directory produced with the authorized candidate profile.
    required: false
    default: ""
  canary-monitoring-observed-at-unix:
    description: Explicit Unix timestamp for the bound canary observation.
    required: false
    default: ""
  fail-on-canary-monitoring:
    description: Fail unless complete bound canary monitoring is eligible for human promotion review.
    required: false
    default: "false"
  canary-completion-monitoring-report:
    description: Optional existing bound monitoring report; defaults to monitoring produced in this run.
    required: false
    default: ""
  canary-completion-decision-files:
    description: Newline-separated signed human promotion or rollback decisions.
    required: false
    default: ""
  canary-completion-minimum-decisions:
    description: Minimum distinct trusted human decisions required to finalize the canary.
    required: false
    default: "2"
  fail-on-canary-completion:
    description: Fail unless a unanimous trusted canary completion quorum is finalized.
    required: false
    default: "false"
  policy-deployment-source-trust-state:
    description: Accepted signed-policy trust state exactly matching the source policy pack.
    required: false
    default: ""
  policy-deployment-candidate-trust-state:
    description: Accepted signed-policy trust state that monotonically advances the source signing root.
    required: false
    default: ""
  policy-deployment-candidate-policy-pack:
    description: Signed-and-accepted higher-revision policy pack containing the exact approved rollout profile.
    required: false
    default: ""
  policy-deployment-baseline-state:
    description: Optional previously retained hash-chained deployment state; required to confirm rollback.
    required: false
    default: ""
  policy-suspension-state-files:
    description: Newline-separated retained signed suspension states that deny exact candidate digests.
    required: false
    default: ""
  policy-remediation-state-files:
    description: Newline-separated independently verified remediation states for suspended policies.
    required: false
    default: ""
  policy-lifecycle-ledger-files:
    description: Newline-separated append-only lifecycle ledgers containing complete suspension and remediation evidence.
    required: false
    default: ""
  policy-deployment-recorded-at-unix:
    description: Opt-in Unix timestamp for advancing the monotonic deployment state.
    required: false
    default: ""
  fail-on-policy-deployment-promotion:
    description: Fail unless the finalized candidate is recorded as the active policy revision.
    required: false
    default: "false"
  policy-deployment-verification-state:
    description: Optional pending promoted deployment state; defaults to the state produced in this run.
    required: false
    default: ""
  policy-deployment-verification-project-id:
    description: Rollout project ID whose complete deployed evidence is being verified.
    required: false
    default: ""
  policy-deployment-verification-expected-analysis:
    description: Exact pre-deployment candidate analysis directory retained by the rollout.
    required: false
    default: ""
  policy-deployment-verification-observed-analysis:
    description: Production analysis directory generated with the exact active organization policy pack.
    required: false
    default: ""
  policy-deployment-verification-verified-at-unix:
    description: Explicit Unix timestamp for the post-deployment observation.
    required: false
    default: ""
  fail-on-policy-deployment-verification:
    description: Fail unless complete post-deployment evidence matches the approved candidate without regressions.
    required: false
    default: "false"
  policy-deployment-rollback-verification:
    description: Optional failed production-verification report; defaults to the report produced in this run.
    required: false
    default: ""
  policy-deployment-rollback-approval-files:
    description: Newline-separated trusted human approvals bound to the failed revision and retained restore target.
    required: false
    default: ""
  policy-deployment-rollback-minimum-approvals:
    description: Minimum distinct trusted human approvals required to apply production rollback.
    required: false
    default: "2"
  policy-deployment-rollback-recorded-at-unix:
    description: Opt-in Unix timestamp for retaining the dual-control rollback state.
    required: false
    default: ""
  fail-on-policy-deployment-rollback:
    description: Fail unless the failed policy revision is restored to its exact retained predecessor.
    required: false
    default: "false"
  policy-rollback-recovery-state:
    description: Optional dual-control rollback state; defaults to the rollback produced in this run.
    required: false
    default: ""
  policy-rollback-recovery-rollout:
    description: Exact rollout retaining the pre-promotion production baseline.
    required: false
    default: ""
  policy-rollback-recovery-deployment:
    description: Exact failed promoted deployment state bound by the rollback.
    required: false
    default: ""
  policy-rollback-recovery-failed-verification:
    description: Exact failed production verification bound by the rollback.
    required: false
    default: ""
  policy-rollback-recovery-previous-deployment:
    description: Exact deployment state active immediately before the failed promotion.
    required: false
    default: ""
  policy-rollback-recovery-baseline-verification:
    description: Clean full-fleet verification of the previous deployment retained before promotion.
    required: false
    default: ""
  policy-rollback-recovery-restored-policy-pack:
    description: Exact organization policy pack restored by the rollback.
    required: false
    default: ""
  policy-rollback-recovery-project-id:
    description: Rollout project ID whose restored production evidence is being verified.
    required: false
    default: ""
  policy-rollback-recovery-expected-analysis:
    description: Exact pre-promotion production analysis retained by the rollout.
    required: false
    default: ""
  policy-rollback-recovery-observed-analysis:
    description: Restored production analysis generated with the exact restored policy pack.
    required: false
    default: ""
  policy-rollback-recovery-verified-at-unix:
    description: Explicit Unix timestamp for restored-fleet verification.
    required: false
    default: ""
  rollback-incident-acknowledgment:
    description: Independent trusted operator acknowledgment bound to clean recovery evidence.
    required: false
    default: ""
  rollback-incident-closed-at-unix:
    description: Opt-in Unix timestamp for retaining the closed rollback incident.
    required: false
    default: ""
  fail-on-policy-rollback-recovery:
    description: Fail unless complete restored-fleet evidence is clean.
    required: false
    default: "false"
  fail-on-rollback-incident-closure:
    description: Fail unless clean recovery has an independent trusted operator acknowledgment.
    required: false
    default: "false"
  record-policy-incident:
    description: Append the closed rollback incident to a hash-chained operational ledger.
    required: false
    default: "false"
  policy-incident-ledger-baseline:
    description: Optional previously retained policy-incident ledger.
    required: false
    default: ""
  policy-incident-suspension-threshold:
    description: Repeated incidents for one failed revision before human suspension review is required.
    required: false
    default: "2"
  fail-on-policy-incident-suspension-review:
    description: Fail when repeated incidents require a human decision about suspending a policy revision.
    required: false
    default: "false"
  policy-suspension-ledger:
    description: Repeated-incident ledger; defaults to the ledger produced in this run.
    required: false
    default: ""
  policy-suspension-policy-pack:
    description: Policy pack containing the trusted human suspension keys; defaults to the effective policy.
    required: false
    default: ""
  policy-suspension-failed-revision:
    description: Repeatedly failed revision selected for a human suspension decision.
    required: false
    default: ""
  policy-suspension-failed-policy-pack-sha256:
    description: Exact repeatedly failed policy-pack digest selected for review.
    required: false
    default: ""
  policy-suspension-decision-files:
    description: Newline-separated signed human suspend or continue decisions.
    required: false
    default: ""
  policy-suspension-minimum-decisions:
    description: Minimum distinct trusted human decisions required.
    required: false
    default: "2"
  policy-suspension-recorded-at-unix:
    description: Opt-in Unix timestamp for retaining the unanimous suspension decision.
    required: false
    default: ""
  fail-on-policy-suspension:
    description: Fail unless the reviewed failed policy digest is explicitly suspended.
    required: false
    default: "false"
  policy-remediation-suspension-state:
    description: Suspended policy state to remediate.
    required: false
    default: ""
  policy-remediation-candidate-policy-pack:
    description: Accepted successor policy pack proposed as remediation.
    required: false
    default: ""
  policy-remediation-candidate-trust-state:
    description: Accepted trust state for the exact remediation candidate.
    required: false
    default: ""
  policy-remediation-rollout:
    description: Simulation rollout for the remediation candidate.
    required: false
    default: ""
  policy-remediation-monitoring:
    description: Complete clean canary monitoring for the remediation candidate.
    required: false
    default: ""
  policy-remediation-approval-files:
    description: Newline-separated independent signed remediation approvals.
    required: false
    default: ""
  policy-remediation-minimum-approvals:
    description: Minimum independent remediation approvals required.
    required: false
    default: "2"
  policy-remediation-recorded-at-unix:
    description: Opt-in Unix timestamp for retaining verified remediation.
    required: false
    default: ""
  fail-on-policy-remediation:
    description: Fail unless an exact successor remediation is independently verified.
    required: false
    default: "false"
  policy-lifecycle-event-type:
    description: Optional lifecycle event to append; must be suspension or remediation.
    required: false
    default: ""
  policy-lifecycle-baseline-ledger:
    description: Previously retained append-only suspension/remediation lifecycle ledger.
    required: false
    default: ""
  policy-lifecycle-suspension-state:
    description: Suspension state to append; defaults to the state produced in this run.
    required: false
    default: ""
  policy-lifecycle-remediation-state:
    description: Remediation state to append; defaults to the state produced in this run.
    required: false
    default: ""
  fail-on-policy-lifecycle-pending:
    description: Fail when the resulting lifecycle still contains a suspension awaiting remediation.
    required: false
    default: "false"
  policy-lifecycle-checkpoint-ledger:
    description: Exact append-only lifecycle ledger authenticated by the supplied signed checkpoint.
    required: false
    default: ""
  policy-lifecycle-checkpoint:
    description: Signed monotonic checkpoint for the exact lifecycle ledger.
    required: false
    default: ""
  policy-lifecycle-checkpoint-public-key:
    description: Trusted Ed25519 public-key file for the lifecycle checkpoint signer.
    required: false
    default: ""
  policy-lifecycle-checkpoint-baseline-state:
    description: Previously accepted lifecycle trust state used to reject rollback, equivocation, and forks.
    required: false
    default: ""
  policy-lifecycle-checkpoint-key-rotation:
    description: Optional old-and-new dual-signed key transition required when the checkpoint signing root changes.
    required: false
    default: ""
  policy-lifecycle-checkpoint-accepted-at-unix:
    description: Explicit Unix timestamp used to enforce the checkpoint acceptance window.
    required: false
    default: ""
  fail-on-policy-lifecycle-checkpoint:
    description: Fail unless a signed lifecycle checkpoint is accepted monotonically.
    required: false
    default: "false"
  policy-lifecycle-witness-trust-state:
    description: Accepted lifecycle trust state to witness; defaults to the state verified in this run.
    required: false
    default: ""
  policy-lifecycle-witness-files:
    description: Newline-separated independent signed lifecycle checkpoint witnesses.
    required: false
    default: ""
  policy-lifecycle-witness-public-key-files:
    description: Newline-separated trusted witness public-key files paired with witness files.
    required: false
    default: ""
  policy-lifecycle-witness-key-trust-state-files:
    description: Newline-separated rotatable identity-bound witness-key trust states; mutually exclusive with witness public keys.
    required: false
    default: ""
  policy-lifecycle-witness-minimum:
    description: Minimum distinct trusted lifecycle witnesses required.
    required: false
    default: "2"
  policy-lifecycle-witness-evaluated-at-unix:
    description: Explicit Unix timestamp used to enforce witness freshness.
    required: false
    default: ""
  policy-lifecycle-remote-witness-endpoints:
    description: Newline-separated HTTPS lifecycle-witness service endpoints.
    required: false
    default: ""
  policy-lifecycle-remote-witness-public-key-files:
    description: Newline-separated trusted public-key files paired with remote lifecycle-witness endpoints.
    required: false
    default: ""
  policy-lifecycle-remote-witness-key-trust-state-files:
    description: Newline-separated rotatable identity-bound witness-key trust states paired with remote endpoints; mutually exclusive with remote public keys.
    required: false
    default: ""
  policy-lifecycle-remote-witness-bearer-token:
    description: Optional Bearer token sent only to configured lifecycle-witness services.
    required: false
    default: ""
  policy-lifecycle-remote-witness-timeout-seconds:
    description: End-to-end timeout for each remote lifecycle-witness request.
    required: false
    default: "30"
  fail-on-policy-lifecycle-witness-quorum:
    description: Fail unless the independent lifecycle checkpoint witness quorum is met.
    required: false
    default: "false"
  policy-lifecycle-log-anchor-proof:
    description: Signed Merkle inclusion proof for the configured lifecycle checkpoint.
    required: false
    default: ""
  policy-lifecycle-log-anchor-id:
    description: Separately trusted lifecycle public-log identity.
    required: false
    default: ""
  policy-lifecycle-log-anchor-public-key:
    description: Trusted Ed25519 public-key file for the lifecycle public-log tree head.
    required: false
    default: ""
  fail-on-policy-lifecycle-log-anchor:
    description: Fail unless the configured lifecycle checkpoint has a valid public-log anchor.
    required: false
    default: "false"
  policy-lifecycle-log-previous-anchor-proof:
    description: Previously accepted lifecycle public-log anchor used as the consistency baseline.
    required: false
    default: ""
  policy-lifecycle-log-consistency-proof:
    description: RFC 6962-style proof that the current signed tree extends the previous anchor.
    required: false
    default: ""
  fail-on-policy-lifecycle-log-consistency:
    description: Fail unless the current lifecycle public log consistently extends the retained anchor.
    required: false
    default: "false"
  policy-lifecycle-log-gossip-receipt:
    description: Independently signed observation of a trusted lifecycle public-log tree head.
    required: false
    default: ""
  policy-lifecycle-log-gossip-observer-id:
    description: Separately trusted identity that signed the lifecycle public-log observation.
    required: false
    default: ""
  policy-lifecycle-log-gossip-observer-public-key:
    description: Trusted Ed25519 public-key file for the independent gossip observer.
    required: false
    default: ""
  policy-lifecycle-log-gossip-consistency-proof:
    description: Consistency proof between the observed and current tree heads when their sizes differ.
    required: false
    default: ""
  policy-lifecycle-log-gossip-evaluated-at-unix:
    description: Explicit evaluation time used to enforce the gossip receipt validity window.
    required: false
    default: ""
  fail-on-policy-lifecycle-log-gossip:
    description: Fail unless the configured independent tree-head observation is trusted and consistent.
    required: false
    default: "false"
  policy-lifecycle-log-gossip-observation-files:
    description: Newline-separated signed gossip observation envelopes from local observers.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-ids:
    description: Newline-separated trusted organization identities paired with local observations.
    required: false
    default: ""
  policy-lifecycle-log-gossip-observer-ids:
    description: Newline-separated trusted observer identities paired with local observations.
    required: false
    default: ""
  policy-lifecycle-log-gossip-observer-public-key-files:
    description: Newline-separated trusted observer keys paired with local observations.
    required: false
    default: ""
  policy-lifecycle-log-gossip-observer-trust-state-files:
    description: Newline-separated rotatable organization-bound observer trust states paired with local observations; mutually exclusive with direct organization, observer, and key inputs.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-trust-registry:
    description: Signed-transition-derived registry that must actively admit every local and remote observer trust state.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-authority-key-rotation:
    description: Optional old-and-new dual-signed authority-key transition applied to the retained gossip organization registry before quorum verification.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-governance:
    description: Optional root-signed distinct-authority threshold policy for the retained gossip organization registry.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-threshold-transition:
    description: Optional threshold-approved admission, suspension, or revocation applied before quorum verification; requires registry governance.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-governance-rotation-old:
    description: Retained root-signed governance policy for an optional dual-quorum governance rotation.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-governance-rotation-new:
    description: Successor root-signed governance policy for an optional dual-quorum governance rotation.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-governance-rotation:
    description: Optional old-and-new quorum approved governance rotation applied before threshold transitions and quorum verification.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-governed-authority-key-rotation:
    description: Optional retained-and-successor quorum approved registry-root rotation; reuses the old/new governance policy inputs and atomically replaces both root and active governance.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history:
    description: Optional complete typed registry event history replayed from genesis; mutually exclusive with a copied organization trust registry.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint:
    description: Optional retained-root-signed checkpoint for the supplied complete registry history.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-baseline:
    description: Optional previously accepted checkpoint trust state used to reject registry rollback or equivocation.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-accepted-at-unix:
    description: Explicit deterministic acceptance time for the registry-history checkpoint.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-witness-files:
    description: Newline-separated independent witness artifacts for the exact registry-history checkpoint.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-trusted-witness-ids:
    description: Newline-separated trusted witness identities paired with trusted public-key files.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-trusted-witness-public-key-files:
    description: Newline-separated trusted witness public-key files paired with witness identities.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-witness-trust-state-files:
    description: Newline-separated rotatable witness trust states; mutually exclusive with direct trusted witness IDs and keys.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-minimum-witnesses:
    description: Minimum distinct fresh witnesses required for the registry-history checkpoint.
    required: false
    default: "2"
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-evaluated-at-unix:
    description: Explicit deterministic evaluation time for registry-history checkpoint witnesses.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-remote-witness-endpoints:
    description: Newline-separated bounded HTTPS registry-history checkpoint witness endpoints.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-remote-witness-ids:
    description: Newline-separated trusted witness identities paired with remote public-key files.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-remote-witness-public-key-files:
    description: Newline-separated trusted public-key files paired with remote endpoints and identities.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-remote-witness-trust-state-files:
    description: Newline-separated rotatable witness trust states paired with remote endpoints; mutually exclusive with remote identities and keys.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-remote-witness-bearer-token:
    description: Optional Bearer token sent only to configured remote registry-history witness services.
    required: false
    default: ""
  policy-lifecycle-log-gossip-organization-registry-history-checkpoint-remote-witness-timeout-seconds:
    description: End-to-end timeout for each remote registry-history witness request.
    required: false
    default: "30"
  policy-lifecycle-log-gossip-minimum-organizations:
    description: Minimum distinct organizations required by the public-log gossip quorum.
    required: false
    default: "2"
  policy-lifecycle-log-remote-gossip-endpoints:
    description: Newline-separated bounded HTTPS public-log gossip observer endpoints.
    required: false
    default: ""
  policy-lifecycle-log-remote-gossip-organization-ids:
    description: Newline-separated trusted organizations paired with remote gossip endpoints.
    required: false
    default: ""
  policy-lifecycle-log-remote-gossip-observer-ids:
    description: Newline-separated trusted observer identities paired with remote gossip endpoints.
    required: false
    default: ""
  policy-lifecycle-log-remote-gossip-public-key-files:
    description: Newline-separated trusted observer keys paired with remote gossip endpoints.
    required: false
    default: ""
  policy-lifecycle-log-remote-gossip-trust-state-files:
    description: Newline-separated rotatable organization-bound observer trust states paired with remote endpoints; mutually exclusive with direct organization, observer, and key inputs.
    required: false
    default: ""
  policy-lifecycle-log-remote-gossip-bearer-token:
    description: Optional Bearer token sent only to configured remote gossip observers.
    required: false
    default: ""
  policy-lifecycle-log-remote-gossip-timeout-seconds:
    description: End-to-end timeout for each remote gossip observation.
    required: false
    default: "30"
  fail-on-policy-lifecycle-log-gossip-quorum:
    description: Fail unless fresh observations from distinct organizations meet the gossip quorum.
    required: false
    default: "false"
