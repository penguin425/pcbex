name: pcbex hardware CI
description: Analyze a KiCad PCB, publish CI evidence, update PR comments, and gate regressions.
author: pcbex contributors

branding:
  icon: cpu
  color: blue

inputs:
  board:
    description: Path to the current .kicad_pcb file in the caller workspace.
    required: true
  baseline-board:
    description: Optional path to a baseline .kicad_pcb file.
    required: false
    default: ""
  schematic:
    description: Optional current .kicad_sch file for semantic review.
    required: false
    default: ""
  baseline-schematic:
    description: Optional accepted .kicad_sch file; required together with schematic.
    required: false
    default: ""
  schematic-reviewer-routing-policy:
    description: Optional strict reviewer-routing policy applied to the schematic semantic diff.
    required: false
    default: ""
  fab:
    description: Optional built-in fabrication profile ID or stable alias.
    required: false
    default: ""
  fab-profile:
    description: Optional strict external DFM profile JSON path; mutually exclusive with fab.
    required: false
    default: ""
  policy-pack:
    description: Optional unsigned organization policy pack; mutually exclusive with physical-policy alternatives.
    required: false
    default: ""
  signed-policy-pack:
    description: Optional signed organization policy pack; requires policy-public-key.
    required: false
    default: ""
  policy-pack-url:
    description: Optional HTTPS registry URL returning a signed organization policy pack.
    required: false
    default: ""
  policy-public-key:
    description: Trusted Ed25519 public-key file used with signed-policy-pack or policy-pack-url.
    required: false
    default: ""
  policy-trust-state:
    description: Optional previously accepted trust state used to reject signed-pack rollback or equivocation.
    required: false
    default: ""
  policy-pack-bearer-token:
    description: Optional Bearer token for policy-pack-url; kept out of process arguments and receipts.
    required: false
    default: ""
  policy-pack-timeout-seconds:
    description: Total timeout for policy-pack-url retrieval.
    required: false
    default: "30"
  manufacturing-feedback-declaration:
    description: Optional strict fabrication feedback declaration bound to the analyzed board.
    required: false
    default: ""
  manufacturing-feedback-artifacts:
    description: Newline-separated fabrication or inspection artifact paths required by a feedback declaration.
    required: false
    default: ""
  policy-recommendation-feedback-files:
    description: Optional newline-separated historical bound feedback files, paired with policy-recommendation-analysis-manifests.
    required: false
    default: ""
  policy-recommendation-analysis-manifests:
    description: Optional newline-separated exact run.json files bound by the historical feedback inputs.
    required: false
    default: ""
  policy-recommendation-generated-on:
    description: Opt-in deterministic YYYY-MM-DD date for a proposal-only DFM tightening report.
    required: false
    default: ""
  policy-recommendation-minimum-occurrences:
    description: Independent feedback IDs required before one tightening is proposed.
    required: false
    default: "2"
  policy-rollout-project-id:
    description: Optional stable project ID that reruns the current board with the recommendation-derived simulation profile.
    required: false
    default: ""
  policy-rollout-recommendation:
    description: Optional existing governed recommendation used for rollout simulation instead of the recommendation generated in this run.
    required: false
    default: ""
  policy-rollout-generated-on:
    description: Deterministic YYYY-MM-DD date for the simulation profile and rollout report.
    required: false
    default: ""
  canary-rollout-report:
    description: Optional existing simulation-only rollout report to authorize; defaults to the rollout produced in this run.
    required: false
    default: ""
  canary-rollout-approval-files:
    description: Newline-separated signed human rollout approvals bound to one canary scope and validity window.
    required: false
    default: ""
  canary-rollout-evaluated-at-unix:
    description: Explicit Unix timestamp used to evaluate the approval validity window.
    required: false
    default: ""
  canary-rollout-minimum-approvals:
    description: Minimum distinct trusted human approvals required for canary authorization.
    required: false
    default: "2"
  fail-on-canary-rollout-authorization:
    description: Fail unless the supplied canary rollout approvals authorize the bounded rollout.
    required: false
    default: "false"
  canary-monitoring-project-id:
    description: Optional authorized canary project ID whose observed analysis is compared with its exact baseline.
    required: false
    default: ""
  canary-monitoring-baseline-analysis:
    description: Exact baseline analysis directory retained by the authorized rollout.
    required: false
    default: ""
  canary-monitoring-observed-analysis:
    description: Observed canary analysis directory produced with the authorized candidate profile.
    required: false
    default: ""
  canary-monitoring-observed-at-unix:
    description: Explicit Unix timestamp for the bound canary observation.
    required: false
    default: ""
  fail-on-canary-monitoring:
    description: Fail unless complete bound canary monitoring is eligible for human promotion review.
    required: false
    default: "false"
  canary-completion-monitoring-report:
    description: Optional existing bound monitoring report; defaults to monitoring produced in this run.
    required: false
    default: ""
  canary-completion-decision-files:
    description: Newline-separated signed human promotion or rollback decisions.
    required: false
    default: ""
  canary-completion-minimum-decisions:
    description: Minimum distinct trusted human decisions required to finalize the canary.
    required: false
    default: "2"
  fail-on-canary-completion:
    description: Fail unless a unanimous trusted canary completion quorum is finalized.
    required: false
    default: "false"
  policy-deployment-source-trust-state:
    description: Accepted signed-policy trust state exactly matching the source policy pack.
    required: false
    default: ""
  policy-deployment-candidate-trust-state:
    description: Accepted signed-policy trust state that monotonically advances the source signing root.
    required: false
    default: ""
  policy-deployment-candidate-policy-pack:
    description: Signed-and-accepted higher-revision policy pack containing the exact approved rollout profile.
    required: false
    default: ""
  policy-deployment-baseline-state:
    description: Optional previously retained hash-chained deployment state; required to confirm rollback.
    required: false
    default: ""
  policy-deployment-recorded-at-unix:
    description: Opt-in Unix timestamp for advancing the monotonic deployment state.
    required: false
    default: ""
  fail-on-policy-deployment-promotion:
    description: Fail unless the finalized candidate is recorded as the active policy revision.
    required: false
    default: "false"
  policy-deployment-verification-state:
    description: Optional pending promoted deployment state; defaults to the state produced in this run.
    required: false
    default: ""
  policy-deployment-verification-project-id:
    description: Rollout project ID whose complete deployed evidence is being verified.
    required: false
    default: ""
  policy-deployment-verification-expected-analysis:
    description: Exact pre-deployment candidate analysis directory retained by the rollout.
    required: false
    default: ""
  policy-deployment-verification-observed-analysis:
    description: Production analysis directory generated with the exact active organization policy pack.
    required: false
    default: ""
  policy-deployment-verification-verified-at-unix:
    description: Explicit Unix timestamp for the post-deployment observation.
    required: false
    default: ""
  fail-on-policy-deployment-verification:
    description: Fail unless complete post-deployment evidence matches the approved candidate without regressions.
    required: false
    default: "false"
  policy-deployment-rollback-verification:
    description: Optional failed production-verification report; defaults to the report produced in this run.
    required: false
    default: ""
  policy-deployment-rollback-approval-files:
    description: Newline-separated trusted human approvals bound to the failed revision and retained restore target.
    required: false
    default: ""
  policy-deployment-rollback-minimum-approvals:
    description: Minimum distinct trusted human approvals required to apply production rollback.
    required: false
    default: "2"
  policy-deployment-rollback-recorded-at-unix:
    description: Opt-in Unix timestamp for retaining the dual-control rollback state.
    required: false
    default: ""
  fail-on-policy-deployment-rollback:
    description: Fail unless the failed policy revision is restored to its exact retained predecessor.
    required: false
    default: "false"
  ai-review-request:
    description: Optional digest-bound AI schematic-review request used for quorum verification.
    required: false
    default: ""
  ai-review-session:
    description: Optional time-bound challenge requiring session-bound v2 AI approvals.
    required: false
    default: ""
  ai-approval-files:
    description: Newline-separated signed AI approval files, paired with ai-response-files.
    required: false
    default: ""
  ai-response-files:
    description: Newline-separated exact AI response files, paired with ai-approval-files.
    required: false
    default: ""
  ai-quorum-minimum-approvals:
    description: Minimum independently signed approvals required.
    required: false
    default: "2"
  ai-quorum-minimum-distinct-providers:
    description: Minimum distinct approved provider identities required.
    required: false
    default: "2"
  ai-quorum-minimum-distinct-models:
    description: Minimum distinct approved model identities required.
    required: false
    default: "2"
  human-escalation-files:
    description: Newline-separated signed human decisions for an AI needs-human quorum.
    required: false
    default: ""
  human-escalation-ai-quorum:
    description: Exact retained time-bound AI quorum evidence bound by the human signatures.
    required: false
    default: ""
  human-escalation-minimum-approvals:
    description: Minimum distinct human approvals required; cannot be less than two.
    required: false
    default: "2"
  approval-transparency-log:
    description: Optional append-only approval transparency log to verify.
    required: false
    default: ""
  approval-log-checkpoint:
    description: Signed checkpoint bound to approval-transparency-log.
    required: false
    default: ""
  approval-log-public-key:
    description: Trusted Ed25519 public-key file for the approval-log checkpoint.
    required: false
    default: ""
  approval-log-anchor-proof:
    description: Optional Merkle inclusion proof for the exact approval-log checkpoint.
    required: false
    default: ""
  approval-log-anchor-public-key:
    description: Trusted Ed25519 tree-head key for the public anchor log.
    required: false
    default: ""
  approval-log-witness-files:
    description: Newline-separated independent witness signatures over the checkpoint.
    required: false
    default: ""
  approval-log-witness-public-keys:
    description: Newline-separated trusted witness keys paired with witness files.
    required: false
    default: ""
  approval-log-minimum-witnesses:
    description: Minimum distinct trusted witnesses required; cannot be less than two.
    required: false
    default: "2"
  remote-witness-endpoint:
    description: Optional HTTPS endpoint that signs the exact approval-log checkpoint.
    required: false
    default: ""
  remote-witness-public-key:
    description: Trusted Ed25519 public-key file for the remote witness.
    required: false
    default: ""
  remote-witness-trust-state:
    description: Rotatable witness trust-state file; mutually exclusive with remote-witness-public-key.
    required: false
    default: ""
  remote-witness-bearer-token:
    description: Optional secret Bearer token sent only to the configured remote witness.
    required: false
    default: ""
  remote-witness-timeout-seconds:
    description: End-to-end remote witness HTTP timeout, from 1 to 600 seconds.
    required: false
    default: "30"
  output-dir:
    description: Directory for analysis bundles, relative to the caller workspace.
    required: false
    default: pcbex-analysis
  fail-on-violations:
    description: Fail after publishing artifacts when the current board has violations.
    required: false
    default: "false"
  fail-on-regressions:
    description: Fail after publishing artifacts when the baseline comparison regresses.
    required: false
    default: "true"
  fail-on-manufacturing-feedback:
    description: Fail after publishing evidence unless supplied manufacturing feedback passes.
    required: false
    default: "false"
  fail-on-schematic-review:
    description: Fail after publishing evidence when the schematic semantic diff requires review.
    required: false
    default: "false"
  fail-on-unrouted-schematic-review:
    description: Fail after publishing evidence when a required schematic review has no complete reviewer-routing plan.
    required: false
    default: "false"
  fail-on-ai-quorum:
    description: Fail after publishing evidence unless the configured AI approval quorum passes.
    required: false
    default: "false"
  fail-on-schematic-approval:
    description: Fail unless either AI quorum passes or an eligible dual-control human escalation passes.
    required: false
    default: "false"
  fail-on-approval-log:
    description: Fail unless the supplied approval transparency log and checkpoint verify.
    required: false
    default: "false"
  fail-on-approval-log-anchor:
    description: Fail unless the supplied checkpoint has a valid public-log inclusion proof.
    required: false
    default: "false"
  fail-on-approval-log-witnesses:
    description: Fail unless the supplied checkpoint has the configured independent witness quorum.
    required: false
    default: "false"
  upload-artifact:
    description: Upload the complete analysis directory as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded workflow artifact.
    required: false
    default: pcbex-analysis
  retention-days:
    description: Number of days to retain the workflow artifact.
    required: false
    default: "14"
  upload-sarif:
    description: Upload SARIF to GitHub code scanning; requires security-events write permission.
    required: false
    default: "false"
  pr-comment:
    description: Create or update one marker-addressed pull-request comment.
    required: false
    default: "false"
  github-token:
    description: Token used only for the opt-in PR comment; requires pull-requests write permission.
    required: false
    default: ""
  pr-number:
    description: Pull-request number; defaults to the current pull_request event number.
    required: false
    default: ""
  comment-id:
    description: Stable 1-64 character identity allowing multiple pcbex comments on one PR.
    required: false
    default: hardware-analysis

outputs:
  artifact-dir:
    description: Directory containing all generated analysis artifacts.
    value: ${{ steps.analyze.outputs.artifact-dir }}
  current-sarif:
    description: SARIF report for the current board.
    value: ${{ steps.analyze.outputs.current-sarif }}
  comparison-sarif:
    description: SARIF report for the baseline comparison, if requested.
    value: ${{ steps.analyze.outputs.comparison-sarif }}
  violation-count:
    description: Number of violations in the current board.
    value: ${{ steps.analyze.outputs.violation-count }}
  regression:
    description: Whether the baseline comparison found a regression.
    value: ${{ steps.analyze.outputs.regression }}
  comment-url:
    description: URL of the created or updated pull-request comment, when enabled.
    value: ${{ steps.comment.outputs.comment-url }}
  verified-policy-trust-state:
    description: Newly accepted policy trust-state path for a signed local or remotely fetched pack.
    value: ${{ steps.analyze.outputs.verified-policy-trust-state }}
  fetched-signed-policy-pack:
    description: Verified signed policy-pack response retained from policy-pack-url.
    value: ${{ steps.analyze.outputs.fetched-signed-policy-pack }}
  policy-pack-fetch-receipt:
    description: Hash-bound HTTPS retrieval receipt for policy-pack-url.
    value: ${{ steps.analyze.outputs.policy-pack-fetch-receipt }}
  manufacturing-feedback:
    description: Digest-bound normalized manufacturing feedback path, when supplied.
    value: ${{ steps.analyze.outputs.manufacturing-feedback }}
  manufacturing-feedback-passed:
    description: Whether supplied manufacturing feedback passed.
    value: ${{ steps.analyze.outputs.manufacturing-feedback-passed }}
  policy-recommendation:
    description: Proposal-only, human-gated manufacturing policy recommendation path.
    value: ${{ steps.analyze.outputs.policy-recommendation }}
  policy-rollout-profile:
    description: Simulation-only DFM profile derived from the governed recommendation.
    value: ${{ steps.analyze.outputs.policy-rollout-profile }}
  policy-rollout:
    description: Non-deployable, human-gated policy rollout impact report.
    value: ${{ steps.analyze.outputs.policy-rollout }}
  canary-rollout-authorization:
    description: Dual-control, time-bound canary rollout authorization report.
    value: ${{ steps.analyze.outputs.canary-rollout-authorization }}
  canary-rollout-authorized:
    description: Whether the bounded canary rollout is authorized.
    value: ${{ steps.analyze.outputs.canary-rollout-authorized }}
  canary-monitoring:
    description: Bound canary monitoring report with rollback and promotion-review outcome.
    value: ${{ steps.analyze.outputs.canary-monitoring }}
  canary-monitoring-passed:
    description: Whether monitoring passed without permitting automatic promotion.
    value: ${{ steps.analyze.outputs.canary-monitoring-passed }}
  canary-completion:
    description: Trusted unanimous canary promotion or rollback completion report.
    value: ${{ steps.analyze.outputs.canary-completion }}
  canary-completion-finalized:
    description: Whether the explicit canary completion decision is finalized.
    value: ${{ steps.analyze.outputs.canary-completion-finalized }}
  canary-completion-decision:
    description: Final promote or rollback decision, when finalized.
    value: ${{ steps.analyze.outputs.canary-completion-decision }}
  policy-deployment:
    description: Hash-chained monotonic policy deployment state.
    value: ${{ steps.analyze.outputs.policy-deployment }}
  policy-deployment-status:
    description: Whether promotion was applied or rollback was confirmed.
    value: ${{ steps.analyze.outputs.policy-deployment-status }}
  policy-deployment-active-revision:
    description: Active organization-policy revision after the retained decision.
    value: ${{ steps.analyze.outputs.policy-deployment-active-revision }}
  policy-deployment-verification:
    description: Fleet-wide digest-bound post-deployment verification report.
    value: ${{ steps.analyze.outputs.policy-deployment-verification }}
  policy-deployment-verified:
    description: Whether complete production evidence matches the approved candidate.
    value: ${{ steps.analyze.outputs.policy-deployment-verified }}
  policy-deployment-rollback-required:
    description: Whether regressions require a separately approved rollback.
    value: ${{ steps.analyze.outputs.policy-deployment-rollback-required }}
  policy-deployment-rollback:
    description: Verification-bound dual-control production rollback state.
    value: ${{ steps.analyze.outputs.policy-deployment-rollback }}
  policy-deployment-rollback-status:
    description: Whether the exact retained predecessor was restored.
    value: ${{ steps.analyze.outputs.policy-deployment-rollback-status }}
  policy-deployment-rollback-active-revision:
    description: Active policy revision after dual-control production rollback.
    value: ${{ steps.analyze.outputs.policy-deployment-rollback-active-revision }}
  schematic-diff:
    description: Schematic semantic-diff JSON path, when both schematics are supplied.
    value: ${{ steps.analyze.outputs.schematic-diff }}
  schematic-review-required:
    description: Whether supplied schematics contain electrical changes requiring review.
    value: ${{ steps.analyze.outputs.schematic-review-required }}
  schematic-reviewer-routing:
    description: Policy-derived AI reviewer-routing plan path, when configured.
    value: ${{ steps.analyze.outputs.schematic-reviewer-routing }}
  schematic-review-all-routed:
    description: Whether every semantic change was assigned to a specialist or fallback reviewer profile.
    value: ${{ steps.analyze.outputs.schematic-review-all-routed }}
  ai-approval-quorum:
    description: Verified AI approval-quorum JSON path, when supplied.
    value: ${{ steps.analyze.outputs.ai-approval-quorum }}
  ai-approval-quorum-met:
    description: Whether every configured AI approval-quorum threshold passed.
    value: ${{ steps.analyze.outputs.ai-approval-quorum-met }}
  human-escalation:
    description: Verified dual-control human-escalation JSON path, when supplied.
    value: ${{ steps.analyze.outputs.human-escalation }}
  human-escalation-approved:
    description: Whether eligible AI needs-human evidence received dual-control approval.
    value: ${{ steps.analyze.outputs.human-escalation-approved }}
  schematic-approval-met:
    description: Whether AI quorum or its governed human escalation approved the schematic.
    value: ${{ steps.analyze.outputs.schematic-approval-met }}
  approval-log-verification:
    description: Verified approval transparency-log report path, when supplied.
    value: ${{ steps.analyze.outputs.approval-log-verification }}
  approval-log-verified:
    description: Whether the complete approval hash chain and checkpoint verified.
    value: ${{ steps.analyze.outputs.approval-log-verified }}
  approval-log-anchor-verification:
    description: Verified public-log Merkle inclusion report path, when supplied.
    value: ${{ steps.analyze.outputs.approval-log-anchor-verification }}
  approval-log-anchored:
    description: Whether the exact checkpoint is included under a trusted signed tree head.
    value: ${{ steps.analyze.outputs.approval-log-anchored }}
  approval-log-witness-quorum:
    description: Verified approval-log witness quorum report path, when supplied.
    value: ${{ steps.analyze.outputs.approval-log-witness-quorum }}
  approval-log-witness-quorum-met:
    description: Whether the independent approval-log witness threshold passed.
    value: ${{ steps.analyze.outputs.approval-log-witness-quorum-met }}
  remote-witness:
    description: Cryptographically verified remote approval-log witness path, when requested.
    value: ${{ steps.analyze.outputs.remote-witness }}
  remote-witness-receipt:
    description: Hash-bound remote witness HTTP transport receipt path, when requested.
    value: ${{ steps.analyze.outputs.remote-witness-receipt }}

runs:
  using: composite
  steps:
    - name: Build pcbex
      id: build
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal
        cargo +stable build \
          --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml" \
          --package pcbex \
          --release \
          --locked
        echo "binary=$GITHUB_ACTION_PATH/target/release/pcbex" >> "$GITHUB_OUTPUT"

    - name: Analyze hardware
      id: analyze
      shell: bash
      env:
        PCBEX_BINARY: ${{ steps.build.outputs.binary }}
        PCBEX_BOARD: ${{ inputs.board }}
        PCBEX_BASELINE_BOARD: ${{ inputs.baseline-board }}
        PCBEX_SCHEMATIC: ${{ inputs.schematic }}
        PCBEX_BASELINE_SCHEMATIC: ${{ inputs.baseline-schematic }}
        PCBEX_SCHEMATIC_REVIEWER_ROUTING_POLICY: ${{ inputs.schematic-reviewer-routing-policy }}
        PCBEX_FAB: ${{ inputs.fab }}
        PCBEX_FAB_PROFILE: ${{ inputs.fab-profile }}
        PCBEX_POLICY_PACK: ${{ inputs.policy-pack }}
        PCBEX_SIGNED_POLICY_PACK: ${{ inputs.signed-policy-pack }}
        PCBEX_POLICY_PACK_URL: ${{ inputs.policy-pack-url }}
        PCBEX_POLICY_PUBLIC_KEY: ${{ inputs.policy-public-key }}
        PCBEX_POLICY_TRUST_STATE: ${{ inputs.policy-trust-state }}
        PCBEX_POLICY_PACK_BEARER_TOKEN: ${{ inputs.policy-pack-bearer-token }}
        PCBEX_POLICY_PACK_TIMEOUT_SECONDS: ${{ inputs.policy-pack-timeout-seconds }}
        PCBEX_MANUFACTURING_FEEDBACK_DECLARATION: ${{ inputs.manufacturing-feedback-declaration }}
        PCBEX_MANUFACTURING_FEEDBACK_ARTIFACTS: ${{ inputs.manufacturing-feedback-artifacts }}
        PCBEX_POLICY_RECOMMENDATION_FEEDBACK_FILES: ${{ inputs.policy-recommendation-feedback-files }}
        PCBEX_POLICY_RECOMMENDATION_ANALYSIS_MANIFESTS: ${{ inputs.policy-recommendation-analysis-manifests }}
        PCBEX_POLICY_RECOMMENDATION_GENERATED_ON: ${{ inputs.policy-recommendation-generated-on }}
        PCBEX_POLICY_RECOMMENDATION_MINIMUM_OCCURRENCES: ${{ inputs.policy-recommendation-minimum-occurrences }}
        PCBEX_POLICY_ROLLOUT_PROJECT_ID: ${{ inputs.policy-rollout-project-id }}
        PCBEX_POLICY_ROLLOUT_RECOMMENDATION: ${{ inputs.policy-rollout-recommendation }}
        PCBEX_POLICY_ROLLOUT_GENERATED_ON: ${{ inputs.policy-rollout-generated-on }}
        PCBEX_CANARY_ROLLOUT_REPORT: ${{ inputs.canary-rollout-report }}
        PCBEX_CANARY_ROLLOUT_APPROVAL_FILES: ${{ inputs.canary-rollout-approval-files }}
        PCBEX_CANARY_ROLLOUT_EVALUATED_AT_UNIX: ${{ inputs.canary-rollout-evaluated-at-unix }}
        PCBEX_CANARY_ROLLOUT_MINIMUM_APPROVALS: ${{ inputs.canary-rollout-minimum-approvals }}
        PCBEX_CANARY_MONITORING_PROJECT_ID: ${{ inputs.canary-monitoring-project-id }}
        PCBEX_CANARY_MONITORING_BASELINE_ANALYSIS: ${{ inputs.canary-monitoring-baseline-analysis }}
        PCBEX_CANARY_MONITORING_OBSERVED_ANALYSIS: ${{ inputs.canary-monitoring-observed-analysis }}
        PCBEX_CANARY_MONITORING_OBSERVED_AT_UNIX: ${{ inputs.canary-monitoring-observed-at-unix }}
        PCBEX_CANARY_COMPLETION_MONITORING_REPORT: ${{ inputs.canary-completion-monitoring-report }}
        PCBEX_CANARY_COMPLETION_DECISION_FILES: ${{ inputs.canary-completion-decision-files }}
        PCBEX_CANARY_COMPLETION_MINIMUM_DECISIONS: ${{ inputs.canary-completion-minimum-decisions }}
        PCBEX_POLICY_DEPLOYMENT_SOURCE_TRUST_STATE: ${{ inputs.policy-deployment-source-trust-state }}
        PCBEX_POLICY_DEPLOYMENT_CANDIDATE_TRUST_STATE: ${{ inputs.policy-deployment-candidate-trust-state }}
        PCBEX_POLICY_DEPLOYMENT_CANDIDATE_POLICY_PACK: ${{ inputs.policy-deployment-candidate-policy-pack }}
        PCBEX_POLICY_DEPLOYMENT_BASELINE_STATE: ${{ inputs.policy-deployment-baseline-state }}
        PCBEX_POLICY_DEPLOYMENT_RECORDED_AT_UNIX: ${{ inputs.policy-deployment-recorded-at-unix }}
        PCBEX_POLICY_DEPLOYMENT_VERIFICATION_STATE: ${{ inputs.policy-deployment-verification-state }}
        PCBEX_POLICY_DEPLOYMENT_VERIFICATION_PROJECT_ID: ${{ inputs.policy-deployment-verification-project-id }}
        PCBEX_POLICY_DEPLOYMENT_VERIFICATION_EXPECTED_ANALYSIS: ${{ inputs.policy-deployment-verification-expected-analysis }}
        PCBEX_POLICY_DEPLOYMENT_VERIFICATION_OBSERVED_ANALYSIS: ${{ inputs.policy-deployment-verification-observed-analysis }}
        PCBEX_POLICY_DEPLOYMENT_VERIFICATION_VERIFIED_AT_UNIX: ${{ inputs.policy-deployment-verification-verified-at-unix }}
        PCBEX_POLICY_DEPLOYMENT_ROLLBACK_VERIFICATION: ${{ inputs.policy-deployment-rollback-verification }}
        PCBEX_POLICY_DEPLOYMENT_ROLLBACK_APPROVAL_FILES: ${{ inputs.policy-deployment-rollback-approval-files }}
        PCBEX_POLICY_DEPLOYMENT_ROLLBACK_MINIMUM_APPROVALS: ${{ inputs.policy-deployment-rollback-minimum-approvals }}
        PCBEX_POLICY_DEPLOYMENT_ROLLBACK_RECORDED_AT_UNIX: ${{ inputs.policy-deployment-rollback-recorded-at-unix }}
        PCBEX_AI_REVIEW_REQUEST: ${{ inputs.ai-review-request }}
        PCBEX_AI_REVIEW_SESSION: ${{ inputs.ai-review-session }}
        PCBEX_AI_APPROVAL_FILES: ${{ inputs.ai-approval-files }}
        PCBEX_AI_RESPONSE_FILES: ${{ inputs.ai-response-files }}
        PCBEX_AI_QUORUM_MINIMUM_APPROVALS: ${{ inputs.ai-quorum-minimum-approvals }}
        PCBEX_AI_QUORUM_MINIMUM_DISTINCT_PROVIDERS: ${{ inputs.ai-quorum-minimum-distinct-providers }}
        PCBEX_AI_QUORUM_MINIMUM_DISTINCT_MODELS: ${{ inputs.ai-quorum-minimum-distinct-models }}
        PCBEX_HUMAN_ESCALATION_FILES: ${{ inputs.human-escalation-files }}
        PCBEX_HUMAN_ESCALATION_AI_QUORUM: ${{ inputs.human-escalation-ai-quorum }}
        PCBEX_HUMAN_ESCALATION_MINIMUM_APPROVALS: ${{ inputs.human-escalation-minimum-approvals }}
        PCBEX_APPROVAL_TRANSPARENCY_LOG: ${{ inputs.approval-transparency-log }}
        PCBEX_APPROVAL_LOG_CHECKPOINT: ${{ inputs.approval-log-checkpoint }}
        PCBEX_APPROVAL_LOG_PUBLIC_KEY: ${{ inputs.approval-log-public-key }}
        PCBEX_APPROVAL_LOG_ANCHOR_PROOF: ${{ inputs.approval-log-anchor-proof }}
        PCBEX_APPROVAL_LOG_ANCHOR_PUBLIC_KEY: ${{ inputs.approval-log-anchor-public-key }}
        PCBEX_APPROVAL_LOG_WITNESS_FILES: ${{ inputs.approval-log-witness-files }}
        PCBEX_APPROVAL_LOG_WITNESS_PUBLIC_KEYS: ${{ inputs.approval-log-witness-public-keys }}
        PCBEX_APPROVAL_LOG_MINIMUM_WITNESSES: ${{ inputs.approval-log-minimum-witnesses }}
        PCBEX_REMOTE_WITNESS_ENDPOINT: ${{ inputs.remote-witness-endpoint }}
        PCBEX_REMOTE_WITNESS_PUBLIC_KEY: ${{ inputs.remote-witness-public-key }}
        PCBEX_REMOTE_WITNESS_TRUST_STATE: ${{ inputs.remote-witness-trust-state }}
        PCBEX_REMOTE_WITNESS_BEARER_TOKEN: ${{ inputs.remote-witness-bearer-token }}
        PCBEX_REMOTE_WITNESS_TIMEOUT_SECONDS: ${{ inputs.remote-witness-timeout-seconds }}
        PCBEX_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: "$GITHUB_ACTION_PATH/scripts/github-analysis.sh"

    - name: Upload analysis artifact
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.analyze.outputs.artifact-dir != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.analyze.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.analyze.outputs.sarif-dir != '' }}
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif-dir }}
        category: pcbex-hardware-ci

    - name: Create or update pull request comment
      id: comment
      if: ${{ always() && inputs.pr-comment == 'true' && steps.analyze.outputs.comment-body != '' }}
      shell: bash
      env:
        PCBEX_API_URL: ${{ github.api_url }}
        PCBEX_GITHUB_TOKEN: ${{ inputs.github-token }}
        PCBEX_REPOSITORY: ${{ github.repository }}
        PCBEX_PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        PCBEX_COMMENT_ID: ${{ inputs.comment-id }}
        PCBEX_COMMENT_BODY: ${{ steps.analyze.outputs.comment-body }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/upsert-pr-comment.py"

    - name: Enforce analysis gates
      if: ${{ always() }}
      shell: bash
      env:
        PCBEX_ANALYSIS_STATUS: ${{ steps.analyze.outputs.status }}
        PCBEX_VIOLATION_COUNT: ${{ steps.analyze.outputs.violation-count }}
        PCBEX_REGRESSION: ${{ steps.analyze.outputs.regression }}
        PCBEX_MANUFACTURING_FEEDBACK_PASSED: ${{ steps.analyze.outputs.manufacturing-feedback-passed }}
        PCBEX_SCHEMATIC_REVIEW_REQUIRED: ${{ steps.analyze.outputs.schematic-review-required }}
        PCBEX_SCHEMATIC_REVIEW_ALL_ROUTED: ${{ steps.analyze.outputs.schematic-review-all-routed }}
        PCBEX_AI_APPROVAL_QUORUM_MET: ${{ steps.analyze.outputs.ai-approval-quorum-met }}
        PCBEX_SCHEMATIC_APPROVAL_MET: ${{ steps.analyze.outputs.schematic-approval-met }}
        PCBEX_APPROVAL_LOG_VERIFIED: ${{ steps.analyze.outputs.approval-log-verified }}
        PCBEX_APPROVAL_LOG_ANCHORED: ${{ steps.analyze.outputs.approval-log-anchored }}
        PCBEX_APPROVAL_LOG_WITNESS_QUORUM_MET: ${{ steps.analyze.outputs.approval-log-witness-quorum-met }}
        PCBEX_CANARY_ROLLOUT_AUTHORIZED: ${{ steps.analyze.outputs.canary-rollout-authorized }}
        PCBEX_CANARY_MONITORING_PASSED: ${{ steps.analyze.outputs.canary-monitoring-passed }}
        PCBEX_CANARY_COMPLETION_FINALIZED: ${{ steps.analyze.outputs.canary-completion-finalized }}
        PCBEX_POLICY_DEPLOYMENT_STATUS: ${{ steps.analyze.outputs.policy-deployment-status }}
        PCBEX_POLICY_DEPLOYMENT_VERIFIED: ${{ steps.analyze.outputs.policy-deployment-verified }}
        PCBEX_POLICY_DEPLOYMENT_ROLLBACK_STATUS: ${{ steps.analyze.outputs.policy-deployment-rollback-status }}
        PCBEX_FAIL_ON_VIOLATIONS: ${{ inputs.fail-on-violations }}
        PCBEX_FAIL_ON_REGRESSIONS: ${{ inputs.fail-on-regressions }}
        PCBEX_FAIL_ON_MANUFACTURING_FEEDBACK: ${{ inputs.fail-on-manufacturing-feedback }}
        PCBEX_FAIL_ON_SCHEMATIC_REVIEW: ${{ inputs.fail-on-schematic-review }}
        PCBEX_FAIL_ON_UNROUTED_SCHEMATIC_REVIEW: ${{ inputs.fail-on-unrouted-schematic-review }}
        PCBEX_FAIL_ON_AI_QUORUM: ${{ inputs.fail-on-ai-quorum }}
        PCBEX_FAIL_ON_SCHEMATIC_APPROVAL: ${{ inputs.fail-on-schematic-approval }}
        PCBEX_FAIL_ON_APPROVAL_LOG: ${{ inputs.fail-on-approval-log }}
        PCBEX_FAIL_ON_APPROVAL_LOG_ANCHOR: ${{ inputs.fail-on-approval-log-anchor }}
        PCBEX_FAIL_ON_APPROVAL_LOG_WITNESSES: ${{ inputs.fail-on-approval-log-witnesses }}
        PCBEX_FAIL_ON_CANARY_ROLLOUT_AUTHORIZATION: ${{ inputs.fail-on-canary-rollout-authorization }}
        PCBEX_FAIL_ON_CANARY_MONITORING: ${{ inputs.fail-on-canary-monitoring }}
        PCBEX_FAIL_ON_CANARY_COMPLETION: ${{ inputs.fail-on-canary-completion }}
        PCBEX_FAIL_ON_POLICY_DEPLOYMENT_PROMOTION: ${{ inputs.fail-on-policy-deployment-promotion }}
        PCBEX_FAIL_ON_POLICY_DEPLOYMENT_VERIFICATION: ${{ inputs.fail-on-policy-deployment-verification }}
        PCBEX_FAIL_ON_POLICY_DEPLOYMENT_ROLLBACK: ${{ inputs.fail-on-policy-deployment-rollback }}
      run: |
        set -euo pipefail
        if [[ "$PCBEX_ANALYSIS_STATUS" != "ok" ]]; then
          echo "::error::pcbex analysis did not complete"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_VIOLATIONS" == "true" && "$PCBEX_VIOLATION_COUNT" != "0" ]]; then
          echo "::error::pcbex found $PCBEX_VIOLATION_COUNT current-board violation(s)"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_REGRESSIONS" == "true" && "$PCBEX_REGRESSION" == "true" ]]; then
          echo "::error::pcbex found a hardware-analysis regression"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_MANUFACTURING_FEEDBACK" == "true" && "$PCBEX_MANUFACTURING_FEEDBACK_PASSED" != "true" ]]; then
          echo "::error::pcbex manufacturing feedback is absent or did not pass"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_SCHEMATIC_REVIEW" == "true" && "$PCBEX_SCHEMATIC_REVIEW_REQUIRED" != "false" ]]; then
          echo "::error::pcbex schematic semantic diff requires review or was not produced"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_UNROUTED_SCHEMATIC_REVIEW" == "true" && "$PCBEX_SCHEMATIC_REVIEW_REQUIRED" != "false" && "$PCBEX_SCHEMATIC_REVIEW_ALL_ROUTED" != "true" ]]; then
          echo "::error::pcbex required schematic review has no complete reviewer-routing plan"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_AI_QUORUM" == "true" && "$PCBEX_AI_APPROVAL_QUORUM_MET" != "true" ]]; then
          echo "::error::pcbex AI schematic approval quorum is absent or did not pass"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_SCHEMATIC_APPROVAL" == "true" && "$PCBEX_SCHEMATIC_APPROVAL_MET" != "true" ]]; then
          echo "::error::pcbex schematic has neither AI quorum nor governed human approval"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG" == "true" && "$PCBEX_APPROVAL_LOG_VERIFIED" != "true" ]]; then
          echo "::error::pcbex approval transparency log is absent or invalid"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG_ANCHOR" == "true" && "$PCBEX_APPROVAL_LOG_ANCHORED" != "true" ]]; then
          echo "::error::pcbex approval checkpoint public-log anchor is absent or invalid"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG_WITNESSES" == "true" && "$PCBEX_APPROVAL_LOG_WITNESS_QUORUM_MET" != "true" ]]; then
          echo "::error::pcbex approval transparency-log witness quorum is absent or invalid"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_CANARY_ROLLOUT_AUTHORIZATION" == "true" && "$PCBEX_CANARY_ROLLOUT_AUTHORIZED" != "true" ]]; then
          echo "::error::pcbex canary policy rollout lacks a valid dual-control authorization"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_CANARY_MONITORING" == "true" && "$PCBEX_CANARY_MONITORING_PASSED" != "true" ]]; then
          echo "::error::pcbex canary monitoring is absent, incomplete, or requires rollback"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_CANARY_COMPLETION" == "true" && "$PCBEX_CANARY_COMPLETION_FINALIZED" != "true" ]]; then
          echo "::error::pcbex canary completion lacks a unanimous trusted human decision"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_POLICY_DEPLOYMENT_PROMOTION" == "true" && "$PCBEX_POLICY_DEPLOYMENT_STATUS" != "promotion_applied" ]]; then
          echo "::error::pcbex policy deployment was absent or retained rollback instead of promotion"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_POLICY_DEPLOYMENT_VERIFICATION" == "true" && "$PCBEX_POLICY_DEPLOYMENT_VERIFIED" != "true" ]]; then
          echo "::error::pcbex post-deployment evidence is absent, incomplete, or requires dual-control rollback"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_POLICY_DEPLOYMENT_ROLLBACK" == "true" && "$PCBEX_POLICY_DEPLOYMENT_ROLLBACK_STATUS" != "rollback_applied" ]]; then
          echo "::error::pcbex production rollback is absent or lacks a valid dual-control authorization"
          exit 1
        fi
