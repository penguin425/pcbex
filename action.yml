name: pcbex hardware CI
description: Analyze a KiCad PCB, publish CI evidence, update PR comments, and gate regressions.
author: pcbex contributors

branding:
  icon: cpu
  color: blue

inputs:
  board:
    description: Path to the current .kicad_pcb file in the caller workspace.
    required: true
  baseline-board:
    description: Optional path to a baseline .kicad_pcb file.
    required: false
    default: ""
  fab:
    description: Optional built-in fabrication profile ID or stable alias.
    required: false
    default: ""
  fab-profile:
    description: Optional strict external DFM profile JSON path; mutually exclusive with fab.
    required: false
    default: ""
  policy-pack:
    description: Optional unsigned organization policy pack; mutually exclusive with physical-policy alternatives.
    required: false
    default: ""
  signed-policy-pack:
    description: Optional signed organization policy pack; requires policy-public-key.
    required: false
    default: ""
  policy-public-key:
    description: Trusted Ed25519 public-key file used only with signed-policy-pack.
    required: false
    default: ""
  policy-trust-state:
    description: Optional previously accepted trust state used to reject signed-pack rollback or equivocation.
    required: false
    default: ""
  manufacturing-feedback-declaration:
    description: Optional strict fabrication feedback declaration bound to the analyzed board.
    required: false
    default: ""
  manufacturing-feedback-artifacts:
    description: Newline-separated fabrication or inspection artifact paths required by a feedback declaration.
    required: false
    default: ""
  output-dir:
    description: Directory for analysis bundles, relative to the caller workspace.
    required: false
    default: pcbex-analysis
  fail-on-violations:
    description: Fail after publishing artifacts when the current board has violations.
    required: false
    default: "false"
  fail-on-regressions:
    description: Fail after publishing artifacts when the baseline comparison regresses.
    required: false
    default: "true"
  fail-on-manufacturing-feedback:
    description: Fail after publishing evidence unless supplied manufacturing feedback passes.
    required: false
    default: "false"
  upload-artifact:
    description: Upload the complete analysis directory as a workflow artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded workflow artifact.
    required: false
    default: pcbex-analysis
  retention-days:
    description: Number of days to retain the workflow artifact.
    required: false
    default: "14"
  upload-sarif:
    description: Upload SARIF to GitHub code scanning; requires security-events write permission.
    required: false
    default: "false"
  pr-comment:
    description: Create or update one marker-addressed pull-request comment.
    required: false
    default: "false"
  github-token:
    description: Token used only for the opt-in PR comment; requires pull-requests write permission.
    required: false
    default: ""
  pr-number:
    description: Pull-request number; defaults to the current pull_request event number.
    required: false
    default: ""
  comment-id:
    description: Stable 1-64 character identity allowing multiple pcbex comments on one PR.
    required: false
    default: hardware-analysis

outputs:
  artifact-dir:
    description: Directory containing all generated analysis artifacts.
    value: ${{ steps.analyze.outputs.artifact-dir }}
  current-sarif:
    description: SARIF report for the current board.
    value: ${{ steps.analyze.outputs.current-sarif }}
  comparison-sarif:
    description: SARIF report for the baseline comparison, if requested.
    value: ${{ steps.analyze.outputs.comparison-sarif }}
  violation-count:
    description: Number of violations in the current board.
    value: ${{ steps.analyze.outputs.violation-count }}
  regression:
    description: Whether the baseline comparison found a regression.
    value: ${{ steps.analyze.outputs.regression }}
  comment-url:
    description: URL of the created or updated pull-request comment, when enabled.
    value: ${{ steps.comment.outputs.comment-url }}
  verified-policy-trust-state:
    description: Newly accepted policy trust-state path when signed-policy-pack is used.
    value: ${{ steps.analyze.outputs.verified-policy-trust-state }}
  manufacturing-feedback:
    description: Digest-bound normalized manufacturing feedback path, when supplied.
    value: ${{ steps.analyze.outputs.manufacturing-feedback }}
  manufacturing-feedback-passed:
    description: Whether supplied manufacturing feedback passed.
    value: ${{ steps.analyze.outputs.manufacturing-feedback-passed }}

runs:
  using: composite
  steps:
    - name: Build pcbex
      id: build
      shell: bash
      run: |
        set -euo pipefail
        rustup toolchain install stable --profile minimal
        cargo +stable build \
          --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml" \
          --package pcbex \
          --release \
          --locked
        echo "binary=$GITHUB_ACTION_PATH/target/release/pcbex" >> "$GITHUB_OUTPUT"

    - name: Analyze hardware
      id: analyze
      shell: bash
      env:
        PCBEX_BINARY: ${{ steps.build.outputs.binary }}
        PCBEX_BOARD: ${{ inputs.board }}
        PCBEX_BASELINE_BOARD: ${{ inputs.baseline-board }}
        PCBEX_FAB: ${{ inputs.fab }}
        PCBEX_FAB_PROFILE: ${{ inputs.fab-profile }}
        PCBEX_POLICY_PACK: ${{ inputs.policy-pack }}
        PCBEX_SIGNED_POLICY_PACK: ${{ inputs.signed-policy-pack }}
        PCBEX_POLICY_PUBLIC_KEY: ${{ inputs.policy-public-key }}
        PCBEX_POLICY_TRUST_STATE: ${{ inputs.policy-trust-state }}
        PCBEX_MANUFACTURING_FEEDBACK_DECLARATION: ${{ inputs.manufacturing-feedback-declaration }}
        PCBEX_MANUFACTURING_FEEDBACK_ARTIFACTS: ${{ inputs.manufacturing-feedback-artifacts }}
        PCBEX_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: "$GITHUB_ACTION_PATH/scripts/github-analysis.sh"

    - name: Upload analysis artifact
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.analyze.outputs.artifact-dir != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.analyze.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.analyze.outputs.sarif-dir != '' }}
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif-dir }}
        category: pcbex-hardware-ci

    - name: Create or update pull request comment
      id: comment
      if: ${{ always() && inputs.pr-comment == 'true' && steps.analyze.outputs.comment-body != '' }}
      shell: bash
      env:
        PCBEX_API_URL: ${{ github.api_url }}
        PCBEX_GITHUB_TOKEN: ${{ inputs.github-token }}
        PCBEX_REPOSITORY: ${{ github.repository }}
        PCBEX_PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        PCBEX_COMMENT_ID: ${{ inputs.comment-id }}
        PCBEX_COMMENT_BODY: ${{ steps.analyze.outputs.comment-body }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/upsert-pr-comment.py"

    - name: Enforce analysis gates
      if: ${{ always() }}
      shell: bash
      env:
        PCBEX_ANALYSIS_STATUS: ${{ steps.analyze.outputs.status }}
        PCBEX_VIOLATION_COUNT: ${{ steps.analyze.outputs.violation-count }}
        PCBEX_REGRESSION: ${{ steps.analyze.outputs.regression }}
        PCBEX_MANUFACTURING_FEEDBACK_PASSED: ${{ steps.analyze.outputs.manufacturing-feedback-passed }}
        PCBEX_FAIL_ON_VIOLATIONS: ${{ inputs.fail-on-violations }}
        PCBEX_FAIL_ON_REGRESSIONS: ${{ inputs.fail-on-regressions }}
        PCBEX_FAIL_ON_MANUFACTURING_FEEDBACK: ${{ inputs.fail-on-manufacturing-feedback }}
      run: |
        set -euo pipefail
        if [[ "$PCBEX_ANALYSIS_STATUS" != "ok" ]]; then
          echo "::error::pcbex analysis did not complete"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_VIOLATIONS" == "true" && "$PCBEX_VIOLATION_COUNT" != "0" ]]; then
          echo "::error::pcbex found $PCBEX_VIOLATION_COUNT current-board violation(s)"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_REGRESSIONS" == "true" && "$PCBEX_REGRESSION" == "true" ]]; then
          echo "::error::pcbex found a hardware-analysis regression"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_MANUFACTURING_FEEDBACK" == "true" && "$PCBEX_MANUFACTURING_FEEDBACK_PASSED" != "true" ]]; then
          echo "::error::pcbex manufacturing feedback is absent or did not pass"
          exit 1
        fi
