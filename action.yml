        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_IDS: ${{ inputs.approval-log-gossip-organization-ids }}
        PCBEX_APPROVAL_LOG_GOSSIP_OBSERVER_IDS: ${{ inputs.approval-log-gossip-observer-ids }}
        PCBEX_APPROVAL_LOG_GOSSIP_OBSERVER_PUBLIC_KEY_FILES: ${{ inputs.approval-log-gossip-observer-public-key-files }}
        PCBEX_APPROVAL_LOG_GOSSIP_OBSERVER_TRUST_STATE_FILES: ${{ inputs.approval-log-gossip-observer-trust-state-files }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY: ${{ inputs.approval-log-gossip-organization-registry }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_AUTHORITY_KEY_ROTATION: ${{ inputs.approval-log-gossip-organization-registry-authority-key-rotation }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_GOVERNANCE: ${{ inputs.approval-log-gossip-organization-registry-governance }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_THRESHOLD_TRANSITION: ${{ inputs.approval-log-gossip-organization-registry-threshold-transition }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_GOVERNANCE_ROTATION_NEW: ${{ inputs.approval-log-gossip-organization-registry-governance-rotation-new }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_GOVERNANCE_ROTATION: ${{ inputs.approval-log-gossip-organization-registry-governance-rotation }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_GOVERNED_AUTHORITY_KEY_ROTATION: ${{ inputs.approval-log-gossip-organization-registry-governed-authority-key-rotation }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY: ${{ inputs.approval-log-gossip-organization-registry-history }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_BASELINE: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-baseline }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_ACCEPTED_AT_UNIX: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-accepted-at-unix }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_WITNESS_FILES: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-witness-files }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_TRUSTED_WITNESS_IDS: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-trusted-witness-ids }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_TRUSTED_WITNESS_PUBLIC_KEY_FILES: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-trusted-witness-public-key-files }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_WITNESS_TRUST_STATE_FILES: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-witness-trust-state-files }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_MINIMUM_WITNESSES: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-minimum-witnesses }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_EVALUATED_AT_UNIX: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-evaluated-at-unix }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_REMOTE_WITNESS_ENDPOINTS: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-remote-witness-endpoints }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_REMOTE_WITNESS_IDS: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-remote-witness-ids }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_REMOTE_WITNESS_PUBLIC_KEY_FILES: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-remote-witness-public-key-files }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_REMOTE_WITNESS_TRUST_STATE_FILES: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-remote-witness-trust-state-files }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_REMOTE_WITNESS_BEARER_TOKEN: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-remote-witness-bearer-token }}
        PCBEX_APPROVAL_LOG_GOSSIP_ORGANIZATION_REGISTRY_HISTORY_CHECKPOINT_REMOTE_WITNESS_TIMEOUT_SECONDS: ${{ inputs.approval-log-gossip-organization-registry-history-checkpoint-remote-witness-timeout-seconds }}
        PCBEX_APPROVAL_LOG_GOSSIP_MINIMUM_ORGANIZATIONS: ${{ inputs.approval-log-gossip-minimum-organizations }}
        PCBEX_APPROVAL_LOG_REMOTE_GOSSIP_ENDPOINTS: ${{ inputs.approval-log-remote-gossip-endpoints }}
        PCBEX_APPROVAL_LOG_REMOTE_GOSSIP_ORGANIZATION_IDS: ${{ inputs.approval-log-remote-gossip-organization-ids }}
        PCBEX_APPROVAL_LOG_REMOTE_GOSSIP_OBSERVER_IDS: ${{ inputs.approval-log-remote-gossip-observer-ids }}
        PCBEX_APPROVAL_LOG_REMOTE_GOSSIP_PUBLIC_KEY_FILES: ${{ inputs.approval-log-remote-gossip-public-key-files }}
        PCBEX_APPROVAL_LOG_REMOTE_GOSSIP_TRUST_STATE_FILES: ${{ inputs.approval-log-remote-gossip-trust-state-files }}
        PCBEX_APPROVAL_LOG_REMOTE_GOSSIP_BEARER_TOKEN: ${{ inputs.approval-log-remote-gossip-bearer-token }}
        PCBEX_APPROVAL_LOG_REMOTE_GOSSIP_TIMEOUT_SECONDS: ${{ inputs.approval-log-remote-gossip-timeout-seconds }}
        PCBEX_APPROVAL_LOG_WITNESS_FILES: ${{ inputs.approval-log-witness-files }}
        PCBEX_APPROVAL_LOG_WITNESS_PUBLIC_KEYS: ${{ inputs.approval-log-witness-public-keys }}
        PCBEX_APPROVAL_LOG_MINIMUM_WITNESSES: ${{ inputs.approval-log-minimum-witnesses }}
        PCBEX_REMOTE_WITNESS_ENDPOINT: ${{ inputs.remote-witness-endpoint }}
        PCBEX_REMOTE_WITNESS_PUBLIC_KEY: ${{ inputs.remote-witness-public-key }}
        PCBEX_REMOTE_WITNESS_TRUST_STATE: ${{ inputs.remote-witness-trust-state }}
        PCBEX_REMOTE_WITNESS_BEARER_TOKEN: ${{ inputs.remote-witness-bearer-token }}
        PCBEX_REMOTE_WITNESS_TIMEOUT_SECONDS: ${{ inputs.remote-witness-timeout-seconds }}
        PCBEX_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: "$GITHUB_ACTION_PATH/scripts/github-analysis.sh"

    - name: Upload analysis artifact
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.analyze.outputs.artifact-dir != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.analyze.outputs.artifact-dir }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.analyze.outputs.sarif-dir != '' }}
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        sarif_file: ${{ steps.analyze.outputs.sarif-dir }}
        category: pcbex-hardware-ci

    - name: Create or update pull request comment
      id: comment
      if: ${{ always() && inputs.pr-comment == 'true' && steps.analyze.outputs.comment-body != '' }}
      shell: bash
      env:
        PCBEX_API_URL: ${{ github.api_url }}
        PCBEX_GITHUB_TOKEN: ${{ inputs.github-token }}
        PCBEX_REPOSITORY: ${{ github.repository }}
        PCBEX_PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        PCBEX_COMMENT_ID: ${{ inputs.comment-id }}
        PCBEX_COMMENT_BODY: ${{ steps.analyze.outputs.comment-body }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/upsert-pr-comment.py"

    - name: Enforce analysis gates
      if: ${{ always() }}
      shell: bash
      env:
        PCBEX_ANALYSIS_STATUS: ${{ steps.analyze.outputs.status }}
        PCBEX_VIOLATION_COUNT: ${{ steps.analyze.outputs.violation-count }}
        PCBEX_REGRESSION: ${{ steps.analyze.outputs.regression }}
        PCBEX_MANUFACTURING_FEEDBACK_PASSED: ${{ steps.analyze.outputs.manufacturing-feedback-passed }}
        PCBEX_SCHEMATIC_REVIEW_REQUIRED: ${{ steps.analyze.outputs.schematic-review-required }}
        PCBEX_SCHEMATIC_REVIEW_ALL_ROUTED: ${{ steps.analyze.outputs.schematic-review-all-routed }}
        PCBEX_AI_APPROVAL_QUORUM_MET: ${{ steps.analyze.outputs.ai-approval-quorum-met }}
        PCBEX_SCHEMATIC_APPROVAL_MET: ${{ steps.analyze.outputs.schematic-approval-met }}
        PCBEX_APPROVAL_LOG_VERIFIED: ${{ steps.analyze.outputs.approval-log-verified }}
        PCBEX_APPROVAL_LOG_ANCHORED: ${{ steps.analyze.outputs.approval-log-anchored }}
        PCBEX_APPROVAL_LOG_CONSISTENT: ${{ steps.analyze.outputs.approval-log-consistent }}
        PCBEX_APPROVAL_LOG_GOSSIP_VERIFIED: ${{ steps.analyze.outputs.approval-log-gossip-verified }}
        PCBEX_APPROVAL_LOG_GOSSIP_QUORUM_MET: ${{ steps.analyze.outputs.approval-log-gossip-quorum-met }}
        PCBEX_APPROVAL_LOG_WITNESS_QUORUM_MET: ${{ steps.analyze.outputs.approval-log-witness-quorum-met }}
        PCBEX_CANARY_ROLLOUT_AUTHORIZED: ${{ steps.analyze.outputs.canary-rollout-authorized }}
        PCBEX_CANARY_MONITORING_PASSED: ${{ steps.analyze.outputs.canary-monitoring-passed }}
        PCBEX_CANARY_COMPLETION_FINALIZED: ${{ steps.analyze.outputs.canary-completion-finalized }}
        PCBEX_POLICY_DEPLOYMENT_STATUS: ${{ steps.analyze.outputs.policy-deployment-status }}
        PCBEX_POLICY_DEPLOYMENT_VERIFIED: ${{ steps.analyze.outputs.policy-deployment-verified }}
        PCBEX_POLICY_DEPLOYMENT_ROLLBACK_STATUS: ${{ steps.analyze.outputs.policy-deployment-rollback-status }}
        PCBEX_POLICY_ROLLBACK_RECOVERY_VERIFIED: ${{ steps.analyze.outputs.policy-rollback-recovery-verified }}
        PCBEX_ROLLBACK_INCIDENT_STATUS: ${{ steps.analyze.outputs.rollback-incident-status }}
        PCBEX_POLICY_INCIDENT_SUSPENSION_REVIEW_REQUIRED: ${{ steps.analyze.outputs.policy-incident-suspension-review-required }}
        PCBEX_POLICY_SUSPENSION_STATUS: ${{ steps.analyze.outputs.policy-suspension-status }}
        PCBEX_POLICY_REMEDIATION_STATUS: ${{ steps.analyze.outputs.policy-remediation-status }}
        PCBEX_POLICY_LIFECYCLE_AWAITING_REMEDIATION: ${{ steps.analyze.outputs.policy-lifecycle-awaiting-remediation }}
        PCBEX_POLICY_LIFECYCLE_CHECKPOINT_ACCEPTED: ${{ steps.analyze.outputs.policy-lifecycle-checkpoint-accepted }}
        PCBEX_POLICY_LIFECYCLE_WITNESS_QUORUM_MET: ${{ steps.analyze.outputs.policy-lifecycle-witness-quorum-met }}
        PCBEX_POLICY_LIFECYCLE_LOG_ANCHORED: ${{ steps.analyze.outputs.policy-lifecycle-log-anchored }}
        PCBEX_POLICY_LIFECYCLE_LOG_CONSISTENT: ${{ steps.analyze.outputs.policy-lifecycle-log-consistent }}
        PCBEX_POLICY_LIFECYCLE_LOG_GOSSIP_VERIFIED: ${{ steps.analyze.outputs.policy-lifecycle-log-gossip-verified }}
        PCBEX_POLICY_LIFECYCLE_LOG_GOSSIP_QUORUM_MET: ${{ steps.analyze.outputs.policy-lifecycle-log-gossip-quorum-met }}
        PCBEX_FAIL_ON_VIOLATIONS: ${{ inputs.fail-on-violations }}
        PCBEX_FAIL_ON_REGRESSIONS: ${{ inputs.fail-on-regressions }}
        PCBEX_FAIL_ON_MANUFACTURING_FEEDBACK: ${{ inputs.fail-on-manufacturing-feedback }}
        PCBEX_FAIL_ON_SCHEMATIC_REVIEW: ${{ inputs.fail-on-schematic-review }}
        PCBEX_FAIL_ON_UNROUTED_SCHEMATIC_REVIEW: ${{ inputs.fail-on-unrouted-schematic-review }}
        PCBEX_FAIL_ON_AI_QUORUM: ${{ inputs.fail-on-ai-quorum }}
        PCBEX_FAIL_ON_SCHEMATIC_APPROVAL: ${{ inputs.fail-on-schematic-approval }}
        PCBEX_FAIL_ON_APPROVAL_LOG: ${{ inputs.fail-on-approval-log }}
        PCBEX_FAIL_ON_APPROVAL_LOG_ANCHOR: ${{ inputs.fail-on-approval-log-anchor }}
        PCBEX_FAIL_ON_APPROVAL_LOG_CONSISTENCY: ${{ inputs.fail-on-approval-log-consistency }}
        PCBEX_FAIL_ON_APPROVAL_LOG_GOSSIP: ${{ inputs.fail-on-approval-log-gossip }}
        PCBEX_FAIL_ON_APPROVAL_LOG_GOSSIP_QUORUM: ${{ inputs.fail-on-approval-log-gossip-quorum }}
        PCBEX_FAIL_ON_APPROVAL_LOG_WITNESSES: ${{ inputs.fail-on-approval-log-witnesses }}
        PCBEX_FAIL_ON_CANARY_ROLLOUT_AUTHORIZATION: ${{ inputs.fail-on-canary-rollout-authorization }}
        PCBEX_FAIL_ON_CANARY_MONITORING: ${{ inputs.fail-on-canary-monitoring }}
        PCBEX_FAIL_ON_CANARY_COMPLETION: ${{ inputs.fail-on-canary-completion }}
        PCBEX_FAIL_ON_POLICY_DEPLOYMENT_PROMOTION: ${{ inputs.fail-on-policy-deployment-promotion }}
        PCBEX_FAIL_ON_POLICY_DEPLOYMENT_VERIFICATION: ${{ inputs.fail-on-policy-deployment-verification }}
        PCBEX_FAIL_ON_POLICY_DEPLOYMENT_ROLLBACK: ${{ inputs.fail-on-policy-deployment-rollback }}
        PCBEX_FAIL_ON_POLICY_ROLLBACK_RECOVERY: ${{ inputs.fail-on-policy-rollback-recovery }}
        PCBEX_FAIL_ON_ROLLBACK_INCIDENT_CLOSURE: ${{ inputs.fail-on-rollback-incident-closure }}
        PCBEX_FAIL_ON_POLICY_INCIDENT_SUSPENSION_REVIEW: ${{ inputs.fail-on-policy-incident-suspension-review }}
        PCBEX_FAIL_ON_POLICY_SUSPENSION: ${{ inputs.fail-on-policy-suspension }}
        PCBEX_FAIL_ON_POLICY_REMEDIATION: ${{ inputs.fail-on-policy-remediation }}
        PCBEX_FAIL_ON_POLICY_LIFECYCLE_PENDING: ${{ inputs.fail-on-policy-lifecycle-pending }}
        PCBEX_FAIL_ON_POLICY_LIFECYCLE_CHECKPOINT: ${{ inputs.fail-on-policy-lifecycle-checkpoint }}
        PCBEX_FAIL_ON_POLICY_LIFECYCLE_WITNESS_QUORUM: ${{ inputs.fail-on-policy-lifecycle-witness-quorum }}
        PCBEX_FAIL_ON_POLICY_LIFECYCLE_LOG_ANCHOR: ${{ inputs.fail-on-policy-lifecycle-log-anchor }}
        PCBEX_FAIL_ON_POLICY_LIFECYCLE_LOG_CONSISTENCY: ${{ inputs.fail-on-policy-lifecycle-log-consistency }}
        PCBEX_FAIL_ON_POLICY_LIFECYCLE_LOG_GOSSIP: ${{ inputs.fail-on-policy-lifecycle-log-gossip }}
        PCBEX_FAIL_ON_POLICY_LIFECYCLE_LOG_GOSSIP_QUORUM: ${{ inputs.fail-on-policy-lifecycle-log-gossip-quorum }}
      run: |
        set -euo pipefail
        if [[ "$PCBEX_ANALYSIS_STATUS" != "ok" ]]; then
          echo "::error::pcbex analysis did not complete"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_VIOLATIONS" == "true" && "$PCBEX_VIOLATION_COUNT" != "0" ]]; then
          echo "::error::pcbex found $PCBEX_VIOLATION_COUNT current-board violation(s)"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_REGRESSIONS" == "true" && "$PCBEX_REGRESSION" == "true" ]]; then
          echo "::error::pcbex found a hardware-analysis regression"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_MANUFACTURING_FEEDBACK" == "true" && "$PCBEX_MANUFACTURING_FEEDBACK_PASSED" != "true" ]]; then
          echo "::error::pcbex manufacturing feedback is absent or did not pass"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_SCHEMATIC_REVIEW" == "true" && "$PCBEX_SCHEMATIC_REVIEW_REQUIRED" != "false" ]]; then
          echo "::error::pcbex schematic semantic diff requires review or was not produced"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_UNROUTED_SCHEMATIC_REVIEW" == "true" && "$PCBEX_SCHEMATIC_REVIEW_REQUIRED" != "false" && "$PCBEX_SCHEMATIC_REVIEW_ALL_ROUTED" != "true" ]]; then
          echo "::error::pcbex required schematic review has no complete reviewer-routing plan"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_AI_QUORUM" == "true" && "$PCBEX_AI_APPROVAL_QUORUM_MET" != "true" ]]; then
          echo "::error::pcbex AI schematic approval quorum is absent or did not pass"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_SCHEMATIC_APPROVAL" == "true" && "$PCBEX_SCHEMATIC_APPROVAL_MET" != "true" ]]; then
          echo "::error::pcbex schematic has neither AI quorum nor governed human approval"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG" == "true" && "$PCBEX_APPROVAL_LOG_VERIFIED" != "true" ]]; then
          echo "::error::pcbex approval transparency log is absent or invalid"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG_ANCHOR" == "true" && "$PCBEX_APPROVAL_LOG_ANCHORED" != "true" ]]; then
          echo "::error::pcbex approval checkpoint public-log anchor is absent or invalid"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG_CONSISTENCY" == "true" && "$PCBEX_APPROVAL_LOG_CONSISTENT" != "true" ]]; then
          echo "::error::pcbex approval public-log prefix consistency is absent or invalid"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG_GOSSIP" == "true" && "$PCBEX_APPROVAL_LOG_GOSSIP_VERIFIED" != "true" ]]; then
          echo "::error::pcbex approval public-log gossip observation is absent or inconsistent"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG_GOSSIP_QUORUM" == "true" && "$PCBEX_APPROVAL_LOG_GOSSIP_QUORUM_MET" != "true" ]]; then
          echo "::error::pcbex approval public-log gossip organization quorum is absent or invalid"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_APPROVAL_LOG_WITNESSES" == "true" && "$PCBEX_APPROVAL_LOG_WITNESS_QUORUM_MET" != "true" ]]; then
          echo "::error::pcbex approval transparency-log witness quorum is absent or invalid"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_CANARY_ROLLOUT_AUTHORIZATION" == "true" && "$PCBEX_CANARY_ROLLOUT_AUTHORIZED" != "true" ]]; then
          echo "::error::pcbex canary policy rollout lacks a valid dual-control authorization"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_CANARY_MONITORING" == "true" && "$PCBEX_CANARY_MONITORING_PASSED" != "true" ]]; then
          echo "::error::pcbex canary monitoring is absent, incomplete, or requires rollback"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_CANARY_COMPLETION" == "true" && "$PCBEX_CANARY_COMPLETION_FINALIZED" != "true" ]]; then
          echo "::error::pcbex canary completion lacks a unanimous trusted human decision"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_POLICY_DEPLOYMENT_PROMOTION" == "true" && "$PCBEX_POLICY_DEPLOYMENT_STATUS" != "promotion_applied" ]]; then
          echo "::error::pcbex policy deployment was absent or retained rollback instead of promotion"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_POLICY_DEPLOYMENT_VERIFICATION" == "true" && "$PCBEX_POLICY_DEPLOYMENT_VERIFIED" != "true" ]]; then
          echo "::error::pcbex post-deployment evidence is absent, incomplete, or requires dual-control rollback"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_POLICY_DEPLOYMENT_ROLLBACK" == "true" && "$PCBEX_POLICY_DEPLOYMENT_ROLLBACK_STATUS" != "rollback_applied" ]]; then
          echo "::error::pcbex production rollback is absent or lacks a valid dual-control authorization"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_POLICY_ROLLBACK_RECOVERY" == "true" && "$PCBEX_POLICY_ROLLBACK_RECOVERY_VERIFIED" != "true" ]]; then
          echo "::error::pcbex post-rollback recovery is absent, incomplete, or regressed"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_ROLLBACK_INCIDENT_CLOSURE" == "true" && "$PCBEX_ROLLBACK_INCIDENT_STATUS" != "incident_closed" ]]; then
          echo "::error::pcbex rollback incident lacks clean recovery and independent operator acknowledgment"
          exit 1
        fi
        if [[ "$PCBEX_FAIL_ON_POLICY_INCIDENT_SUSPENSION_REVIEW" == "true" && "$PCBEX_POLICY_INCIDENT_SUSPENSION_REVIEW_REQUIRED" != "false" ]]; then
          echo "::error::pcbex policy incident history requires human suspension review"
          exit 1
        fi
