          approval-log-gossip-organization-registry-history-checkpoint-remote-witness-trust-state-files: build/action-quorum/gossip-history-witness-a.rotated.trust.json
          approval-log-gossip-organization-registry-history-checkpoint-evaluated-at-unix: "18"
