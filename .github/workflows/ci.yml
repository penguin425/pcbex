name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Compile routing benchmarks
        run: cargo bench -p pcbex-core --bench routing --no-run --locked
      - name: Enforce deterministic routing performance budgets
        run: cargo test -p pcbex-core --test performance_budget --locked -- --nocapture

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run agent tests
        env:
          PYTHONPATH: agent/src
        run: python -m unittest discover -s agent/tests -v
