name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware-ci-action:
    name: Hardware CI action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare manufacturing feedback fixture
        run: |
          mkdir -p build/action-feedback
          board_sha256="$(sha256sum examples/simple.kicad_pcb | cut -d' ' -f1)"
          jq -n \
            --arg board_sha256 "$board_sha256" \
            '{
              schema_version: 1,
              id: "action-smoke-lot",
              manufacturer: {
                id: "example-fab",
                process: "CI fixture"
              },
              received_on: "2026-07-29",
              board_sha256: $board_sha256,
              disposition: "accepted",
              findings: [{
                id: "inspection-record",
                category: "other",
                severity: "info",
                message: "Inspection record is attached.",
                evidence: ["inspection.txt"]
              }]
            }' > build/action-feedback/declaration.json
          printf '%s\n' 'inspection passed' > build/action-feedback/inspection.txt
      - name: Exercise the public composite action
        id: pcbex
        uses: ./
        with:
          board: examples/simple.kicad_pcb
          baseline-board: examples/simple.kicad_pcb
          policy-pack: examples/acme-policy-pack.json
          manufacturing-feedback-declaration: build/action-feedback/declaration.json
          manufacturing-feedback-artifacts: build/action-feedback/inspection.txt
          fail-on-manufacturing-feedback: "true"
          output-dir: build/action-analysis
          fail-on-violations: "false"
          fail-on-regressions: "true"
          artifact-name: pcbex-action-smoke
          pr-comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          github-token: ${{ github.token }}
          comment-id: action-smoke
      - name: Verify action outputs
        env:
          ARTIFACT_DIR: ${{ steps.pcbex.outputs.artifact-dir }}
          COMMENT_URL: ${{ steps.pcbex.outputs.comment-url }}
          VIOLATION_COUNT: ${{ steps.pcbex.outputs.violation-count }}
          REGRESSION: ${{ steps.pcbex.outputs.regression }}
          MANUFACTURING_FEEDBACK: ${{ steps.pcbex.outputs.manufacturing-feedback }}
          MANUFACTURING_FEEDBACK_PASSED: ${{ steps.pcbex.outputs.manufacturing-feedback-passed }}
          SHOULD_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test -s "$ARTIFACT_DIR/pr-comment.md"
          grep -F '# pcbex hardware analysis' "$ARTIFACT_DIR/pr-comment.md"
          grep -F '# pcbex baseline comparison' "$ARTIFACT_DIR/pr-comment.md"
          test "$(jq -r '.configuration.dfm_profile.id' "$ARTIFACT_DIR/current/run.json")" = "acme-standard-4layer-v1"
          test "$(jq -r '.dfm_profile_file' "$ARTIFACT_DIR/current/run.json")" = "null"
          test "$(jq -r '.configuration.organization_policy_pack' "$ARTIFACT_DIR/current/run.json")" = "acme-production-v1"
          test "$(jq -r '.policy_pack_file.sha256 | length' "$ARTIFACT_DIR/current/run.json")" = "64"
          test "$VIOLATION_COUNT" = "1"
          test "$REGRESSION" = "false"
          test -s "$MANUFACTURING_FEEDBACK"
          test "$MANUFACTURING_FEEDBACK_PASSED" = "true"
          test "$(jq -r '.declaration.id' "$MANUFACTURING_FEEDBACK")" = "action-smoke-lot"
          if [[ "$SHOULD_COMMENT" == "true" ]]; then
            [[ "$COMMENT_URL" == https://github.com/* ]]
          else
            test -z "$COMMENT_URL"
          fi
      - name: Prepare signed policy trust fixture
        run: |
          mkdir -p build/action-policy
          target/release/pcbex policy-keygen \
            --private-key build/action-policy/policy.key \
            --public-key build/action-policy/policy.pub
          target/release/pcbex sign-policy-pack examples/acme-policy-pack.json \
            --private-key build/action-policy/policy.key \
            --signer-id hardware-security \
            --output build/action-policy/policy.signed.json
          target/release/pcbex verify-policy-pack \
            build/action-policy/policy.signed.json \
            --public-key build/action-policy/policy.pub \
            --output build/action-policy/accepted-policy.json \
            --state-output build/action-policy/accepted-state.json
      - name: Exercise signed policy rollback protection
        id: signed-pcbex
        uses: ./
        with:
          board: examples/simple.kicad_pcb
          signed-policy-pack: build/action-policy/policy.signed.json
          policy-public-key: build/action-policy/policy.pub
          policy-trust-state: build/action-policy/accepted-state.json
          output-dir: build/signed-action-analysis
          fail-on-violations: "false"
          artifact-name: pcbex-signed-action-smoke
      - name: Verify signed policy trust output
        env:
          TRUST_STATE: ${{ steps.signed-pcbex.outputs.verified-policy-trust-state }}
        run: |
          test -s "$TRUST_STATE"
          test "$(jq -r '.accepted_revision' "$TRUST_STATE")" = "1"
          test "$(jq -r '.policy_pack_id' "$TRUST_STATE")" = "acme-production-v1"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Compile routing benchmarks
        run: cargo bench -p pcbex-core --bench routing --no-run --locked
      - name: Enforce deterministic routing performance budgets
        run: cargo test -p pcbex-core --test performance_budget --locked -- --nocapture
      - name: Run practical routing regression corpus
        run: scripts/regression-corpus.sh target/release/pcbex build/regression-corpus
      - name: Verify completion audit is current
        run: python3 scripts/update-completion-audit.py --check
      - name: Test release audit
        run: python3 -m unittest discover -s scripts/tests -v

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run agent tests
        env:
          PYTHONPATH: agent/src
        run: python -m unittest discover -s agent/tests -v
