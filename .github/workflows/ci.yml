          test "$INSUFFICIENT_OUTCOME" = "failure"
          test "$INSUFFICIENT_STATUS" = "ok"
          test "$INSUFFICIENT_ARTIFACT_DIR" = "build/fabrication-authorization-insufficient"
          test "$INSUFFICIENT_REPORT" = "$INSUFFICIENT_ARTIFACT_DIR/fabrication-authorization.json"
          test -s "$INSUFFICIENT_REPORT"
          test "$INSUFFICIENT_SCHEMA_VERSION" = "1"
          test "$INSUFFICIENT_STATUS_VALUE" = "not_authorized"
          test "$INSUFFICIENT_AUTHORIZED" = "false"
          test "$INSUFFICIENT_AUTHORIZATION_ID" = "$AUTHORIZED_AUTHORIZATION_ID"
          test "$INSUFFICIENT_CHALLENGE" = "$AUTHORIZED_CHALLENGE"
          test "$INSUFFICIENT_QUANTITY" = "$AUTHORIZED_QUANTITY"
          test "$INSUFFICIENT_CURRENCY" = "$AUTHORIZED_CURRENCY"
          test "$INSUFFICIENT_MAXIMUM_TOTAL" = "$AUTHORIZED_MAXIMUM_TOTAL"
          test "$INSUFFICIENT_VALID_FROM" = "$AUTHORIZED_VALID_FROM"
          test "$INSUFFICIENT_EXPIRES_AT" = "$AUTHORIZED_EXPIRES_AT"
          test "$INSUFFICIENT_EVALUATED_AT" -ge "$INSUFFICIENT_VALID_FROM"
          test "$INSUFFICIENT_EVALUATED_AT" -le "$INSUFFICIENT_EXPIRES_AT"
          test "$INSUFFICIENT_APPROVALS" = "1"
          test "$INSUFFICIENT_REJECTIONS" = "0"
          test "$INSUFFICIENT_GATE_FAILURE_COUNT" = "1"
          test "$INSUFFICIENT_PLAN_SHA256" = "$AUTHORIZED_PLAN_SHA256"
          test "$INSUFFICIENT_RUN_SHA256" = "$AUTHORIZED_RUN_SHA256"
          test "$INSUFFICIENT_PACKAGE_SHA256" = "$AUTHORIZED_PACKAGE_SHA256"
          test "$INSUFFICIENT_RECEIPT_SHA256" = "$AUTHORIZED_RECEIPT_SHA256"
          test "$INSUFFICIENT_POLICY_SHA256" = "$AUTHORIZED_POLICY_SHA256"
          test "$INSUFFICIENT_QUOTE_VERIFIED" = "false"
          test "$INSUFFICIENT_CHALLENGE_ENFORCED" = "false"
          test "$INSUFFICIENT_REPORT_BYTES" -le 134217728
          test "$INSUFFICIENT_REPORT_BYTES" = "$(wc -c < "$INSUFFICIENT_REPORT" | tr -d ' ')"
          test "$INSUFFICIENT_REPORT_SHA256" = "$(sha256sum "$INSUFFICIENT_REPORT" | cut -d' ' -f1)"
          jq -e \
            --arg authorization_id "$INSUFFICIENT_AUTHORIZATION_ID" \
            --arg challenge "$INSUFFICIENT_CHALLENGE" \
            --arg currency "$INSUFFICIENT_CURRENCY" \
            --arg plan_sha256 "$INSUFFICIENT_PLAN_SHA256" \
            --arg run_sha256 "$INSUFFICIENT_RUN_SHA256" \
            --arg package_sha256 "$INSUFFICIENT_PACKAGE_SHA256" \
            --arg receipt_sha256 "$INSUFFICIENT_RECEIPT_SHA256" \
            --arg policy_sha256 "$INSUFFICIENT_POLICY_SHA256" \
            --argjson quantity "$INSUFFICIENT_QUANTITY" \
            --argjson maximum_total "$INSUFFICIENT_MAXIMUM_TOTAL" \
            --argjson valid_from "$INSUFFICIENT_VALID_FROM" \
            --argjson expires_at "$INSUFFICIENT_EXPIRES_AT" \
            --argjson evaluated_at "$INSUFFICIENT_EVALUATED_AT" \
            '.schema_version == 1
             and .status == "not_authorized"
             and .fabrication_authorized == false
             and .approvals == 1
             and .rejections == 0
             and .gate_failures == ["insufficient_fabrication_approvals:required=2:actual=1"]
             and .scope == {
               authorization_id: $authorization_id,
               challenge: $challenge,
               quantity: $quantity,
               currency: $currency,
               maximum_total_minor_units: $maximum_total,
               valid_from_unix: $valid_from,
               expires_at_unix: $expires_at
             }
             and .evaluated_at_unix == $evaluated_at
             and .evidence.pipeline.plan_sha256 == $plan_sha256
             and .evidence.pipeline.run_sha256 == $run_sha256
             and .evidence.manufacturing_package.sha256 == $package_sha256
             and .evidence.factory_receipt.receipt.sha256 == $receipt_sha256
             and .evidence.policy_pack.source.sha256 == $policy_sha256
             and .evidence.factory_receipt.quote_authenticity_verified == false
             and .challenge_one_time_use_enforced == false' \
            "$INSUFFICIENT_REPORT" >/dev/null
      - name: Prepare deterministic pipeline plan fixture
        run: |
          smoke_dir=build/deterministic-pipeline
          mkdir -p "$smoke_dir/firmware"

          # Keep inputs deliberately small. The firmware bundle must satisfy
          # compiler admission, while the hardware evidence stays invalid so
          # the root Action retains a rejected report through the real runner.
          printf '%s\n' '{}' > "$smoke_dir/circuit.json"
          printf '%s\n' 'not a KiCad schematic' > "$smoke_dir/design.kicad_sch"
          printf '%s\n' '{}' > "$smoke_dir/review.json"
          printf '%s\n' '(kicad_pcb' > "$smoke_dir/design.kicad_pcb"
          printf '%s\n' '{}' > "$smoke_dir/analysis-manifest.json"
          printf '%s\n' '{}' > "$smoke_dir/analysis-checks.json"
          printf '%s\n' '{}' > "$smoke_dir/quality.json"
          printf '%s\n' 'not a manufacturing package' > "$smoke_dir/package.bin"
          for artifact in pinout.h firmware.h firmware.c firmware_smoke_test.c firmware.cpp firmware_cpp_smoke_test.cpp host.py; do
            printf '%s\n' 'invalid fixture' > "$smoke_dir/firmware/$artifact"
          done
          firmware_artifacts="$({
            for artifact in pinout.h firmware.h firmware.c firmware_smoke_test.c firmware.cpp firmware_cpp_smoke_test.cpp host.py; do
              bytes="$(wc -c < "$smoke_dir/firmware/$artifact" | tr -d ' ')"
              sha="$(sha256sum "$smoke_dir/firmware/$artifact" | cut -d' ' -f1)"
              jq -n --arg path "$artifact" --argjson bytes "$bytes" --arg sha256 "$sha" \
                '{path: $path, bytes: $bytes, sha256: $sha256}'
            done
          } | jq -s '.')"
          jq -n --argjson artifacts "$firmware_artifacts" \
            '{
              schema_version: 2,
              engine: "pcbex",
              engine_version: "1.436.0-ci",
              schematic_sha256: ("0" * 64),
              artifacts: $artifacts,
              c_build: {
                attempted: false, passed: false, command: ["cc"], exit_code: null,
                smoke: {attempted: false, passed: false, command: ["smoke"], exit_code: null}
              },
              cpp_build: {
                attempted: false, passed: false, command: ["c++"], exit_code: null,
                smoke: {attempted: false, passed: false, command: ["smoke"], exit_code: null}
              },
              python_check: {
                attempted: false, passed: false, command: ["python3"], exit_code: null,
                smoke: {attempted: false, passed: false, command: ["smoke"], exit_code: null}
              }
            }' > "$smoke_dir/firmware/manifest.json"

          descriptor() {
            local path="$1"
            local bytes sha
            bytes="$(wc -c < "$smoke_dir/$path" | tr -d ' ')"
            sha="$(sha256sum "$smoke_dir/$path" | cut -d' ' -f1)"
            jq -n --arg path "$path" --argjson bytes "$bytes" --arg sha256 "$sha" \
              '{path: $path, bytes: $bytes, sha256: $sha256}'
          }
          jq -n \
            --argjson circuit_spec "$(descriptor circuit.json)" \
            --argjson schematic "$(descriptor design.kicad_sch)" \
            --argjson electrical_review "$(descriptor review.json)" \
            --argjson board "$(descriptor design.kicad_pcb)" \
            --argjson analysis_manifest "$(descriptor analysis-manifest.json)" \
            --argjson analysis_checks "$(descriptor analysis-checks.json)" \
            --argjson quality "$(descriptor quality.json)" \
            --argjson manufacturing_package "$(descriptor package.bin)" \
            --argjson firmware_manifest "$(descriptor firmware/manifest.json)" \
            '{
              schema_version: 1,
              circuit_spec: $circuit_spec,
              schematic: $schematic,
              electrical_policy: null,
              electrical_review: $electrical_review,
              board: $board,
              analysis_manifest: $analysis_manifest,
              analysis_checks: $analysis_checks,
              quality: $quality,
              analysis_project: null,
              analysis_rules: null,
              analysis_dfm_profile: null,
              analysis_policy_pack: null,
              analysis_physical_profile: null,
              manufacturing_package: $manufacturing_package,
              firmware_manifest: $firmware_manifest,
              factory_receipt: null,
              require_factory: false
            }' > "$smoke_dir/plan.json"
          # Retain the descriptor plan as a schema fixture; the Action below
          # exercises only the closed intent compiler and does not exercise
          # the legacy plan-only composite path.
          jq -n \
            '{
              schema_version: 1,
              circuit_spec: "circuit.json",
              schematic: "design.kicad_sch",
              electrical_policy: null,
              electrical_review: "review.json",
              board: "design.kicad_pcb",
              analysis_manifest: "analysis-manifest.json",
              analysis_checks: "analysis-checks.json",
              quality: "quality.json",
              analysis_project: null,
              analysis_rules: null,
              analysis_dfm_profile: null,
              analysis_policy_pack: null,
              analysis_physical_profile: null,
              manufacturing_package: "package.bin",
              firmware_manifest: "firmware/manifest.json",
              factory_receipt: null,
              require_factory: false
            }' > "$smoke_dir/intent.json"
      - name: Exercise the public composite action
        id: pcbex
