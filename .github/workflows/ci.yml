          REMOTE_WITNESS: ${{ steps.pcbex.outputs.remote-witness }}
          REMOTE_WITNESS_RECEIPT: ${{ steps.pcbex.outputs.remote-witness-receipt }}
          APPROVAL_LOG_WITNESS_QUORUM: ${{ steps.pcbex.outputs.approval-log-witness-quorum }}
          APPROVAL_LOG_WITNESS_QUORUM_MET: ${{ steps.pcbex.outputs.approval-log-witness-quorum-met }}
        run: |
          test "$DETERMINISTIC_PIPELINE_REPORT" = "build/action-analysis/deterministic-pipeline-report.json"
          test "$DETERMINISTIC_PIPELINE_EFFECTIVE_PLAN" = "build/deterministic-pipeline/compiled-plan.json"
          test -s "$DETERMINISTIC_PIPELINE_EFFECTIVE_PLAN"
          test -s build/deterministic-pipeline/plan.json
          test "$(jq -r '.schema_version' build/deterministic-pipeline/plan.json)" = "1"
          test "$DETERMINISTIC_PIPELINE_INTENT_BYTES" = "$(wc -c < build/deterministic-pipeline/intent.json | tr -d ' ')"
          test "$DETERMINISTIC_PIPELINE_INTENT_SHA256" = "$(sha256sum build/deterministic-pipeline/intent.json | cut -d' ' -f1)"
          test "$DETERMINISTIC_PIPELINE_PLAN_SOURCE_BYTES" = "$(wc -c < build/deterministic-pipeline/compiled-plan.json | tr -d ' ')"
          test "$DETERMINISTIC_PIPELINE_PLAN_SOURCE_SHA256" = "$(sha256sum build/deterministic-pipeline/compiled-plan.json | cut -d' ' -f1)"
          test -s "$DETERMINISTIC_PIPELINE_REPORT"
          test "$DETERMINISTIC_PIPELINE_SCHEMA_VERSION" = "1"
          test "$DETERMINISTIC_PIPELINE_APPROVED" = "false"
          [[ "$DETERMINISTIC_PIPELINE_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DETERMINISTIC_PIPELINE_RUN_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DETERMINISTIC_PIPELINE_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$DETERMINISTIC_PIPELINE_FAILURE_COUNT" -gt 0
          deterministic_report_bytes="$(wc -c < "$DETERMINISTIC_PIPELINE_REPORT" | tr -d ' ')"
          deterministic_report_sha256="$(sha256sum "$DETERMINISTIC_PIPELINE_REPORT" | cut -d' ' -f1)"
          test "$DETERMINISTIC_PIPELINE_REPORT_BYTES" = "$deterministic_report_bytes"
          test "$DETERMINISTIC_PIPELINE_REPORT_SHA256" = "$deterministic_report_sha256"
          jq -e \
            --arg plan_sha256 "$DETERMINISTIC_PIPELINE_PLAN_SHA256" \
            --arg run_sha256 "$DETERMINISTIC_PIPELINE_RUN_SHA256" \
            --argjson failure_count "$DETERMINISTIC_PIPELINE_FAILURE_COUNT" \
            --argjson schema_version "$DETERMINISTIC_PIPELINE_SCHEMA_VERSION" \
            --argjson approved "$DETERMINISTIC_PIPELINE_APPROVED" \
            'type == "object"
             and .schema_version == $schema_version
             and .approved == $approved
             and .plan_sha256 == $plan_sha256
             and .run_sha256 == $run_sha256
             and (.failures | length) == $failure_count' \
            "$DETERMINISTIC_PIPELINE_REPORT" >/dev/null
          test -s "$ARTIFACT_DIR/pr-comment.md"
          grep -F '# pcbex hardware analysis' "$ARTIFACT_DIR/pr-comment.md"
          grep -F '# pcbex baseline comparison' "$ARTIFACT_DIR/pr-comment.md"
          test "$CANARY_ROLLOUT_AUTHORIZED" = "true"
          test "$(jq -r '.canary_authorized' "$CANARY_ROLLOUT_AUTHORIZATION")" = "true"
          test "$(jq -r '.rollback_policy.automatic_promotion' "$CANARY_ROLLOUT_AUTHORIZATION")" = "false"
          test "$(jq -r '.rollback_policy.automatic_rollback' "$CANARY_ROLLOUT_AUTHORIZATION")" = "true"
          test "$CANARY_MONITORING_PASSED" = "true"
          test "$(jq -r '.promotion_eligible' "$CANARY_MONITORING")" = "true"
          test "$(jq -r '.automatic_promotion' "$CANARY_MONITORING")" = "false"
          test "$(jq -r '.requires_human_decision' "$CANARY_MONITORING")" = "true"
          test "$CANARY_COMPLETION_FINALIZED" = "true"
          test "$CANARY_COMPLETION_DECISION" = "promote"
          test "$(jq -r '.status' "$CANARY_COMPLETION")" = "promotion_authorized"
          test "$(jq -r '.policy.automatic_promotion' "$CANARY_COMPLETION")" = "false"
          test "$POLICY_DEPLOYMENT_STATUS" = "promotion_applied"
          test "$POLICY_DEPLOYMENT_ACTIVE_REVISION" = "2"
          test "$(jq -r '.generation' "$POLICY_DEPLOYMENT")" = "1"
          test "$(jq -r '.automatic_application' "$POLICY_DEPLOYMENT")" = "false"
          test "$(jq -r '.post_deployment_verification_required' "$POLICY_DEPLOYMENT")" = "true"
          test "$(jq -r '.verification_status' "$POLICY_DEPLOYMENT")" = "pending"
          test "$POLICY_DEPLOYMENT_VERIFIED" = "true"
          test "$POLICY_DEPLOYMENT_ROLLBACK_REQUIRED" = "false"
          test "$(jq -r '.status' "$POLICY_DEPLOYMENT_VERIFICATION")" = "verification_passed"
          test "$(jq -r '.coverage_complete' "$POLICY_DEPLOYMENT_VERIFICATION")" = "true"
          test "$(jq -r '.automatic_rollback' "$POLICY_DEPLOYMENT_VERIFICATION")" = "false"
          test "$(jq -r '.requires_dual_control_rollback' "$POLICY_DEPLOYMENT_VERIFICATION")" = "false"
          test "$APPROVAL_LOG_CONSISTENT" = "true"
          test "$(jq -r '.old_tree_size' "$APPROVAL_LOG_CONSISTENCY_VERIFICATION")" = "1"
          test "$(jq -r '.new_tree_size' "$APPROVAL_LOG_CONSISTENCY_VERIFICATION")" = "2"
          test "$APPROVAL_LOG_GOSSIP_VERIFIED" = "true"
          test "$(jq -r '.relationship' "$APPROVAL_LOG_GOSSIP_VERIFICATION")" = "same_tree"
          test "$APPROVAL_LOG_GOSSIP_QUORUM_MET" = "true"
          test "$(jq -r '.registry_bound' "$APPROVAL_LOG_GOSSIP_QUORUM")" = "true"
          test "$(jq -r '.registry_generation' "$APPROVAL_LOG_GOSSIP_QUORUM")" = "5"
          test "$(jq -r '.event_count' "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_AUDIT")" = "5"
          test "$(jq -r '.chain_valid' "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_AUDIT")" = "true"
          test "$(jq -r '.generation' "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_FINAL")" = "5"
          test "$(jq -r '.accepted_generation' "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_CHECKPOINT_TRUST")" = "5"
          test "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_CHECKPOINT_WITNESS_QUORUM_MET" = "true"
          test "$(jq -r '.valid_witnesses' "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_CHECKPOINT_WITNESS_QUORUM")" = "2"
          test -s "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_CHECKPOINT_REMOTE_WITNESSES/witness-0.json"
          test "$(jq -r '.witness_id' "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_CHECKPOINT_REMOTE_WITNESSES/witness-0.json")" = "history-witness-a"
          test -s "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_CHECKPOINT_REMOTE_RECEIPTS/receipt-0.json"
          test "$(jq -r '.verified' "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_CHECKPOINT_REMOTE_RECEIPTS/receipt-0.json")" = "true"
          test "$(jq -r '.witness_key_generation' "$APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_CHECKPOINT_REMOTE_RECEIPTS/receipt-0.json")" = "1"
          test "$(jq -r '.trust_quorum.trust_bound' "$APPROVAL_LOG_GOSSIP_QUORUM")" = "true"
          test "$(jq -r '.trust_quorum.quorum.distinct_organizations' "$APPROVAL_LOG_GOSSIP_QUORUM")" = "2"
          test "$(jq -r '.configuration.dfm_profile.id' "$ARTIFACT_DIR/current/run.json")" = "acme-standard-4layer-v1"
          test "$(jq -r '.dfm_profile_file' "$ARTIFACT_DIR/current/run.json")" = "null"
          test "$(jq -r '.configuration.organization_policy_pack' "$ARTIFACT_DIR/current/run.json")" = "acme-production-v1"
          test "$(jq -r '.policy_pack_file.sha256 | length' "$ARTIFACT_DIR/current/run.json")" = "64"
          test "$VIOLATION_COUNT" = "1"
          test "$REGRESSION" = "false"
          test -s "$MANUFACTURING_FEEDBACK"
          test "$MANUFACTURING_FEEDBACK_PASSED" = "true"
          test "$(jq -r '.declaration.id' "$MANUFACTURING_FEEDBACK")" = "action-smoke-lot"
          test -s "$POLICY_RECOMMENDATION"
          test "$(jq -r '.status' "$POLICY_RECOMMENDATION")" = "proposal_only"
          test "$(jq -r '.requires_human_approval' "$POLICY_RECOMMENDATION")" = "true"
          test "$(jq -r '.may_relax_constraints' "$POLICY_RECOMMENDATION")" = "false"
          test "$(jq -r '.recommendations | length' "$POLICY_RECOMMENDATION")" = "0"
          test -s "$POLICY_ROLLOUT_PROFILE"
          test "$(jq -r '.rules.minimum_clearance_nm' "$POLICY_ROLLOUT_PROFILE")" = "150000"
          test -s "$POLICY_ROLLOUT"
          test "$(jq -r '.status' "$POLICY_ROLLOUT")" = "simulation_only"
          test "$(jq -r '.deployable' "$POLICY_ROLLOUT")" = "false"
          test "$(jq -r '.requires_human_approval' "$POLICY_ROLLOUT")" = "true"
          test "$(jq -r '.projects[0].project_id' "$POLICY_ROLLOUT")" = "action-controller"
          test -s "$SCHEMATIC_DIFF"
          test "$SCHEMATIC_REVIEW_REQUIRED" = "false"
          test "$(jq -r '.changed' "$SCHEMATIC_DIFF")" = "false"
          test -s "$SCHEMATIC_REVIEWER_ROUTING"
          test "$SCHEMATIC_REVIEW_ALL_ROUTED" = "true"
          test "$(jq -r '.route_count' "$SCHEMATIC_REVIEWER_ROUTING")" = "0"
          test -s "$AI_APPROVAL_QUORUM"
          test "$AI_APPROVAL_QUORUM_MET" = "false"
          test "$(jq -r '.routed_quorum.quorum.counts.approvals' "$AI_APPROVAL_QUORUM")" = "1"
          test "$(jq -r '.routed_quorum.quorum.counts.distinct_providers' "$AI_APPROVAL_QUORUM")" = "1"
          test "$(jq -r '.routed_quorum.routed_quorum_met' "$AI_APPROVAL_QUORUM")" = "false"
          test "$(jq -r '.session.session_sha256 | length' "$AI_APPROVAL_QUORUM")" = "64"
          test -s "$HUMAN_ESCALATION"
          test "$HUMAN_ESCALATION_APPROVED" = "true"
          test "$SCHEMATIC_APPROVAL_MET" = "true"
          test "$(jq -r '.approvals' "$HUMAN_ESCALATION")" = "2"
          test -s "$APPROVAL_LOG_VERIFICATION"
          test "$APPROVAL_LOG_VERIFIED" = "true"
          test "$(jq -r '.entry_count' "$APPROVAL_LOG_VERIFICATION")" = "1"
          test -s "$APPROVAL_LOG_ANCHOR_VERIFICATION"
          test "$APPROVAL_LOG_ANCHORED" = "true"
          test "$(jq -r '.tree_size' "$APPROVAL_LOG_ANCHOR_VERIFICATION")" = "2"
          test -s "$REMOTE_WITNESS"
          test -s "$REMOTE_WITNESS_RECEIPT"
          test "$(jq -r '.witness_id' "$REMOTE_WITNESS")" = "action-remote-witness"
          test "$(jq -r '.verified' "$REMOTE_WITNESS_RECEIPT")" = "true"
          test -s "$APPROVAL_LOG_WITNESS_QUORUM"
          test "$APPROVAL_LOG_WITNESS_QUORUM_MET" = "true"
          test "$(jq -r '.valid_witnesses' "$APPROVAL_LOG_WITNESS_QUORUM")" = "3"
          test -z "$COMMENT_URL"
      - name: Stage unprivileged pull-request comment bundle
        if: ${{ github.event_name == 'pull_request' }}
        env:
          ARTIFACT_DIR: ${{ steps.pcbex.outputs.artifact-dir }}
        run: >-
          python3 scripts/stage-pr-comment.py
          --event "$GITHUB_EVENT_PATH"
          --body "$ARTIFACT_DIR/pr-comment.md"
          --output-dir build/pr-comment-publish
          --workflow-name CI
          --workflow-path .github/workflows/ci.yml
          --comment-id action-smoke
      - name: Upload staged pull-request comment
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pcbex-pr-comment-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pr-comment-publish
          if-no-files-found: error
          retention-days: 2
      - name: Prepare signed policy trust fixture
        id: policy-fixture
        run: |
          mkdir -p build/action-policy
          target/release/pcbex policy-keygen \
            --private-key build/action-policy/policy.key \
            --public-key build/action-policy/policy.pub
          target/release/pcbex sign-policy-pack examples/acme-policy-pack.json \
            --private-key build/action-policy/policy.key \
            --signer-id hardware-security \
            --output build/action-policy/policy.signed.json
          target/release/pcbex verify-policy-pack \
            build/action-policy/policy.signed.json \
            --public-key build/action-policy/policy.pub \
            --output build/action-policy/accepted-policy.json \
            --state-output build/action-policy/accepted-state.json
          RUNNER_TRACKING_ID="" nohup setsid python3 scripts/tests/policy_pack_server.py \
            --signed-policy-pack build/action-policy/policy.signed.json \
            --endpoint-output build/action-policy/policy.endpoint \
            --bearer-token action-policy-token \
            > build/action-policy/policy.server.log 2>&1 </dev/null &
          printf '%s\n' "$!" >> build/action-server-pids
          for attempt in {1..50}; do
            [[ -s build/action-policy/policy.endpoint ]] && break
            sleep 0.1
          done
          test -s build/action-policy/policy.endpoint
          printf 'policy-endpoint=%s\n' \
            "$(tr -d '\n' < build/action-policy/policy.endpoint)" \
            >> "$GITHUB_OUTPUT"
      - name: Exercise signed policy rollback protection
        id: signed-pcbex
        uses: ./
        env:
          PCBEX_POLICY_PACK_ALLOW_HTTP_LOOPBACK: "true"
        with:
          board: examples/simple.kicad_pcb
          policy-pack-url: ${{ steps.policy-fixture.outputs.policy-endpoint }}
          policy-public-key: build/action-policy/policy.pub
          policy-trust-state: build/action-policy/accepted-state.json
          policy-pack-bearer-token: action-policy-token
          output-dir: build/signed-action-analysis
          fail-on-violations: "false"
          artifact-name: pcbex-signed-action-smoke
      - name: Verify signed policy trust output
        env:
          TRUST_STATE: ${{ steps.signed-pcbex.outputs.verified-policy-trust-state }}
          FETCHED_SIGNED: ${{ steps.signed-pcbex.outputs.fetched-signed-policy-pack }}
          FETCH_RECEIPT: ${{ steps.signed-pcbex.outputs.policy-pack-fetch-receipt }}
        run: |
          test -s "$TRUST_STATE"
          test "$(jq -r '.accepted_revision' "$TRUST_STATE")" = "1"
          test "$(jq -r '.policy_pack_id' "$TRUST_STATE")" = "acme-production-v1"
          test -s "$FETCHED_SIGNED"
          test -s "$FETCH_RECEIPT"
          test "$(jq -r '.verified' "$FETCH_RECEIPT")" = "true"
          test "$(jq -r '.baseline_revision' "$FETCH_RECEIPT")" = "1"
      - name: Stop fixture servers
        if: always()
        shell: bash
        run: |
          if [[ ! -f build/action-server-pids ]]; then
            exit 0
          fi
          mapfile -t server_pids < build/action-server-pids
          for server_pid in "${server_pids[@]}"; do
            [[ "$server_pid" =~ ^[1-9][0-9]*$ ]] || exit 2
            kill -TERM -- "-$server_pid" 2>/dev/null || true
          done
          for attempt in {1..50}; do
            running=false
            for server_pid in "${server_pids[@]}"; do
              if kill -0 -- "-$server_pid" 2>/dev/null; then
                running=true
              fi
            done
            [[ "$running" = false ]] && break
            sleep 0.1
          done
          for server_pid in "${server_pids[@]}"; do
            kill -KILL -- "-$server_pid" 2>/dev/null || true
          done

  deterministic-pipeline:
    name: Deterministic Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build pcbex
        run: cargo +stable build --package pcbex --release --locked
      - name: Run deterministic pipeline fixture
        id: pipeline
        continue-on-error: true
        run: >-
          python3 scripts/ci_runtime.py exec
          --timeout-seconds 1800
          --max-stdout-bytes 8388608
          --max-stderr-bytes 8388608
          --output-root build/deterministic-pipeline-ci
          -- python3 scripts/deterministic_pipeline_ci.py
          --pcbex target/release/pcbex
          --fixture-dir crates/pcbex-cli/tests/fixtures/deterministic-pipeline-ci
          --output-dir build/deterministic-pipeline-ci
      - name: Replay retained deterministic pipeline reports
        id: replay
        if: ${{ steps.pipeline.outcome == 'success' }}
        continue-on-error: true
        env:
          PYTHONPATH: agent/src
        run: |
          set -euo pipefail
          python3 -m pcbex_agent.cli replay-deterministic-pipeline \
            build/deterministic-pipeline-ci/accepted/plan.json \
            build/deterministic-pipeline-ci/accepted/report.json \
            --pcbex "$(pwd)/target/release/pcbex" \
            --require-approved \
            --timeout-seconds 120 \
            > build/deterministic-pipeline-ci/accepted-replay.json
          python3 -m pcbex_agent.cli replay-deterministic-pipeline \
            build/deterministic-pipeline-ci/rejected/plan.json \
            build/deterministic-pipeline-ci/rejected/report.json \
            --pcbex "$(pwd)/target/release/pcbex" \
            --timeout-seconds 120 \
            > build/deterministic-pipeline-ci/rejected-replay.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("build/deterministic-pipeline-ci")
          summary = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          accepted = json.loads(
              (root / "accepted-replay.json").read_text(encoding="utf-8")
          )
          rejected = json.loads(
              (root / "rejected-replay.json").read_text(encoding="utf-8")
          )
          expected_keys = {
              "schema_version",
              "verification_scope",
              "verified",
              "engine_version",
              "plan",
              "report",
              "inputs",
              "validation",
          }
          expected_validation = {
              "plan_captured_before_replay",
              "inputs_captured_before_replay",
              "fresh_report_reproduced",
              "retained_report_identical",
              "staged_inputs_unchanged",
              "caller_inputs_unchanged",
          }
          for label, result, expected_approved in (
              ("accepted", accepted, True),
              ("rejected", rejected, False),
          ):
              if set(result) != expected_keys:
                  raise SystemExit(f"{label} replay result is not closed")
              if result["verified"] is not True:
                  raise SystemExit(f"{label} replay was not verified")
              if (
                  result["verification_scope"]
                  != "deterministic-pipeline-fresh-replay-v1"
              ):
                  raise SystemExit(f"{label} replay scope changed")
              if (
                  set(result["validation"]) != expected_validation
                  or not all(result["validation"].values())
              ):
                  raise SystemExit(f"{label} replay validation is incomplete")
              if result["report"]["approved"] is not expected_approved:
                  raise SystemExit(f"{label} replay approval decision changed")
              if result["report"]["identical"] is not True:
                  raise SystemExit(f"{label} replay was not byte-identical")
              if (
                  result["report"]["retained"]["sha256"]
                  != summary[label]["report_sha256"]
              ):
                  raise SystemExit(f"{label} retained report identity changed")
          PY
      - name: Scan deterministic pipeline outputs
        id: scan
        if: ${{ always() }}
        run: >-
          python3 scripts/ci_runtime.py scan
          --output-root build/deterministic-pipeline-ci
          --max-entries 64
          --max-depth 8
          --max-file-bytes 16777216
          --max-total-bytes 67108864
      - name: Publish deterministic pipeline summary
        id: summary
        if: ${{ always() && steps.scan.outcome == 'success' }}
        env:
          SUMMARY_JSON: build/deterministic-pipeline-ci/summary.json
        run: |
          set -euo pipefail
          test -f "$SUMMARY_JSON"
          test ! -L "$SUMMARY_JSON"
          jq -e '
            def integer_between($minimum; $maximum):
              if type == "number" then
                . == floor and . >= $minimum and . <= $maximum
              else false end;
            def sha256:
              if type == "string" then test("^[0-9a-f]{64}$") else false end;
            def accepted_case:
              if type != "object" then false else
                (keys | sort) == [
                  "approved", "binding_approved", "failure_count",
                  "intent_source_bytes", "intent_source_sha256",
                  "pipeline_passed", "plan_sha256", "plan_source_bytes",
                  "plan_source_sha256", "report_bytes", "report_sha256",
                  "run_sha256"
                ] and
                .approved == true and
                .binding_approved == true and
                .pipeline_passed == true and
                (.failure_count | integer_between(0; 0)) and
                (.intent_source_bytes | integer_between(1; 4194304)) and
                (.plan_source_bytes | integer_between(1; 4194304)) and
                (.report_bytes | integer_between(1; 134217728)) and
                (.intent_source_sha256 | sha256) and
                (.plan_source_sha256 | sha256) and
                (.plan_sha256 | sha256) and
                (.run_sha256 | sha256) and
                (.report_sha256 | sha256)
              end;
            def rejected_case:
              if type != "object" then false else
                (keys | sort) == [
                  "approved", "binding_approved", "failure_count",
                  "intent_source_bytes", "intent_source_sha256",
                  "pipeline_passed", "plan_sha256", "plan_source_bytes",
                  "plan_source_sha256", "report_bytes", "report_sha256",
                  "required_exit_code", "required_report_bytes",
                  "required_report_sha256", "run_sha256"
                ] and
                .approved == false and
                .binding_approved == true and
                .pipeline_passed == false and
                (.failure_count | integer_between(1; 128)) and
                (.intent_source_bytes | integer_between(1; 4194304)) and
                (.plan_source_bytes | integer_between(1; 4194304)) and
                (.report_bytes | integer_between(1; 134217728)) and
                (.required_exit_code | integer_between(1; 255)) and
                (.required_report_bytes | integer_between(1; 134217728)) and
                (.intent_source_sha256 | sha256) and
                (.plan_source_sha256 | sha256) and
                (.plan_sha256 | sha256) and
                (.run_sha256 | sha256) and
                (.report_sha256 | sha256) and
                (.required_report_sha256 | sha256) and
                .report_bytes == .required_report_bytes and
                .report_sha256 == .required_report_sha256
              end;
            if type != "object" then false else
              (keys | sort) == ["accepted", "rejected", "schema_version"] and
              (.schema_version | integer_between(1; 1)) and
              (.accepted | accepted_case) and
              (.rejected | rejected_case)
            end
          ' "$SUMMARY_JSON" >/dev/null
          {
            printf '## Deterministic pipeline\n\n'
            jq -r '
              "- Accepted: `\(.accepted.approved)` (failures: `\(.accepted.failure_count)`, report bytes: `\(.accepted.report_bytes)`, report SHA-256: `\(.accepted.report_sha256)`)",
              "- Semantic rejection: `\(.rejected.approved)` (failures: `\(.rejected.failure_count)`, report bytes: `\(.rejected.report_bytes)`, report SHA-256: `\(.rejected.report_sha256)`)"
            ' "$SUMMARY_JSON"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload deterministic pipeline evidence
        id: upload
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deterministic-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/deterministic-pipeline-ci
          if-no-files-found: error
          retention-days: 7
      - name: Enforce deterministic pipeline job
        if: ${{ always() }}
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          test "$PIPELINE_OUTCOME" = success
          test "$REPLAY_OUTCOME" = success
          test "$SCAN_OUTCOME" = success
          test "$SUMMARY_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Compile routing benchmarks
        run: cargo bench -p pcbex-core --bench routing --no-run --locked
      - name: Enforce deterministic routing performance budgets
        run: cargo test -p pcbex-core --test performance_budget --locked -- --nocapture
      - name: Run practical routing regression corpus
        run: scripts/regression-corpus.sh target/release/pcbex build/regression-corpus
      - name: Verify completion audit is current
        run: python3 scripts/update-completion-audit.py --check
      - name: Test release audit
        run: python3 -m unittest discover -s scripts/tests -v

  python:
    name: Python
    needs: [python-boundaries, rust-windows-boundaries]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require cross-platform boundary checks
        env:
          BOUNDARY_RESULT: ${{ needs.python-boundaries.result }}
          WINDOWS_RUST_RESULT: ${{ needs.rust-windows-boundaries.result }}
        run: >-
          test "$BOUNDARY_RESULT" = success
          && test "$WINDOWS_RUST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Run agent tests
        env:
          PYTHONPATH: agent/src
        run: python -m unittest discover -s agent/tests -v

  python-boundaries:
    name: Python boundaries (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    # Windows release builds can exceed 50 minutes before the boundary suite starts.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - runner: macos-latest
            pcbex: target/release/pcbex
          - runner: windows-latest
            pcbex: target/release/pcbex.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Build pcbex release binary
        run: cargo +stable build --package pcbex --release --locked
      - name: Run cross-platform deterministic board producer regressions
        run: |
          cargo +stable test --package pcbex --test capabilities --release --locked board_producer
          cargo +stable test --package pcbex --test circuit_kicad_board_writer --release --locked
      - name: Run cross-platform v1.465 exact final-CPL boundaries
        run: cargo +stable test --package pcbex --test final_cpl --release --locked
      - name: Run cross-platform v1.464 procurement-intent boundaries
        env:
          PCBEX_TEST_BINARY: ${{ matrix.pcbex }}
          PYTHONPATH: agent/src
        run: >-
          python -m unittest discover -s agent/tests
          -p test_procurement_intent_v1464.py -v
      - name: Run cross-platform v1.467 assembly-evidence boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_assembly_evidence_v1467
          agent.tests.test_assembly_evidence_cli_v1467 -v
      - name: Run cross-platform v1.468 supplier-offer coverage boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_supplier_offer_v1468
          agent.tests.test_supplier_offer_cli_v1468 -v
      - name: Run cross-platform v1.469 supplier-offer acquisition boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_supplier_offer_acquisition_v1469
          agent.tests.test_supplier_offer_acquisition_cli_v1469 -v
      - name: Run cross-platform v1.470 assembly/supplier-offer boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_assembly_supplier_offer_evidence_v1470
          agent.tests.test_assembly_supplier_offer_evidence_cli_v1470 -v
      - name: Run cross-platform v1.471 procurement-authorization boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_procurement_release_authorization_v1471
          agent.tests.test_procurement_release_authorization_cli_v1471 -v
      - name: Run cross-platform v1.472 procurement-reservation boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_procurement_authorization_reservation_v1472
          agent.tests.test_procurement_authorization_reservation_cli_v1472 -v
      - name: Run cross-platform v1.472 local-ledger helper boundaries
        run: >-
          cargo +stable test --package pcbex
          --test procurement_authorization_reservation --release --locked
      - name: Run cross-platform v1.473 multi-unit KiCad boundaries
        run: >-
          cargo +stable test --package pcbex
          --test circuit_spec_v3 --release --locked
      - name: Run cross-platform v1.474 routing-convergence boundaries
        run: >-
          cargo +stable test --package pcbex
          --test routing_convergence --release --locked
      - name: Run cross-platform v1.475 fresh routing-convergence verification boundaries
        run: >-
          cargo +stable test --package pcbex
          --test routing_convergence_verification --release --locked
      - name: Run cross-platform v1.476 routing-manufacturing handoff boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_routing_manufacturing_handoff_v1476 -v
      - name: Run cross-platform v1.477 routing-DRC-manufacturing handoff boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_routing_drc_manufacturing_handoff_v1477 -v
      - name: Run cross-platform v1.478 routing-DRC fabrication-release boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_routing_drc_fabrication_release_v1478 -v
      - name: Run cross-platform v1.479 executable-pinned fabrication-release boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_executable_pinned_fabrication_release_v1479 -v
      - name: Run cross-platform v1.480 signed factory-receipt boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_signed_factory_receipt_release_v1480 -v
      - name: Run cross-platform v1.480 factory-receipt cryptographic boundaries
        # Windows reuses the already-linked bin test harness in the dedicated
        # Rust boundary job, keeping this 45-minute matrix below its ceiling.
        if: ${{ runner.os != 'Windows' }}
        run: >-
          cargo +stable test --package pcbex --bin pcbex --release --locked
          factory_receipt_attestation
      - name: Run cross-platform v1.481 signed-release reservation boundaries
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest
          agent.tests.test_signed_factory_receipt_release_reservation_v1481 -v
      - name: Run cross-platform v1.481 local-ledger helper boundaries
        run: >-
          cargo +stable test --package pcbex
          --test signed_factory_receipt_release_reservation --release --locked
      - name: Run cross-platform v1.482 durable factory-release submission boundaries
        run: >-
          cargo +stable test --package pcbex
          --test signed_factory_receipt_release_submission --release --locked
      - name: Run cross-platform v1.483 authenticated factory-response boundaries
        run: >-
          cargo +stable test --package pcbex
          --test factory_release_adapter_response_authentication --release --locked
      - name: Run cross-platform v1.484 monotonic factory-state boundaries
        # Windows reuses the already-linked bin test harness in the dedicated
        # Rust boundary job, keeping this 45-minute matrix below its ceiling.
        if: ${{ runner.os != 'Windows' }}
        run: >-
          cargo +stable test --package pcbex --bin pcbex --release --locked
          factory_release_adapter_monotonic_state
      - name: Run cross-platform v1.485-v1.524 factory-state transparency boundaries
        if: ${{ runner.os != 'Windows' }}
        run: >-
          cargo +stable test --package pcbex --bin pcbex --release --locked
          factory_release_state_transparency
      - name: Run cross-platform v1.492 observer-rotation ledger boundaries
        if: ${{ runner.os != 'Windows' }}
        run: >-
          cargo +stable test --package pcbex
          --test factory_release_external_gossip_observer_rotation --release --locked
      - name: Run cross-platform v1.493-v1.524 organization-registry ledger boundaries
        if: ${{ runner.os != 'Windows' }}
        run: >-
          cargo +stable test --package pcbex
          --test factory_release_external_gossip_organization_registry --release --locked
      - name: Configure Windows GNU firmware toolchain
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $toolchain = 'C:\mingw64\bin'
          foreach ($tool in @('gcc.exe', 'g++.exe')) {
            $candidate = Join-Path $toolchain $tool
            if (-not (Test-Path -LiteralPath $candidate -PathType Leaf)) {
              throw "required Windows firmware compiler is missing: $candidate"
            }
          }
          $toolchain | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run cross-platform v1.466 fresh firmware build boundaries
        run: cargo +stable test --package pcbex --test firmware_build --release --locked
      - name: Build real deterministic pipeline replay fixtures
        run: >-
          python scripts/deterministic_pipeline_ci.py
          --pcbex ${{ matrix.pcbex }}
          --fixture-dir crates/pcbex-cli/tests/fixtures/deterministic-pipeline-ci
          --output-dir build/deterministic-pipeline-portability
          --timeout-seconds 120
      - name: Diagnose Windows firmware fixture failure
        if: ${{ failure() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $firmware = 'build/deterministic-pipeline-portability/accepted/firmware'
          $manifest = Join-Path $firmware 'manifest.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            Write-Host 'firmware manifest was not retained'
            exit 0
          }
          Get-Content -LiteralPath $manifest -Raw
          $env:PATH = "C:\mingw64\bin;$env:PATH"
          Push-Location $firmware
          try {
            & gcc -std=c11 -Wall -Wextra -Werror -pedantic -I . firmware.c firmware_smoke_test.c -o pcbex-diagnostic-c.exe
            Write-Host "diagnostic C compile exit: $LASTEXITCODE"
            if (Test-Path -LiteralPath 'pcbex-diagnostic-c.exe' -PathType Leaf) {
              & .\pcbex-diagnostic-c.exe
              Write-Host "diagnostic C smoke exit: $LASTEXITCODE"
            }
            & g++ -std=c++17 -Wall -Wextra -Werror -pedantic -I . firmware.cpp firmware_cpp_smoke_test.cpp -o pcbex-diagnostic-cpp.exe
            Write-Host "diagnostic C++ compile exit: $LASTEXITCODE"
            if (Test-Path -LiteralPath 'pcbex-diagnostic-cpp.exe' -PathType Leaf) {
              & .\pcbex-diagnostic-cpp.exe
              Write-Host "diagnostic C++ smoke exit: $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }
          exit 0
      - name: Replay accepted pipeline with the real release binary
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m pcbex_agent.cli replay-deterministic-pipeline
          build/deterministic-pipeline-portability/accepted/plan.json
          build/deterministic-pipeline-portability/accepted/report.json
          --pcbex ${{ matrix.pcbex }}
          --require-approved
          --timeout-seconds 120
      - name: Replay rejected pipeline with the real release binary
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m pcbex_agent.cli replay-deterministic-pipeline
          build/deterministic-pipeline-portability/rejected/plan.json
          build/deterministic-pipeline-portability/rejected/report.json
          --pcbex ${{ matrix.pcbex }}
          --timeout-seconds 120
      - name: Run cross-platform boundary tests
        env:
          PYTHONPATH: agent/src
        run: >-
          python -m unittest -v
          agent.tests.test_bounded_io
          agent.tests.test_bounded_process
          agent.tests.test_agent_boundaries
          agent.tests.test_provider_boundaries
          agent.tests.test_repair_loop_boundaries
          agent.tests.test_circuit_handoff_bundle_v1449
          agent.tests.test_circuit_handoff_bundle_v1450
          agent.tests.test_circuit_handoff_bundle_v1451
          agent.tests.test_circuit_handoff_bundle_v1452
          agent.tests.test_circuit_handoff_bundle_v1453
          agent.tests.test_circuit_handoff_bundle_v1454
          agent.tests.test_manufacturing_replay_v1455
          agent.tests.test_deterministic_pipeline_replay_v1456
          agent.tests.test_circuit_handoff_bundle_v1457
          agent.tests.test_circuit_handoff_bundle_v1458
          scripts.tests.test_ci_runtime

  rust-windows-boundaries:
    name: Rust Windows boundaries
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Run Windows Rust process regressions
        run: cargo +stable test --package pcbex --bin pcbex --release --locked windows_
      - name: Run Windows factory-receipt cryptographic boundaries
        run: >-
          cargo +stable test --package pcbex --bin pcbex --release --locked
          factory_receipt_attestation
      - name: Run Windows monotonic factory-state boundaries
        run: >-
          cargo +stable test --package pcbex --bin pcbex --release --locked
          factory_release_adapter_monotonic_state
      - name: Run Windows v1.485-v1.524 factory-state transparency boundaries
        run: >-
          cargo +stable test --package pcbex --bin pcbex --release --locked
          factory_release_state_transparency
