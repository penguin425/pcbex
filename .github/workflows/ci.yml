name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware-ci-action:
    name: Hardware CI action
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare manufacturing feedback fixture
        run: |
          mkdir -p build/action-feedback
          board_sha256="$(sha256sum examples/simple.kicad_pcb | cut -d' ' -f1)"
          jq -n \
            --arg board_sha256 "$board_sha256" \
            '{
              schema_version: 1,
              id: "action-smoke-lot",
              manufacturer: {
                id: "example-fab",
                process: "CI fixture"
              },
              received_on: "2026-07-29",
              board_sha256: $board_sha256,
              disposition: "accepted",
              findings: [{
                id: "inspection-record",
                category: "other",
                severity: "info",
                message: "Inspection record is attached.",
                evidence: ["inspection.txt"]
              }]
            }' > build/action-feedback/declaration.json
          printf '%s\n' 'inspection passed' > build/action-feedback/inspection.txt
      - name: Prepare AI approval quorum fixture
        id: approval-fixture
        run: |
          cargo build --package pcbex --release --locked
          mkdir -p build/action-quorum
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/reviewer-a.key \
            --public-key build/action-quorum/reviewer-a.pub
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/reviewer-b.key \
            --public-key build/action-quorum/reviewer-b.pub
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/engineer-a.key \
            --public-key build/action-quorum/engineer-a.pub
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/engineer-b.key \
            --public-key build/action-quorum/engineer-b.pub
          target/release/pcbex electrical-policy \
            --output build/action-quorum/electrical-policy.json
          jq \
            --slurpfile electrical build/action-quorum/electrical-policy.json \
            --arg key_a "$(tr -d '\n' < build/action-quorum/reviewer-a.pub)" \
            --arg key_b "$(tr -d '\n' < build/action-quorum/reviewer-b.pub)" \
            --arg human_key_a "$(tr -d '\n' < build/action-quorum/engineer-a.pub)" \
            --arg human_key_b "$(tr -d '\n' < build/action-quorum/engineer-b.pub)" \
            '
              .electrical_policy = $electrical[0]
              | .require_simulation_evidence = false
              | .ai_requirements = [{
                  id: "power",
                  text: "Power input treatment is intentional"
                }]
              | .trusted_approval_keys = [
                  {signer_id: "reviewer-a", public_key: $key_a},
                  {signer_id: "reviewer-b", public_key: $key_b}
                ]
              | .trusted_human_escalation_keys = [
                  {signer_id: "engineer-a", public_key: $human_key_a},
                  {signer_id: "engineer-b", public_key: $human_key_b}
                ]
            ' examples/acme-policy-pack.json > build/action-quorum/policy-pack.json
          target/release/pcbex policy-keygen \
            --private-key build/action-quorum/policy-signing.key \
            --public-key build/action-quorum/policy-signing.pub
          target/release/pcbex sign-policy-pack \
            build/action-quorum/policy-pack.json \
            --private-key build/action-quorum/policy-signing.key \
            --signer-id policy-authority \
            --output build/action-quorum/signed-policy-pack.json
          target/release/pcbex verify-policy-pack \
            build/action-quorum/signed-policy-pack.json \
            --public-key build/action-quorum/policy-signing.pub \
            --state-output build/action-quorum/policy-trust-state.json \
            --output build/action-quorum/verified-policy-pack.json
          mkdir -p build/action-rollout
          board_sha256="$(sha256sum examples/simple.kicad_pcb | cut -d' ' -f1)"
          for lot in a b; do
            target/release/pcbex analyze-kicad examples/simple.kicad_pcb \
              --policy-pack build/action-quorum/policy-pack.json \
              --output-dir "build/action-rollout/analysis-$lot"
            printf '%s\n' 'clearance_mm,0.10' \
              > "build/action-rollout/inspection-$lot.csv"
            jq -n \
              --arg id "rollout-lot-$lot" \
              --arg board_sha256 "$board_sha256" \
              '{
                schema_version: 1,
                id: $id,
                manufacturer: {
                  id: "example-fab",
                  process: "CI rollout fixture",
                  lot: $id
                },
                received_on: "2026-07-29",
                board_sha256: $board_sha256,
                disposition: "accepted_with_notes",
                findings: [{
                  id: ("clearance-" + $id),
                  category: "clearance",
                  severity: "warning",
                  message: "Recurring process target exceeds the current policy.",
                  measurement: {
                    name: "minimum clearance",
                    value: 0.10,
                    unit: "mm",
                    minimum: 0.15
                  },
                  evidence: [("inspection-" + ($id | sub("rollout-lot-"; "")) + ".csv")]
                }]
              }' > "build/action-rollout/declaration-$lot.json"
            target/release/pcbex record-manufacturing-feedback \
              "build/action-rollout/declaration-$lot.json" \
              --analysis-dir "build/action-rollout/analysis-$lot" \
              --board examples/simple.kicad_pcb \
              --artifact "build/action-rollout/inspection-$lot.csv" \
              --output "build/action-rollout/feedback-$lot.json"
          done
          target/release/pcbex recommend-policy \
            build/action-quorum/policy-pack.json \
            --feedback build/action-rollout/feedback-a.json \
            --feedback build/action-rollout/feedback-b.json \
            --analysis-manifest build/action-rollout/analysis-a/run.json \
            --analysis-manifest build/action-rollout/analysis-b/run.json \
            --generated-on 2026-07-29 \
            --output build/action-rollout/recommendation.json
          target/release/pcbex policy-rollout-profile \
            build/action-quorum/policy-pack.json \
            build/action-rollout/recommendation.json \
            --generated-on 2026-07-29 \
            --output build/action-rollout/profile.json
          jq --slurpfile profile build/action-rollout/profile.json \
            '.revision = 2 | .dfm_profile = $profile[0]' \
            build/action-quorum/policy-pack.json \
            > build/action-rollout/candidate-policy-pack.json
          target/release/pcbex sign-policy-pack \
            build/action-rollout/candidate-policy-pack.json \
            --private-key build/action-quorum/policy-signing.key \
            --signer-id policy-authority \
            --output build/action-rollout/candidate-policy-pack.signed.json
          target/release/pcbex verify-policy-pack \
            build/action-rollout/candidate-policy-pack.signed.json \
            --public-key build/action-quorum/policy-signing.pub \
            --baseline-state build/action-quorum/policy-trust-state.json \
            --state-output build/action-rollout/candidate-policy-trust-state.json \
            --output build/action-rollout/candidate-policy-pack.verified.json
          target/release/pcbex analyze-kicad examples/simple.kicad_pcb \
            --fab-profile build/action-rollout/profile.json \
            --output-dir build/action-rollout/candidate
          target/release/pcbex analyze-kicad examples/simple.kicad_pcb \
            --policy-pack build/action-rollout/candidate-policy-pack.verified.json \
            --output-dir build/action-rollout/deployed
          target/release/pcbex simulate-policy-rollout \
            build/action-quorum/policy-pack.json \
            build/action-rollout/recommendation.json \
            --project-id action-controller \
            --board examples/simple.kicad_pcb \
            --baseline-analysis build/action-rollout/analysis-a \
            --candidate-analysis build/action-rollout/candidate \
            --generated-on 2026-07-29 \
            --output build/action-rollout/rollout.json
          for engineer in a b; do
            target/release/pcbex sign-rollout-approval \
              build/action-rollout/rollout.json \
              --canary-project action-controller \
              --valid-from-unix 1 \
              --expires-at-unix 604801 \
              --private-key "build/action-quorum/engineer-$engineer.key" \
              --signer-id "engineer-$engineer" \
              --decision approve \
              --reason "CI dual-control canary authorization" \
              --ticket PCBEX-CI-ROLL-1 \
              --output "build/action-rollout/approval-$engineer.json"
          done
          target/release/pcbex verify-rollout-approvals \
            build/action-rollout/rollout.json \
            --policy-pack build/action-quorum/policy-pack.json \
            --approval build/action-rollout/approval-a.json \
            --approval build/action-rollout/approval-b.json \
            --evaluated-at-unix 2 \
            --output build/action-rollout/authorization.json \
            --require-authorized
          target/release/pcbex record-canary-monitoring \
            build/action-rollout/rollout.json \
            build/action-rollout/authorization.json \
            --project-id action-controller \
            --board examples/simple.kicad_pcb \
            --baseline-analysis build/action-rollout/analysis-a \
            --observed-analysis build/action-rollout/candidate \
            --observed-at-unix 3 \
            --output build/action-rollout/monitoring.json \
            --require-passed
          for engineer in a b; do
            target/release/pcbex sign-canary-completion \
              build/action-rollout/rollout.json \
              build/action-rollout/monitoring.json \
              build/action-rollout/authorization.json \
              --decision promote \
              --decided-at-unix 4 \
              --private-key "build/action-quorum/engineer-$engineer.key" \
              --signer-id "engineer-$engineer" \
              --reason "CI bound canary monitoring passed" \
              --ticket PCBEX-CI-ROLL-2 \
              --output "build/action-rollout/completion-$engineer.json"
          done
          target/release/pcbex check-schematic \
            crates/pcbex-cli/tests/fixtures/approved-mcu.kicad_sch \
            --policy-pack build/action-quorum/policy-pack.json \
            --output build/action-quorum/electrical-review.json \
            --require-approved
          target/release/pcbex prepare-ai-review \
            crates/pcbex-cli/tests/fixtures/approved-mcu.kicad_sch \
            --electrical-review build/action-quorum/electrical-review.json \
            --policy-pack build/action-quorum/policy-pack.json \
            --output build/action-quorum/request.json \
            --session-output build/action-quorum/session.json
          request_sha256="$(jq -r '.request_sha256' build/action-quorum/request.json)"
          for reviewer in a b; do
            jq -n \
              --arg request_sha256 "$request_sha256" \
              --arg provider "provider-$reviewer" \
              --arg model "model-$reviewer" \
              --arg decision "$([[ "$reviewer" == "b" ]] && printf needs_human || printf approve)" \
              '{
                schema_version: 1,
                request_sha256: $request_sha256,
                model: {provider: $provider, model: $model, version: "1"},
                decision: $decision,
                summary: (if $decision == "approve"
                  then "Bound deterministic evidence supports approval."
                  else "Independent engineering judgment is required."
                end),
                requirements: [{
                  id: "power",
                  status: "pass",
                  rationale: "The deterministic electrical review is approved.",
                  evidence_refs: ["electrical-review"]
                }],
                risks: []
              }' > "build/action-quorum/response-$reviewer.json"
            target/release/pcbex sign-ai-review \
              build/action-quorum/request.json \
              "build/action-quorum/response-$reviewer.json" \
              --private-key "build/action-quorum/reviewer-$reviewer.key" \
              --signer-id "reviewer-$reviewer" \
              --session build/action-quorum/session.json \
              --output "build/action-quorum/approval-$reviewer.json"
          done
          target/release/pcbex verify-ai-quorum \
            build/action-quorum/request.json \
            --approval build/action-quorum/approval-a.json \
            --approval build/action-quorum/approval-b.json \
            --response build/action-quorum/response-a.json \
            --response build/action-quorum/response-b.json \
            --policy-pack build/action-quorum/policy-pack.json \
            --baseline-schematic crates/pcbex-cli/tests/fixtures/approved-mcu.kicad_sch \
            --current-schematic crates/pcbex-cli/tests/fixtures/approved-mcu.kicad_sch \
            --reviewer-routing-policy examples/reviewer-routing-policy.json \
            --session build/action-quorum/session.json \
            --output build/action-quorum/retained-quorum.json
          for engineer in a b; do
            target/release/pcbex sign-human-escalation \
              build/action-quorum/request.json \
              --session build/action-quorum/session.json \
              --ai-quorum build/action-quorum/retained-quorum.json \
              --private-key "build/action-quorum/engineer-$engineer.key" \
              --signer-id "engineer-$engineer" \
              --decision approve \
              --reason "Independent engineering review passed." \
              --ticket HW-42 \
              --output "build/action-quorum/human-$engineer.json"
          done
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/transparency.key \
            --public-key build/action-quorum/transparency.pub
          target/release/pcbex init-approval-log \
            --log-id action-approval-log \
            --output build/action-quorum/approval-log.empty.json
          target/release/pcbex append-approval-log \
            build/action-quorum/approval-log.empty.json \
            --artifact build/action-quorum/retained-quorum.json \
            --kind ai-quorum-report \
            --recorded-at-unix 1 \
            --output build/action-quorum/approval-log.json
          target/release/pcbex sign-approval-log \
            build/action-quorum/approval-log.json \
            --private-key build/action-quorum/transparency.key \
            --signer-id action-security-log \
            --output build/action-quorum/approval-log.checkpoint.json
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/public-log.key \
            --public-key build/action-quorum/public-log.pub
          target/release/pcbex create-approval-log-anchor \
            build/action-quorum/approval-log.checkpoint.json \
            --log-checkpoint build/action-quorum/approval-log.checkpoint.json \
            --leaf-index 0 \
            --log-id action-public-log \
            --private-key build/action-quorum/public-log.key \
            --observed-at-unix 2 \
            --output build/action-quorum/approval-log.previous-anchor.json
          target/release/pcbex create-approval-log-anchor \
            build/action-quorum/approval-log.checkpoint.json \
            --log-checkpoint build/action-quorum/approval-log.checkpoint.json \
            --log-checkpoint build/action-quorum/approval-log.checkpoint.json \
            --leaf-index 1 \
            --log-id action-public-log \
            --private-key build/action-quorum/public-log.key \
            --observed-at-unix 3 \
            --output build/action-quorum/approval-log.anchor.json
          target/release/pcbex create-approval-log-consistency \
            --old-anchor build/action-quorum/approval-log.previous-anchor.json \
            --new-anchor build/action-quorum/approval-log.anchor.json \
            --log-checkpoint build/action-quorum/approval-log.checkpoint.json \
            --log-checkpoint build/action-quorum/approval-log.checkpoint.json \
            --output build/action-quorum/approval-log.consistency.json
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/gossip-observer.key \
            --public-key build/action-quorum/gossip-observer.pub
          target/release/pcbex sign-approval-log-gossip-receipt \
            --anchor build/action-quorum/approval-log.anchor.json \
            --log-public-key build/action-quorum/public-log.pub \
            --observer-id action-gossip-observer \
            --observer-private-key build/action-quorum/gossip-observer.key \
            --received-at-unix 4 \
            --expires-at-unix 100 \
            --output build/action-quorum/approval-log.gossip.json
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/gossip-observer-b.key \
            --public-key build/action-quorum/gossip-observer-b.pub
          target/release/pcbex sign-approval-log-gossip-receipt \
            --anchor build/action-quorum/approval-log.anchor.json \
            --log-public-key build/action-quorum/public-log.pub \
            --observer-id action-gossip-observer-b \
            --observer-private-key build/action-quorum/gossip-observer-b.key \
            --received-at-unix 5 \
            --expires-at-unix 100 \
            --output build/action-quorum/approval-log.gossip-b.json
          jq -n \
            --slurpfile receipt build/action-quorum/approval-log.gossip.json \
            '{schema_version: 1, receipt: $receipt[0], consistency_proof: null}' \
            > build/action-quorum/approval-log.gossip-observation-a.json
          jq -n \
            --slurpfile receipt build/action-quorum/approval-log.gossip-b.json \
            '{schema_version: 1, receipt: $receipt[0], consistency_proof: null}' \
            > build/action-quorum/approval-log.gossip-observation-b.json
          target/release/pcbex init-approval-log-gossip-observer-trust \
            --organization-id independent-lab \
            --observer-id action-gossip-observer \
            --public-key build/action-quorum/gossip-observer.pub \
            --output build/action-quorum/gossip-observer.trust.json
          target/release/pcbex init-approval-log-gossip-observer-trust \
            --organization-id security-partner \
            --observer-id action-gossip-observer-b \
            --public-key build/action-quorum/gossip-observer-b.pub \
            --output build/action-quorum/gossip-observer-b.trust.json
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/gossip-registry.key \
            --public-key build/action-quorum/gossip-registry.pub
          target/release/pcbex init-approval-log-gossip-organization-registry \
            --registry-id action-approvals \
            --authority-public-key build/action-quorum/gossip-registry.pub \
            --output build/action-quorum/gossip-registry.initial.json
          registry_reason_a="$(printf '11%.0s' {1..32})"
          target/release/pcbex sign-approval-log-gossip-organization-registry-transition \
            build/action-quorum/gossip-registry.initial.json \
            --authority-private-key build/action-quorum/gossip-registry.key \
            --action admit-observer \
            --organization-id independent-lab \
            --observer-trust-state build/action-quorum/gossip-observer.trust.json \
            --reason-sha256 "$registry_reason_a" \
            --effective-at-unix 6 \
            --output build/action-quorum/gossip-registry.admit-a.json
          target/release/pcbex apply-approval-log-gossip-organization-registry-transition \
            build/action-quorum/gossip-registry.initial.json \
            build/action-quorum/gossip-registry.admit-a.json \
            --output build/action-quorum/gossip-registry.a.json
          registry_reason_b="$(printf '22%.0s' {1..32})"
          target/release/pcbex sign-approval-log-gossip-organization-registry-transition \
            build/action-quorum/gossip-registry.a.json \
            --authority-private-key build/action-quorum/gossip-registry.key \
            --action admit-observer \
            --organization-id security-partner \
            --observer-trust-state build/action-quorum/gossip-observer-b.trust.json \
            --reason-sha256 "$registry_reason_b" \
            --effective-at-unix 7 \
            --output build/action-quorum/gossip-registry.admit-b.json
          target/release/pcbex apply-approval-log-gossip-organization-registry-transition \
            build/action-quorum/gossip-registry.a.json \
            build/action-quorum/gossip-registry.admit-b.json \
            --output build/action-quorum/gossip-registry.json
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/gossip-registry.next.key \
            --public-key build/action-quorum/gossip-registry.next.pub
          target/release/pcbex sign-approval-log-gossip-organization-registry-authority-key-rotation \
            build/action-quorum/gossip-registry.json \
            --old-private-key build/action-quorum/gossip-registry.key \
            --new-private-key build/action-quorum/gossip-registry.next.key \
            --rotated-at-unix 8 \
            --output build/action-quorum/gossip-registry.rotation.json
          target/release/pcbex apply-approval-log-gossip-organization-registry-authority-key-rotation \
            build/action-quorum/gossip-registry.json \
            build/action-quorum/gossip-registry.rotation.json \
            --output build/action-quorum/gossip-registry.rotated.json \
            --public-key-output build/action-quorum/gossip-registry.rotated.pub
          for reviewer in a b c; do
            target/release/pcbex approval-keygen \
              --private-key "build/action-quorum/gossip-governance-$reviewer.key" \
              --public-key "build/action-quorum/gossip-governance-$reviewer.pub"
          done
          target/release/pcbex sign-approval-log-gossip-organization-registry-governance \
            build/action-quorum/gossip-registry.rotated.json \
            --registry-authority-private-key build/action-quorum/gossip-registry.next.key \
            --minimum-approvals 2 \
            --authority-id reviewer-a \
            --authority-public-key build/action-quorum/gossip-governance-a.pub \
            --authority-id reviewer-b \
            --authority-public-key build/action-quorum/gossip-governance-b.pub \
            --issued-at-unix 9 \
            --output build/action-quorum/gossip-registry.governance.json
          target/release/pcbex init-approval-log-gossip-observer-trust \
            --organization-id independent-lab \
            --observer-id audit-observer \
            --public-key build/action-quorum/gossip-observer.pub \
            --output build/action-quorum/gossip-audit-observer.trust.json
          governance_reason="$(printf '33%.0s' {1..32})"
          target/release/pcbex sign-approval-log-gossip-organization-registry-threshold-transition \
            build/action-quorum/gossip-registry.rotated.json \
            build/action-quorum/gossip-registry.governance.json \
            --authority-id reviewer-a \
            --authority-private-key build/action-quorum/gossip-governance-a.key \
            --authority-id reviewer-b \
            --authority-private-key build/action-quorum/gossip-governance-b.key \
            --action admit-observer \
            --organization-id independent-lab \
            --observer-trust-state build/action-quorum/gossip-audit-observer.trust.json \
            --reason-sha256 "$governance_reason" \
            --effective-at-unix 10 \
            --output build/action-quorum/gossip-registry.threshold-transition.json
          target/release/pcbex apply-approval-log-gossip-organization-registry-threshold-transition \
            build/action-quorum/gossip-registry.rotated.json \
            build/action-quorum/gossip-registry.governance.json \
            build/action-quorum/gossip-registry.threshold-transition.json \
            --output build/action-quorum/gossip-registry.governed.json
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/gossip-registry.successor.key \
            --public-key build/action-quorum/gossip-registry.successor.pub
          target/release/pcbex sign-approval-log-gossip-organization-registry-successor-governance \
            build/action-quorum/gossip-registry.governed.json \
            --successor-registry-authority-private-key build/action-quorum/gossip-registry.successor.key \
            --minimum-approvals 2 \
            --authority-id reviewer-b \
            --authority-public-key build/action-quorum/gossip-governance-b.pub \
            --authority-id reviewer-c \
            --authority-public-key build/action-quorum/gossip-governance-c.pub \
            --issued-at-unix 11 \
            --output build/action-quorum/gossip-registry.governance.next.json
          target/release/pcbex sign-approval-log-gossip-organization-registry-governed-authority-key-rotation \
            build/action-quorum/gossip-registry.governed.json \
            build/action-quorum/gossip-registry.governance.json \
            build/action-quorum/gossip-registry.governance.next.json \
            --old-authority-id reviewer-a \
            --old-authority-private-key build/action-quorum/gossip-governance-a.key \
            --old-authority-id reviewer-b \
            --old-authority-private-key build/action-quorum/gossip-governance-b.key \
            --new-authority-id reviewer-b \
            --new-authority-private-key build/action-quorum/gossip-governance-b.key \
            --new-authority-id reviewer-c \
            --new-authority-private-key build/action-quorum/gossip-governance-c.key \
            --rotated-at-unix 12 \
            --output build/action-quorum/gossip-registry.governed-authority.rotation.json
          jq -n \
            --slurpfile initial build/action-quorum/gossip-registry.initial.json \
            --slurpfile admission_a build/action-quorum/gossip-registry.admit-a.json \
            --slurpfile admission_b build/action-quorum/gossip-registry.admit-b.json \
            --slurpfile root_rotation build/action-quorum/gossip-registry.rotation.json \
            --slurpfile governance build/action-quorum/gossip-registry.governance.json \
            --slurpfile threshold build/action-quorum/gossip-registry.threshold-transition.json \
            --slurpfile successor_governance build/action-quorum/gossip-registry.governance.next.json \
            --slurpfile governed_root build/action-quorum/gossip-registry.governed-authority.rotation.json \
            '{
              schema_version: 1,
              initial_registry: $initial[0],
              events: [
                {kind: "root_transition", transition: $admission_a[0]},
                {kind: "root_transition", transition: $admission_b[0]},
                {kind: "root_authority_key_rotation", rotation: $root_rotation[0]},
                {
                  kind: "threshold_transition",
                  governance: $governance[0],
                  transition: $threshold[0]
                },
                {
                  kind: "governed_authority_key_rotation",
                  old_governance: $governance[0],
                  new_governance: $successor_governance[0],
                  rotation: $governed_root[0]
                }
              ]
            }' > build/action-quorum/gossip-registry.history.json
          target/release/pcbex sign-approval-log-gossip-organization-registry-history-checkpoint \
            build/action-quorum/gossip-registry.history.json \
            --authority-private-key build/action-quorum/gossip-registry.successor.key \
            --issued-at-unix 13 \
            --output build/action-quorum/gossip-registry.history.checkpoint.json
          for witness in a b; do
            target/release/pcbex approval-keygen \
              --private-key "build/action-quorum/gossip-history-witness-$witness.key" \
              --public-key "build/action-quorum/gossip-history-witness-$witness.pub"
            target/release/pcbex init-approval-log-gossip-organization-registry-history-checkpoint-witness-trust \
              --witness-id "history-witness-$witness" \
              --public-key "build/action-quorum/gossip-history-witness-$witness.pub" \
              --output "build/action-quorum/gossip-history-witness-$witness.trust.json"
          done
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/gossip-history-witness-a.next.key \
            --public-key build/action-quorum/gossip-history-witness-a.next.pub
          target/release/pcbex sign-approval-log-gossip-organization-registry-history-checkpoint-witness-key-rotation \
            build/action-quorum/gossip-history-witness-a.trust.json \
            --old-private-key build/action-quorum/gossip-history-witness-a.key \
            --new-private-key build/action-quorum/gossip-history-witness-a.next.key \
            --rotated-at-unix 14 \
            --output build/action-quorum/gossip-history-witness-a.rotation.json
          target/release/pcbex apply-approval-log-gossip-organization-registry-history-checkpoint-witness-key-rotation \
            build/action-quorum/gossip-history-witness-a.trust.json \
            build/action-quorum/gossip-history-witness-a.rotation.json \
            --output build/action-quorum/gossip-history-witness-a.rotated.trust.json \
            --public-key-output build/action-quorum/gossip-history-witness-a.rotated.pub
          target/release/pcbex sign-approval-log-gossip-organization-registry-history-checkpoint-witness \
            build/action-quorum/gossip-registry.history.json \
            build/action-quorum/gossip-registry.history.checkpoint.json \
            --witness-id history-witness-a \
            --witness-private-key build/action-quorum/gossip-history-witness-a.next.key \
            --witnessed-at-unix 15 \
            --output build/action-quorum/gossip-history-witness-a.json
          target/release/pcbex sign-approval-log-gossip-organization-registry-history-checkpoint-witness \
            build/action-quorum/gossip-registry.history.json \
            build/action-quorum/gossip-registry.history.checkpoint.json \
            --witness-id history-witness-b \
            --witness-private-key build/action-quorum/gossip-history-witness-b.key \
            --witnessed-at-unix 16 \
            --output build/action-quorum/gossip-history-witness-b.json
          RUNNER_TRACKING_ID="" nohup setsid python3 \
            scripts/tests/remote_approval_registry_history_witness_server.py \
            --witness build/action-quorum/gossip-history-witness-a.json \
            --endpoint-output build/action-quorum/gossip-history-witness.endpoint \
            > build/action-quorum/gossip-history-witness.server.log 2>&1 </dev/null &
          printf '%s\n' "$!" >> build/action-server-pids
          for attempt in {1..50}; do
            [[ -s build/action-quorum/gossip-history-witness.endpoint ]] && break
            sleep 0.1
          done
          test -s build/action-quorum/gossip-history-witness.endpoint
          printf 'gossip-history-witness-endpoint=%s\n' \
            "$(tr -d '\n' < build/action-quorum/gossip-history-witness.endpoint)" \
            >> "$GITHUB_OUTPUT"
          for witness in a b; do
            target/release/pcbex approval-keygen \
              --private-key "build/action-quorum/witness-$witness.key" \
              --public-key "build/action-quorum/witness-$witness.pub"
            target/release/pcbex witness-approval-log \
              build/action-quorum/approval-log.checkpoint.json \
              --private-key "build/action-quorum/witness-$witness.key" \
              --witness-id "witness-$witness" \
              --observed-at-unix 2 \
              --output "build/action-quorum/witness-$witness.json"
          done
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/remote-witness.key \
            --public-key build/action-quorum/remote-witness.pub
          target/release/pcbex init-approval-log-witness-trust \
            --witness-id action-remote-witness \
            --public-key build/action-quorum/remote-witness.pub \
            --output build/action-quorum/remote-witness.trust.json
          RUNNER_TRACKING_ID="" nohup setsid python3 scripts/tests/remote_witness_server.py \
            --pcbex target/release/pcbex \
            --checkpoint build/action-quorum/approval-log.checkpoint.json \
            --private-key build/action-quorum/remote-witness.key \
            --endpoint-output build/action-quorum/remote-witness.endpoint \
            > build/action-quorum/remote-witness.server.log 2>&1 </dev/null &
          printf '%s\n' "$!" >> build/action-server-pids
          for attempt in {1..50}; do
            [[ -s build/action-quorum/remote-witness.endpoint ]] && break
            sleep 0.1
          done
          test -s build/action-quorum/remote-witness.endpoint
          printf 'remote-witness-endpoint=%s\n' \
            "$(tr -d '\n' < build/action-quorum/remote-witness.endpoint)" \
            >> "$GITHUB_OUTPUT"
      - name: Exercise boardless AI schematic approval action
        id: boardless-ai-approval
        uses: ./actions/ai-schematic-approval
        with:
          schematic: crates/pcbex-cli/tests/fixtures/approved-mcu.kicad_sch
          request: build/action-quorum/request.json
          approval-files: |
            build/action-quorum/approval-a.json
            build/action-quorum/approval-b.json
          response-files: |
            build/action-quorum/response-a.json
            build/action-quorum/response-b.json
          policy-pack: build/action-quorum/policy-pack.json
          session: build/action-quorum/session.json
          minimum-approvals: "1"
          minimum-distinct-providers: "1"
          minimum-distinct-models: "1"
          require-quorum: "true"
          output-dir: build/boardless-ai-approval
          upload-artifact: "false"
      - name: Verify boardless AI schematic approval outputs
        env:
          STATUS: ${{ steps.boardless-ai-approval.outputs.status }}
          ARTIFACT_DIR: ${{ steps.boardless-ai-approval.outputs.artifact-dir }}
          REPORT: ${{ steps.boardless-ai-approval.outputs.ai-approval-quorum }}
          SUMMARY: ${{ steps.boardless-ai-approval.outputs.ai-approval-quorum-summary }}
          QUORUM_MET: ${{ steps.boardless-ai-approval.outputs.ai-approval-quorum-met }}
          REQUEST_SHA256: ${{ steps.boardless-ai-approval.outputs.request-sha256 }}
          SCHEMATIC_IR_SHA256: ${{ steps.boardless-ai-approval.outputs.schematic-ir-sha256 }}
          INPUT_SNAPSHOT_SHA256: ${{ steps.boardless-ai-approval.outputs.input-snapshot-sha256 }}
        run: |
          test "$STATUS" = "ok"
          test "$ARTIFACT_DIR" = "build/boardless-ai-approval"
          test "$REPORT" = "build/boardless-ai-approval/ai-approval-quorum.json"
          test "$SUMMARY" = "build/boardless-ai-approval/ai-approval-quorum.md"
          test "$QUORUM_MET" = "true"
          test "$REQUEST_SHA256" = "$(jq -r '.request_sha256' build/action-quorum/request.json)"
          test "$SCHEMATIC_IR_SHA256" = "$(jq -r '.electrical_review.schematic_sha256' build/action-quorum/request.json)"
          test "${#INPUT_SNAPSHOT_SHA256}" -eq 64
          test -z "${INPUT_SNAPSHOT_SHA256//[0-9a-f]/}"
          test -s "$REPORT"
          test -s "$SUMMARY"
          jq -e \
            --arg request_sha256 "$REQUEST_SHA256" \
            '.schema_version == 1
             and (.session_sha256 | test("^[0-9a-f]{64}$"))
             and .request_sha256 == $request_sha256
             and .issued_at_unix <= .evaluated_at_unix
             and .evaluated_at_unix <= .expires_at_unix
             and .quorum.schema_version == 1
             and .quorum.request_sha256 == $request_sha256
             and .quorum.policy == {
               minimum_approvals: 1,
               minimum_distinct_providers: 1,
               minimum_distinct_models: 1
             }
             and .quorum.counts == {
               members: 2,
               approvals: 1,
               rejections: 1,
               distinct_providers: 1,
               distinct_models: 1
             }
             and ([.quorum.members[] | select(.signer_id == "reviewer-a")][0].approved == true)
             and ([.quorum.members[] | select(.signer_id == "reviewer-b")][0].approved == false)
             and ([.quorum.members[] | select(.signer_id == "reviewer-b")][0].gate_failures
               | index("ai_decision_needs_human") != null)
             and .quorum.quorum_met == true
             and .quorum.quorum_failures == []' \
            "$REPORT" >/dev/null
          grep -F '# Time-bound AI schematic approval quorum' "$SUMMARY" >/dev/null
          grep -F 'Result: quorum met' "$SUMMARY" >/dev/null
          ! grep -F 'reviewer-a' "$SUMMARY" >/dev/null
