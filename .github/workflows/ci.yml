          APPROVAL_LOG_GOSSIP_QUORUM_MET: ${{ steps.pcbex.outputs.approval-log-gossip-quorum-met }}
          APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_AUDIT: ${{ steps.pcbex.outputs.approval-log-gossip-organization-registry-history-audit }}
          APPROVAL_LOG_GOSSIP_REGISTRY_HISTORY_FINAL: ${{ steps.pcbex.outputs.approval-log-gossip-organization-registry-history-final }}
