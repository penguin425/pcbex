name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware-ci-action:
    name: Hardware CI action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Prepare manufacturing feedback fixture
        run: |
          mkdir -p build/action-feedback
          board_sha256="$(sha256sum examples/simple.kicad_pcb | cut -d' ' -f1)"
          jq -n \
            --arg board_sha256 "$board_sha256" \
            '{
              schema_version: 1,
              id: "action-smoke-lot",
              manufacturer: {
                id: "example-fab",
                process: "CI fixture"
              },
              received_on: "2026-07-29",
              board_sha256: $board_sha256,
              disposition: "accepted",
              findings: [{
                id: "inspection-record",
                category: "other",
                severity: "info",
                message: "Inspection record is attached.",
                evidence: ["inspection.txt"]
              }]
            }' > build/action-feedback/declaration.json
          printf '%s\n' 'inspection passed' > build/action-feedback/inspection.txt
      - name: Prepare AI approval quorum fixture
        id: approval-fixture
        run: |
          cargo build --package pcbex --release --locked
          mkdir -p build/action-quorum
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/reviewer-a.key \
            --public-key build/action-quorum/reviewer-a.pub
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/reviewer-b.key \
            --public-key build/action-quorum/reviewer-b.pub
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/engineer-a.key \
            --public-key build/action-quorum/engineer-a.pub
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/engineer-b.key \
            --public-key build/action-quorum/engineer-b.pub
          target/release/pcbex electrical-policy \
            --output build/action-quorum/electrical-policy.json
          jq '
            .rules |= with_entries(
              if .value.severity == "error"
              then .value.enabled = false
              else .
              end
            )
          ' build/action-quorum/electrical-policy.json \
            > build/action-quorum/electrical-policy.approved.json
          jq \
            --slurpfile electrical build/action-quorum/electrical-policy.approved.json \
            --arg key_a "$(tr -d '\n' < build/action-quorum/reviewer-a.pub)" \
            --arg key_b "$(tr -d '\n' < build/action-quorum/reviewer-b.pub)" \
            --arg human_key_a "$(tr -d '\n' < build/action-quorum/engineer-a.pub)" \
            --arg human_key_b "$(tr -d '\n' < build/action-quorum/engineer-b.pub)" \
            '
              .electrical_policy = $electrical[0]
              | .require_simulation_evidence = false
              | .ai_requirements = [{
                  id: "power",
                  text: "Power input treatment is intentional"
                }]
              | .trusted_approval_keys = [
                  {signer_id: "reviewer-a", public_key: $key_a},
                  {signer_id: "reviewer-b", public_key: $key_b}
                ]
              | .trusted_human_escalation_keys = [
                  {signer_id: "engineer-a", public_key: $human_key_a},
                  {signer_id: "engineer-b", public_key: $human_key_b}
                ]
            ' examples/acme-policy-pack.json > build/action-quorum/policy-pack.json
          target/release/pcbex check-schematic examples/simple.kicad_sch \
            --policy-pack build/action-quorum/policy-pack.json \
            --output build/action-quorum/electrical-review.json \
            --require-approved
          target/release/pcbex prepare-ai-review examples/simple.kicad_sch \
            --electrical-review build/action-quorum/electrical-review.json \
            --policy-pack build/action-quorum/policy-pack.json \
            --output build/action-quorum/request.json \
            --session-output build/action-quorum/session.json
          request_sha256="$(jq -r '.request_sha256' build/action-quorum/request.json)"
          for reviewer in a b; do
            jq -n \
              --arg request_sha256 "$request_sha256" \
              --arg provider "provider-$reviewer" \
              --arg model "model-$reviewer" \
              --arg decision "$([[ "$reviewer" == "b" ]] && printf needs_human || printf approve)" \
              '{
                schema_version: 1,
                request_sha256: $request_sha256,
                model: {provider: $provider, model: $model, version: "1"},
                decision: $decision,
                summary: (if $decision == "approve"
                  then "Bound deterministic evidence supports approval."
                  else "Independent engineering judgment is required."
                end),
                requirements: [{
                  id: "power",
                  status: "pass",
                  rationale: "The deterministic electrical review is approved.",
                  evidence_refs: ["electrical-review"]
                }],
                risks: []
              }' > "build/action-quorum/response-$reviewer.json"
            target/release/pcbex sign-ai-review \
              build/action-quorum/request.json \
              "build/action-quorum/response-$reviewer.json" \
              --private-key "build/action-quorum/reviewer-$reviewer.key" \
              --signer-id "reviewer-$reviewer" \
              --session build/action-quorum/session.json \
              --output "build/action-quorum/approval-$reviewer.json"
          done
          target/release/pcbex verify-ai-quorum \
            build/action-quorum/request.json \
            --approval build/action-quorum/approval-a.json \
            --approval build/action-quorum/approval-b.json \
            --response build/action-quorum/response-a.json \
            --response build/action-quorum/response-b.json \
            --policy-pack build/action-quorum/policy-pack.json \
            --baseline-schematic examples/simple.kicad_sch \
            --current-schematic examples/simple.kicad_sch \
            --reviewer-routing-policy examples/reviewer-routing-policy.json \
            --session build/action-quorum/session.json \
            --output build/action-quorum/retained-quorum.json
          for engineer in a b; do
            target/release/pcbex sign-human-escalation \
              build/action-quorum/request.json \
              --session build/action-quorum/session.json \
              --ai-quorum build/action-quorum/retained-quorum.json \
              --private-key "build/action-quorum/engineer-$engineer.key" \
              --signer-id "engineer-$engineer" \
              --decision approve \
              --reason "Independent engineering review passed." \
              --ticket HW-42 \
              --output "build/action-quorum/human-$engineer.json"
          done
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/transparency.key \
            --public-key build/action-quorum/transparency.pub
          target/release/pcbex init-approval-log \
            --log-id action-approval-log \
            --output build/action-quorum/approval-log.empty.json
          target/release/pcbex append-approval-log \
            build/action-quorum/approval-log.empty.json \
            --artifact build/action-quorum/retained-quorum.json \
            --kind ai-quorum-report \
            --recorded-at-unix 1 \
            --output build/action-quorum/approval-log.json
          target/release/pcbex sign-approval-log \
            build/action-quorum/approval-log.json \
            --private-key build/action-quorum/transparency.key \
            --signer-id action-security-log \
            --output build/action-quorum/approval-log.checkpoint.json
          for witness in a b; do
            target/release/pcbex approval-keygen \
              --private-key "build/action-quorum/witness-$witness.key" \
              --public-key "build/action-quorum/witness-$witness.pub"
            target/release/pcbex witness-approval-log \
              build/action-quorum/approval-log.checkpoint.json \
              --private-key "build/action-quorum/witness-$witness.key" \
              --witness-id "witness-$witness" \
              --observed-at-unix 2 \
              --output "build/action-quorum/witness-$witness.json"
          done
          target/release/pcbex approval-keygen \
            --private-key build/action-quorum/remote-witness.key \
            --public-key build/action-quorum/remote-witness.pub
          target/release/pcbex init-approval-log-witness-trust \
            --witness-id action-remote-witness \
            --public-key build/action-quorum/remote-witness.pub \
            --output build/action-quorum/remote-witness.trust.json
          RUNNER_TRACKING_ID="" nohup python3 scripts/tests/remote_witness_server.py \
            --pcbex target/release/pcbex \
            --checkpoint build/action-quorum/approval-log.checkpoint.json \
            --private-key build/action-quorum/remote-witness.key \
            --endpoint-output build/action-quorum/remote-witness.endpoint \
            > build/action-quorum/remote-witness.server.log 2>&1 </dev/null &
          for attempt in {1..50}; do
            [[ -s build/action-quorum/remote-witness.endpoint ]] && break
            sleep 0.1
          done
          test -s build/action-quorum/remote-witness.endpoint
          printf 'remote-witness-endpoint=%s\n' \
            "$(tr -d '\n' < build/action-quorum/remote-witness.endpoint)" \
            >> "$GITHUB_OUTPUT"
      - name: Exercise the public composite action
        id: pcbex
        uses: ./
        env:
          PCBEX_REMOTE_WITNESS_ALLOW_HTTP_LOOPBACK: "true"
        with:
          board: examples/simple.kicad_pcb
          baseline-board: examples/simple.kicad_pcb
          schematic: examples/simple.kicad_sch
          baseline-schematic: examples/simple.kicad_sch
          schematic-reviewer-routing-policy: examples/reviewer-routing-policy.json
          fail-on-schematic-review: "true"
          fail-on-unrouted-schematic-review: "true"
          policy-pack: build/action-quorum/policy-pack.json
          ai-review-request: build/action-quorum/request.json
          ai-review-session: build/action-quorum/session.json
          ai-approval-files: |
            build/action-quorum/approval-a.json
            build/action-quorum/approval-b.json
          ai-response-files: |
            build/action-quorum/response-a.json
            build/action-quorum/response-b.json
          human-escalation-ai-quorum: build/action-quorum/retained-quorum.json
          human-escalation-files: |
            build/action-quorum/human-a.json
            build/action-quorum/human-b.json
          fail-on-schematic-approval: "true"
          approval-transparency-log: build/action-quorum/approval-log.json
          approval-log-checkpoint: build/action-quorum/approval-log.checkpoint.json
          approval-log-public-key: build/action-quorum/transparency.pub
          fail-on-approval-log: "true"
          approval-log-witness-files: |
            build/action-quorum/witness-a.json
            build/action-quorum/witness-b.json
          approval-log-witness-public-keys: |
            build/action-quorum/witness-a.pub
            build/action-quorum/witness-b.pub
          remote-witness-endpoint: ${{ steps.approval-fixture.outputs.remote-witness-endpoint }}
          remote-witness-trust-state: build/action-quorum/remote-witness.trust.json
          fail-on-approval-log-witnesses: "true"
          manufacturing-feedback-declaration: build/action-feedback/declaration.json
          manufacturing-feedback-artifacts: build/action-feedback/inspection.txt
          fail-on-manufacturing-feedback: "true"
          output-dir: build/action-analysis
          fail-on-violations: "false"
          fail-on-regressions: "true"
          artifact-name: pcbex-action-smoke
          pr-comment: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          github-token: ${{ github.token }}
          comment-id: action-smoke
      - name: Verify action outputs
        env:
          ARTIFACT_DIR: ${{ steps.pcbex.outputs.artifact-dir }}
          COMMENT_URL: ${{ steps.pcbex.outputs.comment-url }}
          VIOLATION_COUNT: ${{ steps.pcbex.outputs.violation-count }}
          REGRESSION: ${{ steps.pcbex.outputs.regression }}
          MANUFACTURING_FEEDBACK: ${{ steps.pcbex.outputs.manufacturing-feedback }}
          MANUFACTURING_FEEDBACK_PASSED: ${{ steps.pcbex.outputs.manufacturing-feedback-passed }}
          SCHEMATIC_DIFF: ${{ steps.pcbex.outputs.schematic-diff }}
          SCHEMATIC_REVIEW_REQUIRED: ${{ steps.pcbex.outputs.schematic-review-required }}
          SCHEMATIC_REVIEWER_ROUTING: ${{ steps.pcbex.outputs.schematic-reviewer-routing }}
          SCHEMATIC_REVIEW_ALL_ROUTED: ${{ steps.pcbex.outputs.schematic-review-all-routed }}
          AI_APPROVAL_QUORUM: ${{ steps.pcbex.outputs.ai-approval-quorum }}
          AI_APPROVAL_QUORUM_MET: ${{ steps.pcbex.outputs.ai-approval-quorum-met }}
          HUMAN_ESCALATION: ${{ steps.pcbex.outputs.human-escalation }}
          HUMAN_ESCALATION_APPROVED: ${{ steps.pcbex.outputs.human-escalation-approved }}
          SCHEMATIC_APPROVAL_MET: ${{ steps.pcbex.outputs.schematic-approval-met }}
          APPROVAL_LOG_VERIFICATION: ${{ steps.pcbex.outputs.approval-log-verification }}
          APPROVAL_LOG_VERIFIED: ${{ steps.pcbex.outputs.approval-log-verified }}
          REMOTE_WITNESS: ${{ steps.pcbex.outputs.remote-witness }}
          REMOTE_WITNESS_RECEIPT: ${{ steps.pcbex.outputs.remote-witness-receipt }}
          APPROVAL_LOG_WITNESS_QUORUM: ${{ steps.pcbex.outputs.approval-log-witness-quorum }}
          APPROVAL_LOG_WITNESS_QUORUM_MET: ${{ steps.pcbex.outputs.approval-log-witness-quorum-met }}
          SHOULD_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          test -s "$ARTIFACT_DIR/pr-comment.md"
          grep -F '# pcbex hardware analysis' "$ARTIFACT_DIR/pr-comment.md"
          grep -F '# pcbex baseline comparison' "$ARTIFACT_DIR/pr-comment.md"
          test "$(jq -r '.configuration.dfm_profile.id' "$ARTIFACT_DIR/current/run.json")" = "acme-standard-4layer-v1"
          test "$(jq -r '.dfm_profile_file' "$ARTIFACT_DIR/current/run.json")" = "null"
          test "$(jq -r '.configuration.organization_policy_pack' "$ARTIFACT_DIR/current/run.json")" = "acme-production-v1"
          test "$(jq -r '.policy_pack_file.sha256 | length' "$ARTIFACT_DIR/current/run.json")" = "64"
          test "$VIOLATION_COUNT" = "1"
          test "$REGRESSION" = "false"
          test -s "$MANUFACTURING_FEEDBACK"
          test "$MANUFACTURING_FEEDBACK_PASSED" = "true"
          test "$(jq -r '.declaration.id' "$MANUFACTURING_FEEDBACK")" = "action-smoke-lot"
          test -s "$SCHEMATIC_DIFF"
          test "$SCHEMATIC_REVIEW_REQUIRED" = "false"
          test "$(jq -r '.changed' "$SCHEMATIC_DIFF")" = "false"
          test -s "$SCHEMATIC_REVIEWER_ROUTING"
          test "$SCHEMATIC_REVIEW_ALL_ROUTED" = "true"
          test "$(jq -r '.route_count' "$SCHEMATIC_REVIEWER_ROUTING")" = "0"
          test -s "$AI_APPROVAL_QUORUM"
          test "$AI_APPROVAL_QUORUM_MET" = "false"
          test "$(jq -r '.routed_quorum.quorum.counts.approvals' "$AI_APPROVAL_QUORUM")" = "1"
          test "$(jq -r '.routed_quorum.quorum.counts.distinct_providers' "$AI_APPROVAL_QUORUM")" = "1"
          test "$(jq -r '.routed_quorum.routed_quorum_met' "$AI_APPROVAL_QUORUM")" = "false"
          test "$(jq -r '.session.session_sha256 | length' "$AI_APPROVAL_QUORUM")" = "64"
          test -s "$HUMAN_ESCALATION"
          test "$HUMAN_ESCALATION_APPROVED" = "true"
          test "$SCHEMATIC_APPROVAL_MET" = "true"
          test "$(jq -r '.approvals' "$HUMAN_ESCALATION")" = "2"
          test -s "$APPROVAL_LOG_VERIFICATION"
          test "$APPROVAL_LOG_VERIFIED" = "true"
          test "$(jq -r '.entry_count' "$APPROVAL_LOG_VERIFICATION")" = "1"
          test -s "$REMOTE_WITNESS"
          test -s "$REMOTE_WITNESS_RECEIPT"
          test "$(jq -r '.witness_id' "$REMOTE_WITNESS")" = "action-remote-witness"
          test "$(jq -r '.verified' "$REMOTE_WITNESS_RECEIPT")" = "true"
          test -s "$APPROVAL_LOG_WITNESS_QUORUM"
          test "$APPROVAL_LOG_WITNESS_QUORUM_MET" = "true"
          test "$(jq -r '.valid_witnesses' "$APPROVAL_LOG_WITNESS_QUORUM")" = "3"
          if [[ "$SHOULD_COMMENT" == "true" ]]; then
            [[ "$COMMENT_URL" == https://github.com/* ]]
          else
            test -z "$COMMENT_URL"
          fi
      - name: Prepare signed policy trust fixture
        run: |
          mkdir -p build/action-policy
          target/release/pcbex policy-keygen \
            --private-key build/action-policy/policy.key \
            --public-key build/action-policy/policy.pub
          target/release/pcbex sign-policy-pack examples/acme-policy-pack.json \
            --private-key build/action-policy/policy.key \
            --signer-id hardware-security \
            --output build/action-policy/policy.signed.json
          target/release/pcbex verify-policy-pack \
            build/action-policy/policy.signed.json \
            --public-key build/action-policy/policy.pub \
            --output build/action-policy/accepted-policy.json \
            --state-output build/action-policy/accepted-state.json
      - name: Exercise signed policy rollback protection
        id: signed-pcbex
        uses: ./
        with:
          board: examples/simple.kicad_pcb
          signed-policy-pack: build/action-policy/policy.signed.json
          policy-public-key: build/action-policy/policy.pub
          policy-trust-state: build/action-policy/accepted-state.json
          output-dir: build/signed-action-analysis
          fail-on-violations: "false"
          artifact-name: pcbex-signed-action-smoke
      - name: Verify signed policy trust output
        env:
          TRUST_STATE: ${{ steps.signed-pcbex.outputs.verified-policy-trust-state }}
        run: |
          test -s "$TRUST_STATE"
          test "$(jq -r '.accepted_revision' "$TRUST_STATE")" = "1"
          test "$(jq -r '.policy_pack_id' "$TRUST_STATE")" = "acme-production-v1"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Compile routing benchmarks
        run: cargo bench -p pcbex-core --bench routing --no-run --locked
      - name: Enforce deterministic routing performance budgets
        run: cargo test -p pcbex-core --test performance_budget --locked -- --nocapture
      - name: Run practical routing regression corpus
        run: scripts/regression-corpus.sh target/release/pcbex build/regression-corpus
      - name: Verify completion audit is current
        run: python3 scripts/update-completion-audit.py --check
      - name: Test release audit
        run: python3 -m unittest discover -s scripts/tests -v

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run agent tests
        env:
          PYTHONPATH: agent/src
        run: python -m unittest discover -s agent/tests -v
