name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: rustup default stable
      - name: Verify tag and versions
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

          rust_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "pcbex") | .version'
          )"
          python_version="$(
            python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("agent/pyproject.toml").read_text())["project"]["version"])'
          )"

          test "$rust_version" = "$python_version"
          test "$GITHUB_REF_NAME" = "v$rust_version"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run agent tests
        env:
          PYTHONPATH: agent/src
        run: python -m unittest discover -s agent/tests -v
      - name: Test release audit
        run: python -m unittest discover -s scripts/tests -v

  prepare:
    name: Prepare draft release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reuse draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
                --json isDraft --jq .isDraft
            )"
            test "$is_draft" = "true"
          else
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "pcbex $tag"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
            extension: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar
            extension: tar.gz
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar
            extension: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            extension: zip
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      ASSET_NAME: pcbex-${{ github.ref_name }}-${{ matrix.target }}
      ARCHIVE_NAME: pcbex-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.extension }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build
        shell: bash
        run: cargo build -p pcbex --release --locked --target "${{ matrix.target }}"
      - name: Package Unix binary
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          mkdir -p "dist/$ASSET_NAME"
          cp "target/${{ matrix.target }}/release/pcbex" "dist/$ASSET_NAME/"
          cp README.md LICENSE Cargo.lock "dist/$ASSET_NAME/"
          tar -C dist -czf "dist/$ARCHIVE_NAME" "$ASSET_NAME"
          (
            cd dist
            shasum -a 256 "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          )
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/$env:ASSET_NAME" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/pcbex.exe" "dist/$env:ASSET_NAME/"
          Copy-Item README.md, LICENSE, Cargo.lock "dist/$env:ASSET_NAME/"
          Compress-Archive -Path "dist/$env:ASSET_NAME" -DestinationPath "dist/$env:ARCHIVE_NAME"
          $hash = (Get-FileHash "dist/$env:ARCHIVE_NAME" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ARCHIVE_NAME" |
            Set-Content "dist/$env:ARCHIVE_NAME.sha256" -NoNewline
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist/${{ env.ASSET_NAME }}
          format: spdx-json
          output-file: dist/${{ env.ASSET_NAME }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/${{ env.ARCHIVE_NAME }}
      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/${{ env.ARCHIVE_NAME }}
          sbom-path: dist/${{ env.ASSET_NAME }}.spdx.json
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/$ARCHIVE_NAME" \
            "dist/$ARCHIVE_NAME.sha256" \
            "dist/$ASSET_NAME.spdx.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  audit:
    name: Audit release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # GitHub requires contents:write to read draft releases and their assets.
      # The audit script itself performs only read/download operations.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify roadmap, release metadata, assets, checksums, and SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-audit.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --expected-sha "$GITHUB_SHA" \
            --allow-draft

  publish:
    name: Publish release
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
